<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>婚禮祝福上傳｜劉育名 & 翁佳瑜</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fffaf3;color:#5a4438;font-family:"Noto Serif TC","PingFang TC",serif}
body{max-width:520px;margin:0 auto;padding:30px 20px 50px}
h1{margin:0 0 10px;text-align:center;font-size:30px;font-weight:600}
.subtitle{margin:0 0 26px;text-align:center;color:#8b7064;font-size:15px}
.card{padding:24px 20px;background:rgba(255,255,255,.7);border:1px solid rgba(185,120,104,.18);border-radius:20px;box-shadow:0 10px 35px rgba(90,68,56,.08)}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}
input[type=text],textarea{width:100%;padding:12px 14px;border:1px solid #dbc8bd;border-radius:12px;background:#fff;color:#5a4438;font:inherit;outline:none}
input[type=text]:focus,textarea:focus{border-color:#b97868;box-shadow:0 0 0 3px rgba(185,120,104,.1)}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.file-box{margin-top:8px;padding:14px;border:1px dashed #cba99b;border-radius:14px;background:#fffdf9}
input[type=file]{width:100%;font-size:14px}
.preview{display:none;margin-top:12px;text-align:center}
.preview img{max-width:100%;max-height:260px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.status{min-height:24px;margin:15px 0 5px;text-align:center;font-size:14px;line-height:1.5}
.status.success{color:#65805c}.status.error{color:#a04f4f}
button{width:100%;margin-top:10px;padding:13px 18px;border:0;border-radius:25px;background:#b97868;color:#fff;font:600 16px inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.note{margin-top:18px;text-align:center;color:#9a8378;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<h1>留下你的祝福</h1>
<p class="subtitle">上傳照片，或寫一句祝福</p>

<div class="card">
<form id="f">
<label for="n">你的名字</label>
<input id="n" type="text" maxlength="30" placeholder="例如：小明" autocomplete="name">

<label for="t">給新人的祝福</label>
<textarea id="t" maxlength="300" placeholder="寫一句想對我們說的話 ♡"></textarea>

<label for="p">上傳照片</label>
<div class="file-box">
<input id="p" type="file" accept="image/*">
<div class="preview" id="preview">
<img id="previewImg" alt="照片預覽">
</div>
</div>

<div id="s" class="status"></div>
<button id="b" type="submit">送出祝福</button>
</form>
</div>

<div class="note">照片會自動縮小後上傳，<br>並顯示在婚禮現場照片牆。</div>

<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbydMwxvks8TSSGfMHkJvOTiUwdNXKzCHKHJ5JxbnYu-CHi9hGSilWeHbMjC3KUijzit/exec";

const form=document.getElementById("f");
const nameInput=document.getElementById("n");
const textInput=document.getElementById("t");
const photoInput=document.getElementById("p");
const status=document.getElementById("s");
const button=document.getElementById("b");
const preview=document.getElementById("preview");
const previewImg=document.getElementById("previewImg");

photoInput.addEventListener("change",()=>{
  const file=photoInput.files[0];
  if(!file){preview.style.display="none";previewImg.src="";return;}
  const reader=new FileReader();
  reader.onload=()=>{previewImg.src=reader.result;preview.style.display="block";};
  reader.readAsDataURL(file);
});

async function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);

    img.onload=async()=>{
      URL.revokeObjectURL(url);

      try{
        const MAX_SIZE=1000;
        let w=img.naturalWidth;
        let h=img.naturalHeight;

        if(!w||!h){
          reject(new Error("無法讀取圖片尺寸"));
          return;
        }

        const scale=Math.min(1,MAX_SIZE/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));
        h=Math.max(1,Math.round(h*scale));

        const canvas=document.createElement("canvas");
        canvas.width=w;
        canvas.height=h;

        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);

        /*
         * 先以品質 0.72 輸出。
         * 如果仍然太大，就逐步降低品質。
         */
        let quality=0.72;
        let blob=null;

        for(let i=0;i<6;i++){
          blob=await new Promise(r=>
            canvas.toBlob(r,"image/jpeg",quality)
          );

          if(!blob)break;

          if(blob.size<=250*1024 || quality<=0.42){
            break;
          }

          quality-=0.06;
        }

        if(!blob){
          reject(new Error("圖片壓縮失敗"));
          return;
        }

        const reader=new FileReader();

        reader.onload=()=>{
          resolve({
            name:(file.name||"photo.jpg")
              .replace(/\.[^.]+$/,"")+".jpg",
            type:"image/jpeg",
            data:reader.result,
            size:blob.size,
            width:w,
            height:h
          });
        };

        reader.onerror=()=>{
          reject(new Error("圖片讀取失敗"));
        };

        reader.readAsDataURL(blob);

      }catch(err){
        reject(err);
      }
    };

    img.onerror=()=>{
      URL.revokeObjectURL(url);
      reject(new Error("無法讀取這張圖片"));
    };

    img.src=url;
  });
}
function submitToAppsScript(payload){
  return new Promise((resolve,reject)=>{
    const id=
      "uploadFrame_"+Date.now()+"_"+Math.floor(Math.random()*10000);

    /*
     * 不使用 display:none。
     * 某些瀏覽器 / WebView 對 display:none 的 iframe
     * 搭配跨網域 POST 會有機會失去 target，導致整頁跳到
     * script.googleusercontent.com。
     *
     * iframe 保留在頁面上，但完全移出畫面。
     */
    const iframe=document.createElement("iframe");
    iframe.name=id;
    iframe.id=id;
    iframe.title="upload-response";
    iframe.style.position="fixed";
    iframe.style.left="-10000px";
    iframe.style.top="0";
    iframe.style.width="1px";
    iframe.style.height="1px";
    iframe.style.border="0";
    iframe.style.opacity="0";
    iframe.setAttribute("aria-hidden","true");

    const postForm=document.createElement("form");
    postForm.method="POST";
    postForm.action=ENDPOINT;
    postForm.target=id;
    postForm.enctype="application/x-www-form-urlencoded";
    postForm.style.position="fixed";
    postForm.style.left="-10000px";
    postForm.style.top="0";
    postForm.style.width="1px";
    postForm.style.height="1px";
    postForm.style.opacity="0";
    postForm.style.pointerEvents="none";

    const input=document.createElement("input");
    input.type="hidden";
    input.name="payload";
    input.value=JSON.stringify(payload);
    postForm.appendChild(input);

    let submitted=false;
    let finished=false;

    const cleanup=()=>{
      clearTimeout(timer);
      setTimeout(()=>{
        iframe.remove();
        postForm.remove();
      },100);
    };

    const finishSuccess=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve();
    };

    const finishError=(err)=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(err);
    };

    /*
     * iframe 第一次 load 是 about:blank。
     * 真正 POST 後的第二次 load 才算完成。
     */
    iframe.addEventListener("load",()=>{
      if(!submitted)return;
      finishSuccess();
    });

    const timer=setTimeout(()=>{
      finishError(new Error("上傳逾時"));
    },30000);

    /*
     * 先把 iframe + form 放進 DOM，
     * 確保 target 已存在，再 submit。
     */
    document.body.appendChild(iframe);
    document.body.appendChild(postForm);

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        if(finished)return;
        submitted=true;
        postForm.submit();
      });
    });
  });
}

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const name=nameInput.value.trim()||"親友";
  const text=textInput.value.trim();
  const file=photoInput.files[0];

  if(!file&&!text){
    status.className="status error";
    status.textContent="請上傳照片或寫下祝福 ♡";
    return;
  }

  button.disabled=true;
  status.className="status";
  status.textContent=file?"正在準備照片…":"正在送出祝福…";

  try{
    let photo=null;
    if(file){
      photo=await compressImage(file);
      status.textContent="照片準備完成，正在送出…";
    }

    await submitToAppsScript({name,text,photo});

    status.className="status success";
    status.textContent="已成功送出 ♡ 照片會很快出現在照片牆！";

    form.reset();
    preview.style.display="none";
    previewImg.src="";
  }catch(error){
    console.error(error);
    status.className="status error";
    status.textContent="上傳失敗，請確認網路後再試一次。";
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
