<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>婚禮祝福上傳</title><style>:root{--ink:#5a4438;--rose:#b97868}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:24px 16px;background:linear-gradient(145deg,#f5e6d8,#fffaf3 48%,#e8eee6);color:var(--ink);font-family:Georgia,"Noto Serif TC",serif}.card{max-width:520px;margin:auto;padding:30px 24px 26px;background:#fffaf3ef;border:1px solid #d7b99f;border-radius:24px;box-shadow:0 18px 50px #80604b25}.eyebrow{text-align:center;letter-spacing:.22em;font-size:12px;color:#a67a68}.heart{display:block;text-align:center;color:var(--rose);font-size:26px;margin:6px 0}h1{text-align:center;font-size:29px;font-weight:500;margin:0 0 6px}.intro{text-align:center;color:#8f776b;font-size:14px;margin:0 0 24px}label{display:block;margin:15px 0 7px;font-size:14px}input,textarea{width:100%;border:1px solid #dbc6b3;border-radius:12px;background:#fffdf9;padding:12px 13px;color:var(--ink);font:inherit;font-size:16px}textarea{min-height:120px;resize:vertical}input[type=file]{padding:10px;background:#fff8ef;font-size:14px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:var(--rose);color:white;font:600 16px inherit;cursor:pointer}button:disabled{opacity:.55}.status{min-height:24px;margin-top:14px;text-align:center;font-size:14px}.preview{display:none;width:100%;max-height:240px;object-fit:contain;margin-top:10px;border-radius:12px}.note{text-align:center;color:#a68d80;font-size:12px;margin-top:18px}</style></head><body><main class="card"><div class="eyebrow">YU-MING & JIA-YU</div><span class="heart">♡</span><h1>留下你的祝福</h1><p class="intro">上傳一張照片，或寫一句想對我們說的話</p><form id="form"><label>你的名字（選填）</label><input id="name" maxlength="30" placeholder="例如：小明"><label>祝福留言（可只填文字）</label><textarea id="message" maxlength="300" placeholder="新婚快樂，幸福久久 ♡"></textarea><label>照片（可只上傳照片）</label><input id="photo" type="file" accept="image/*"><img id="preview" class="preview" alt="照片預覽"><button id="submit">送出祝福</button><div id="status" class="status" role="status"></div></form><div class="note">照片與留言會顯示在婚禮現場照片牆</div></main><script>const ENDPOINT='https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec',f=document.getElementById('form'),fileEl=document.getElementById('photo'),preview=document.getElementById('preview'),statusEl=document.getElementById('status'),submit=document.getElementById('submit');fileEl.onchange=()=>{const x=fileEl.files[0];if(!x){preview.style.display='none';return}preview.src=URL.createObjectURL(x);preview.style.display='block'};f.onsubmit=async e=>{e.preventDefault();const file=fileEl.files[0],text=document.getElementById('message').value.trim();if(!file&&!text){statusEl.textContent='請上傳照片或寫下祝福後再送出';return}submit.disabled=true;statusEl.textContent='正在送出…';try{let photo=null;if(file){const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsDataURL(file)});photo={name:file.name,type:file.type,data:data.split(',')[1]}}await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:document.getElementById('name').value.trim(),text,photo})});statusEl.textContent='已收到，謝謝你的祝福 ♡';f.reset();preview.style.display='none'}catch(x){statusEl.textContent='目前無法送出，請稍後再試'}finally{submit.disabled=false}};</script></body></html>
