<!doctype html>
<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  婚禮祝福上傳
</title>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  min-height:100%;

  background:
    #fffaf3;

  color:
    #5a4438;

  font-family:
    "Noto Serif TC",
    "PingFang TC",
    serif;
}

body{

  max-width:
    520px;

  margin:
    0 auto;

  padding:
    30px 20px 50px;

}

.container{

  width:100%;

}

h1{

  margin:
    0 0 10px;

  text-align:center;

  font-size:
    30px;

  font-weight:
    600;

}

.subtitle{

  margin:
    0 0 26px;

  text-align:center;

  color:
    #8b7064;

  font-size:
    15px;

}

.card{

  padding:
    24px 20px;

  background:
    rgba(255,255,255,.65);

  border:
    1px solid
    rgba(185,120,104,.18);

  border-radius:
    20px;

  box-shadow:
    0 10px 35px
    rgba(90,68,56,.08);

}

label{

  display:block;

  margin-top:
    14px;

  margin-bottom:
    6px;

  font-size:
    14px;

  font-weight:
    600;

}

input,
textarea,
button{

  width:
    100%;

  box-sizing:
    border-box;

  font:
    inherit;

}

input[type="text"],
textarea{

  margin:
    0;

  padding:
    12px 14px;

  border:
    1px solid
    #dbc8bd;

  border-radius:
    12px;

  background:
    #fff;

  color:
    #5a4438;

  outline:
    none;

}

input[type="text"]:focus,
textarea:focus{

  border-color:
    #b97868;

  box-shadow:
    0 0 0 3px
    rgba(185,120,104,.10);

}

textarea{

  min-height:
    120px;

  resize:
    vertical;

  line-height:
    1.6;

}

.file-box{

  margin-top:
    8px;

  padding:
    14px;

  border:
    1px dashed
    #cba99b;

  border-radius:
    14px;

  background:
    #fffdf9;

}

input[type="file"]{

  width:
    100%;

  font-size:
    14px;

}

.preview{

  display:none;

  margin-top:
    12px;

  text-align:center;

}

.preview img{

  max-width:
    100%;

  max-height:
    260px;

  border-radius:
    12px;

  box-shadow:
    0 8px 20px
    rgba(0,0,0,.12);

}

.status{

  min-height:
    24px;

  margin:
    15px 0 5px;

  text-align:
    center;

  font-size:
    14px;

  line-height:
    1.5;

}

.status.success{

  color:
    #65805c;

}

.status.error{

  color:
    #a04f4f;

}

button{

  margin-top:
    10px;

  padding:
    13px 18px;

  border:
    0;

  border-radius:
    25px;

  background:
    #b97868;

  color:
    #fff;

  font-size:
    16px;

  font-weight:
    600;

  cursor:
    pointer;

  transition:
    .2s ease;

}

button:hover{

  background:
    #a86657;

}

button:disabled{

  opacity:
    .55;

  cursor:
    default;

}

.note{

  margin-top:
    18px;

  text-align:
    center;

  color:
    #9a8378;

  font-size:
    12px;

  line-height:
    1.6;

}

</style>

</head>


<body>


<div class="container">


  <h1>
    留下你的祝福
  </h1>


  <p class="subtitle">
    上傳照片，或寫一句祝福
  </p>


  <div class="card">


    <form id="f">


      <!-- =================================================
           姓名
      ================================================== -->

      <label
        for="n"
      >
        你的名字
      </label>

      <input
        id="n"
        type="text"
        maxlength="30"
        placeholder="例如：小明"
        autocomplete="name"
      >


      <!-- =================================================
           祝福
      ================================================== -->

      <label
        for="t"
      >
        給新人的祝福
      </label>

      <textarea
        id="t"
        maxlength="300"
        placeholder="寫一句想對我們說的話 ♡"
      ></textarea>


      <!-- =================================================
           照片
      ================================================== -->

      <label
        for="p"
      >
        上傳照片
      </label>

      <div class="file-box">

        <input
          id="p"
          type="file"
          accept="image/*"
        >

        <div
          class="preview"
          id="preview"
        >

          <img
            id="previewImg"
            alt="照片預覽"
          >

        </div>

      </div>


      <!-- =================================================
           狀態
      ================================================== -->

      <div
        id="s"
        class="status"
      ></div>


      <!-- =================================================
           按鈕
      ================================================== -->

      <button
        id="b"
        type="submit"
      >
        送出祝福
      </button>


    </form>


  </div>


  <div class="note">

    照片會自動縮小後上傳，<br>
    並顯示在婚禮現場照片牆。

  </div>


</div>


<script>


/* =========================================================
   Google Apps Script
========================================================= */

const ENDPOINT =
  'https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec';


/* =========================================================
   DOM
========================================================= */

const form =
  document.getElementById(
    'f'
  );


const nameInput =
  document.getElementById(
    'n'
  );


const textInput =
  document.getElementById(
    't'
  );


const photoInput =
  document.getElementById(
    'p'
  );


const status =
  document.getElementById(
    's'
  );


const button =
  document.getElementById(
    'b'
  );


const preview =
  document.getElementById(
    'preview'
  );


const previewImg =
  document.getElementById(
    'previewImg'
  );


/* =========================================================
   圖片預覽
========================================================= */

photoInput.addEventListener(
  'change',
  () => {

    const file =
      photoInput.files[0];


    if(
      !file
    ){

      preview.style.display =
        'none';

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      () => {

        previewImg.src =
          reader.result;

        preview.style.display =
          'block';

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =========================================================
   圖片壓縮
========================================================= */

function compressImage(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const image =
            new Image();


          image.onload =
            () => {

              /*
               * 最長邊 1600
               *
               * 婚禮照片牆已經足夠清楚
               * 同時降低上傳時間
               */

              const maxSize =
                1600;


              const scale =
                Math.min(
                  1,
                  maxSize /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const width =
                Math.round(
                  image.width *
                  scale
                );


              const height =
                Math.round(
                  image.height *
                  scale
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  '2d'
                );


              /*
               * 白底
               * 避免某些透明圖片轉 JPG 變黑
               */

              ctx.fillStyle =
                '#ffffff';

              ctx.fillRect(
                0,
                0,
                width,
                height
              );


              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if(
                    !blob
                  ){

                    reject(
                      new Error(
                        '圖片壓縮失敗'
                      )
                    );

                    return;

                  }


                  const blobReader =
                    new FileReader();


                  blobReader.onload =
                    () => {

                      const base64 =
                        String(
                          blobReader.result
                        )
                        .split(
                          ','
                        )[1];


                      resolve({

                        name:
                          'guest-' +
                          Date.now() +
                          '.jpg',

                        type:
                          'image/jpeg',

                        data:
                          base64

                      });

                    };


                  blobReader.onerror =
                    reject;


                  blobReader.readAsDataURL(
                    blob
                  );

                },

                'image/jpeg',

                0.76

              );

            };


          image.onerror =
            () => {

              reject(
                new Error(
                  '無法讀取圖片'
                )
              );

            };


          image.src =
            reader.result;

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              '無法讀取檔案'
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   Submit
========================================================= */

form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const name =
      nameInput.value.trim();


    const text =
      textInput.value.trim();


    const file =
      photoInput.files[0];


    /*
     * 必須至少有照片或文字
     */

    if(
      !file &&
      !text
    ){

      status.className =
        'status error';


      status.textContent =
        '請上傳照片或寫下祝福 ♡';


      return;

    }


    /*
     * 防止連續送出
     */

    button.disabled =
      true;


    status.className =
      'status';


    status.textContent =
      file
        ? '正在準備照片…'
        : '正在送出祝福…';


    try{

      let photo =
        null;


      /*
       * 壓縮照片
       */

      if(
        file
      ){

        photo =
          await compressImage(
            file
          );

      }


      status.textContent =
        '正在送出…';


      /*
       * Payload
       */

      const payload =
        JSON.stringify({

          name:
            name ||
            '親友',

          text:

            text,

          photo:

            photo

        });


      /*
       * 使用 iframe
       *
       * 避免 Google Apps Script CORS 問題
       */

      const iframe =
        document.createElement(
          'iframe'
        );


      const iframeName =
        'uploadSink_' +
        Date.now();


      iframe.name =
        iframeName;


      iframe.style.display =
        'none';


      document.body.appendChild(
        iframe
      );


      /*
       * 建立 POST form
       */

      const postForm =
        document.createElement(
          'form'
        );


      postForm.method =
        'POST';


      postForm.action =
        ENDPOINT;


      postForm.target =
        iframeName;


      postForm.style.display =
        'none';


      const input =
        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        'payload';


      input.value =
        payload;


      postForm.appendChild(
        input
      );


      document.body.appendChild(
        postForm
      );


      /*
       * 等待 Apps Script 回應
       */

      const waitForResponse =
        new Promise(
          (
            resolve,
            reject
          ) => {

            let finished =
              false;


            const timeout =
              setTimeout(
                () => {

                  if(
                    finished
                  ){

                    return;

                  }


                  finished =
                    true;


                  reject(
                    new Error(
                      '上傳逾時'
                    )
                  );

                },
                30000
              );


            iframe.addEventListener(
              'load',
              () => {

                /*
                 * Google Apps Script
                 * 回應頁面載入完成
                 */

                if(
                  finished
                ){

                  return;

                }


                finished =
                  true;


                clearTimeout(
                  timeout
                );


                resolve();

              },
              {
                once:true
              }
            );

          }
        );


      /*
       * 真正送出
       */

      postForm.submit();


      /*
       * 等待伺服器
       */

      await waitForResponse;


      /*
       * 成功
       */

      status.className =
        'status success';


      status.textContent =
        '已成功送出 ♡ 照片會很快出現在照片牆！';


      /*
       * 清空
       */

      form.reset();


      preview.style.display =
        'none';


      previewImg.src =
        '';


      /*
       * 稍後移除 iframe/form
       */

      setTimeout(
        () => {

          postForm.remove();

          iframe.remove();

        },
        3000
      );


    }
    catch(error){

      console.error(
        error
      );


      status.className =
        'status error';


      status.textContent =
        '上傳失敗，請確認網路後再試一次。';


    }
    finally{

      button.disabled =
        false;

    }

  }
);

</script>

</body>

</html>
