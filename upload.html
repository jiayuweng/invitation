<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>婚禮祝福上傳</title><style>body{font-family:serif;background:#fffaf3;color:#5a4438;max-width:520px;margin:30px auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;font:inherit}textarea{min-height:120px}button{background:#b97868;color:#fff;border:0;border-radius:20px}.status{text-align:center}</style><h1>留下你的祝福</h1><p>上傳照片，或寫一句祝福</p><form id="f"><input id="n" maxlength="30" placeholder="你的名字"><textarea id="t" maxlength="300" placeholder="祝福留言"></textarea><input id="p" type="file" accept="image/*"><div id="s" class="status"></div><button id="b">送出祝福</button></form><script>const E="https://script.google.com/macros/s/AKfycbyCo2LPJ8XSK0eYYk6mcYtD_Y3uyycp_XNc_4oEBtqSBpEDAJf_yxYa-2ojB1d2WQA6-w/exec";function compress(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(async x=>{const q=new FileReader();q.onload=()=>ok({name:"guest-"+Date.now()+".jpg",type:"image/jpeg",data:String(q.result).split(",")[1]});q.readAsDataURL(x)},"image/jpeg",.78)};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}f.onsubmit=async e=>{e.preventDefault();const file=p.files[0],text=t.value.trim();if(!file&&!text){s.textContent="請上傳照片或寫下祝福";return}b.disabled=true;s.textContent=file?"正在壓縮照片…":"正在送出…";try{const photo=file?await compress(file):null,q=document.createElement("iframe"),z=document.createElement("form"),x=document.createElement("input");q.name="sink";q.style.display="none";z.method="POST";z.action=E;z.target="sink";z.style.display="none";x.name="payload";x.value=JSON.stringify({name:n.value.trim()||"親友",text,photo});z.append(x);document.body.append(q,z);z.submit();s.textContent="已送出，照片同步到雲端中…";f.reset()}catch(e){s.textContent="上傳失敗，請稍後再試"}finally{b.disabled=false}};</script></html>
