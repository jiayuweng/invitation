<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>婚禮祝福上傳</title><style>body{font-family:serif;background:#fffaf3;color:#5a4438;max-width:520px;margin:30px auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border:1px solid #d7b99f;border-radius:12px;font:inherit}button{background:#b97868;color:white;border:0}</style><h1>留下你的祝福</h1><p>上傳照片，或寫一句祝福</p><form id="f"><input id="n" placeholder="你的名字（選填）"><textarea id="t" placeholder="祝福留言"></textarea><input id="p" type="file" accept="image/*"><button>送出祝福</button><div id="s"></div></form><script>const E="https://script.google.com/macros/s/AKfycbyCo2LPJ8XSK0eYYk6mcYtD_Y3uyycp_XNc_4oEBtqSBpEDAJf_yxYa-2ojB1d2WQA6-w/exec";f.onsubmit=async e=>{e.preventDefault();let x=p.files[0],d=null;if(x){let r=new FileReader();d=await new Promise((ok,no)=>{r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(x)})}let z=document.createElement("form");z.method="POST";z.action=E;z.target="sink";let i=document.createElement("input");i.name="payload";i.value=JSON.stringify({name:n.value,text:t.value,photo:d?{name:x.name,type:x.type,data:d}:null});z.append(i);let q=document.createElement("iframe");q.name="sink";q.hidden=true;document.body.append(q,z);z.submit();s.textContent="已送出，資料同步中…";f.reset()}</script></html>
