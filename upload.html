<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>婚禮祝福上傳</title><style>body{font-family:serif;background:#fffaf3;color:#5a4438;max-width:520px;margin:30px auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;font:inherit}button{background:#b97868;color:#fff;border:0;border-radius:20px}.status{text-align:center}</style><h1>留下你的祝福</h1><p>上傳照片，或寫一句祝福</p><form id="f"><input id="n" maxlength="30" placeholder="你的名字"><textarea id="t" maxlength="300" placeholder="祝福留言"></textarea><input id="p" type="file" accept="image/*"><button type="submit">送出祝福</button><div id="s" class="status"></div></form><script>const E="https://script.google.com/macros/s/AKfycbyCo2LPJ8XSK0eYYk6mcYtD_Y3uyycp_XNc_4oEBtqSBpEDAJf_yxYa-2ojB1d2WQA6-w/exec";f.onsubmit=async e=>{e.preventDefault();const file=p.files[0],text=t.value.trim();if(!file&&!text){s.textContent="請上傳照片或寫下祝福";return}s.textContent="正在準備照片…";let photo=null;if(file){const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)});photo={name:file.name,type:file.type||"image/jpeg",data}}const q=document.createElement("iframe"),z=document.createElement("form"),i=document.createElement("input");q.name="sink";q.style.display="none";z.method="POST";z.action=E;z.target="sink";z.style.display="none";i.name="payload";i.value=JSON.stringify({name:n.value.trim(),text,photo});z.append(i);document.body.append(q,z);z.submit();s.textContent="已送出，照片同步到雲端中…";f.reset()};</script></html>
