<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <title>婚禮座位查詢｜劉育名 & 翁佳瑜</title>
  <meta name="description" content="查詢婚禮宴席桌號與座位位置。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#514b41;--soft:#81786b;--paper:#fffdf7;--ground:#f2eadc;--line:#cfc0ad;--coral:#c87862;--coral-deep:#a85f4e;--moss:#7c947d;--teal:#167f7b;--gold:#c89c4e}
    *{box-sizing:border-box}
    body{margin:0;background-color:#e8e0d4;background-image:radial-gradient(#c8b6a3 0.65px,transparent .7px),linear-gradient(125deg,#eee6da,#dfd3c3);background-size:7px 7px,100% 100%;color:var(--ink);font-family:'Noto Serif TC',serif}
    main{position:relative;width:min(100%,650px);min-height:100svh;margin:auto;padding:20px 20px 52px;background:var(--paper);box-shadow:0 0 70px #725f481c;overflow:hidden}
    main::before,main::after{content:'❀';position:absolute;color:#dda896;opacity:.35;font:40px Georgia,serif;pointer-events:none}main::before{top:92px;left:-9px;transform:rotate(-18deg)}main::after{right:-8px;bottom:105px;transform:rotate(24deg)}
    .back{position:relative;z-index:1;display:inline-flex;gap:6px;align-items:center;color:#7d756a;font-size:12px;letter-spacing:.08em;text-decoration:none}.back::before{content:'←';font-size:16px}.back:hover{color:var(--coral-deep)}
    header{position:relative;text-align:center;padding:37px 0 24px}.eyebrow{margin:0 0 9px;color:var(--coral);font:14px 'DM Serif Display',serif;letter-spacing:.3em}.title{margin:0;font-size:29px;letter-spacing:.15em;color:#4d493f}.intro{margin:11px auto 15px;color:var(--soft);font-size:13px;letter-spacing:.05em}.event-meta{display:flex;align-items:center;justify-content:center;gap:11px;color:#6d7564;font-size:11px;letter-spacing:.13em}.event-meta i{display:block;width:22px;border-top:1px solid #b9a389}
    .lookup{position:relative;padding:20px;border:1px solid #d6c5b0;border-radius:4px;background:#fffcf5;box-shadow:5px 6px 0 #eadfd1}.lookup::before{content:'';position:absolute;left:50%;top:-8px;width:88px;height:16px;background:#d9c69f85;transform:translateX(-50%) rotate(-2deg)}.lookup-caption{text-align:center;margin-bottom:14px}.lookup-caption span{display:block;color:var(--coral);font:12px 'DM Serif Display',serif;letter-spacing:.22em}.lookup-caption strong{display:block;margin-top:3px;font-size:15px;font-weight:600;letter-spacing:.1em}
    .lookup form{display:flex;gap:9px}.lookup input{min-width:0;flex:1;border:1px solid #c9b9a7;border-radius:3px;background:#fffefa;padding:13px 14px;color:var(--ink);font:500 15px 'Noto Serif TC',serif;outline:none}.lookup input:focus{border-color:var(--moss);box-shadow:0 0 0 3px #dce9df}.lookup button{border:0;border-radius:3px;background:var(--coral);padding:0 19px;color:#fffdf8;font:600 14px 'Noto Serif TC',serif;letter-spacing:.08em;cursor:pointer;box-shadow:2px 3px 0 #a6564640}.lookup button:hover{background:var(--coral-deep);transform:translate(-1px,-1px)}
    .status{min-height:1.5em;margin:12px 2px 0;color:var(--soft);font-size:13px}.status.error{color:#a24f45}.status.success{color:#517565}
    .result{position:relative;margin-top:24px;padding:17px 16px 15px;border:1px solid #d6c5b0;border-radius:4px;background:#fffdf8;text-align:center;box-shadow:4px 5px 0 #e6dcd0}.result::before{content:'SEAT FOUND';position:absolute;top:-9px;left:50%;padding:1px 11px;background:#e5d5bd;color:#8a6c58;font:11px 'DM Serif Display',serif;letter-spacing:.16em;transform:translateX(-50%) rotate(-1deg)}.result[hidden]{display:none}.result-name{margin:0;color:var(--soft);font-size:13px}.result-table{margin:4px 0 0;color:var(--coral-deep);font:31px 'DM Serif Display','Noto Serif TC',serif;letter-spacing:.1em}
    .map-card{position:relative;margin:30px 0 0;padding:20px 10px 13px;border:1px solid #d7c8b7;border-radius:5px;background:#f5eee2;box-shadow:5px 6px 0 #e5d9cb}.map-card h2{margin:0 0 7px;text-align:center;font-size:17px;letter-spacing:.16em}.map-card h2::before,.map-card h2::after{content:'✦';padding:0 8px;color:var(--gold);font-size:12px}.map-note{margin:0 0 13px;text-align:center;color:#958474;font-size:11px;letter-spacing:.04em}.map-wrap{position:relative;overflow:hidden;border-radius:2px;background:#fffdf8;border:1px solid #d9ccbd}
    #seatMap{display:block;width:100%;height:auto;min-height:600px;background:radial-gradient(circle at 50% 4%,#fffdf8 0 26%,#f8efe3 70%,#efe0d1 100%)}.floor{fill:url(#paperGrain)}.aisle{fill:url(#carpetGradient);stroke:#c87966;stroke-width:2}.aisle-line{stroke:#f3d6a4;stroke-width:2;stroke-dasharray:9 10;opacity:.9}.table-circle{fill:#fffdf8;stroke:#df7e59;stroke-width:7;filter:url(#handDrawn)}.table-inner{fill:none;stroke:#ecc1ac;stroke-width:1.7;stroke-dasharray:3 7;opacity:.9}.table-label{fill:#62584c;font:600 29px 'DM Serif Display','Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.main-circle{fill:#fffdf8;stroke:#dcb348;stroke-width:7;filter:url(#handDrawn)}.main-label{fill:#655448;font:600 25px 'Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.checkin{fill:#f7d7cc;stroke:#d99b86;stroke-width:2}.selected-table{fill:#fff0f1;stroke:#d96379;stroke-width:9}.door{fill:#fffdf8;stroke:#b9a38e;stroke-width:3}.door-swing{fill:none;stroke:#b9a38e;stroke-width:2;stroke-dasharray:5 5}.door-label{fill:#806d5b;font:600 17px 'Noto Serif TC',serif;text-anchor:middle;letter-spacing:.12em}.checkin-label{fill:#925f52;font:600 24px 'Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.highlight-ring{fill:none;stroke:#efadb8;stroke-width:9;opacity:.95;animation:pulse 1.3s ease-in-out infinite}.arrow{fill:#d96379;filter:drop-shadow(0 3px 2px #366e6650);animation:bob 1s ease-in-out infinite}.marker-label{fill:#c14e67;font:600 17px 'Noto Serif TC',serif;text-anchor:middle;letter-spacing:.14em;paint-order:stroke;stroke:#fffdf8;stroke-width:5;stroke-linejoin:round}@keyframes pulse{50%{stroke-width:15;opacity:.28}}@keyframes bob{50%{transform:translateY(-8px)}}
    .legend{margin:12px 4px 0;color:#8f7e6e;font-size:11px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}
    @media(max-width:370px){main{padding-inline:12px}.lookup{padding:17px 14px}.lookup button{padding-inline:14px}.title{font-size:25px}.event-meta{font-size:10px}}
    @media(min-width:651px){body{padding:20px}main{border-radius:5px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="./">← 回到婚禮邀請函</a>
    <header>
      <p class="eyebrow">WEDDING SEAT GUIDE</p>
      <h1 class="title">查詢您的座位</h1>
      <p class="intro">請輸入受邀姓名，查看宴席桌號與位置。</p>
      <div class="event-meta"><span>2026.11.22 SUN</span><i aria-hidden="true"></i><span>彭園新板館</span></div>
    </header>

    <section class="lookup" aria-label="座位查詢">
      <div class="lookup-caption"><span>GUEST CHECK</span><strong>輸入姓名查詢桌位</strong></div>
      <form id="lookupForm" novalidate>
        <label class="sr-only" for="guestName">受邀姓名</label>
        <input id="guestName" name="guestName" type="search" autocomplete="name" placeholder="請輸入姓名" maxlength="40" required />
        <button type="submit">查詢</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden aria-live="polite">
      <p id="resultName" class="result-name"></p>
      <p id="resultTable" class="result-table"></p>
    </section>

    <section class="map-card" aria-labelledby="mapTitle">
      <h2 id="mapTitle">會場座位圖</h2>
      <p class="map-note">查詢後，箭頭會標示您的桌位。</p>
      <div class="map-wrap">
        <svg id="seatMap" viewBox="0 0 730 1200" role="img" aria-label="主桌與二十張宴席桌的會場座位圖"></svg>
      </div>
      <p class="legend">桌號與位置將依最終場地配置更新。</p>
    </section>
  </main>

  <script src="./assets/seat-data.js"></script>
  <script>
    const seatIndex = (window.SEAT_DATA && window.SEAT_DATA.entries) || {};
    const svg = document.getElementById('seatMap');
    const form = document.getElementById('lookupForm');
    const input = document.getElementById('guestName');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const resultName = document.getElementById('resultName');
    const resultTable = document.getElementById('resultTable');
    let dataPromise;
    const DEFAULT_LAYOUT = [
      ['Table_1',355,25,0],['Table_2',55,195,1],['Table_3',262,230,2],['Table_4',468,230,3],['Table_5',675,195,4],
      ['Table_6',55,375,5],['Table_7',262,410,6],['Table_8',468,410,7],['Table_9',675,375,8],
      ['Table_10',55,555,9],['Table_11',262,590,10],['Table_12',468,590,11],['Table_13',675,555,12],
      ['Table_14',55,735,13],['Table_15',262,770,14],['Table_16',468,770,15],['Table_17',675,735,16],
      ['Table_18',55,915,17],['Table_19',262,950,18],['Table_20',468,950,19],['Table_21',675,915,20]
    ].map(([Object_ID, X, Y, Public_Table_ID]) => ({Object_ID, Type:'Table', X, Y, Public_Table_ID}));

    const clean = (value) => String(value ?? '').replace(/[\s　]+/g, '').toLocaleLowerCase('zh-Hant');
    const asNumber = (value) => Number(value);
    const svgEl = (tag, attrs = {}) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    };
    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = `status ${kind}`.trim();
    }
    function drawMap(layout, activeObjectId = '') {
      svg.replaceChildren();

      const defs = svgEl('defs');
      const paperGrain = svgEl('pattern', {id:'paperGrain', width:18, height:18, patternUnits:'userSpaceOnUse'});
      paperGrain.append(svgEl('rect', {width:18, height:18, fill:'#fffdf8'}));
      paperGrain.append(svgEl('path', {d:'M 0 16 H 18', stroke:'#eee1d2', 'stroke-width':'.75', opacity:'.68'}));
      defs.append(paperGrain);

      const handDrawn = svgEl('filter', {id:'handDrawn', x:'-20%', y:'-20%', width:'140%', height:'140%'});
      handDrawn.append(svgEl('feTurbulence', {type:'fractalNoise', baseFrequency:'.018', numOctaves:'1', seed:'8', result:'noise'}));
      handDrawn.append(svgEl('feDisplacementMap', {in:'SourceGraphic', in2:'noise', scale:'1.35', xChannelSelector:'R', yChannelSelector:'G', result:'rough'}));
      handDrawn.append(svgEl('feDropShadow', {in:'rough', dx:'0', dy:'5', stdDeviation:'3', 'flood-color':'#98694a', 'flood-opacity':'.14'}));
      defs.append(handDrawn);

      const carpetGradient = svgEl('linearGradient', {id:'carpetGradient', x1:'0', x2:'1', y1:'0', y2:'0'});
      carpetGradient.append(svgEl('stop', {offset:'0%', 'stop-color':'#e5a18c'}));
      carpetGradient.append(svgEl('stop', {offset:'48%', 'stop-color':'#d77f69'}));
      carpetGradient.append(svgEl('stop', {offset:'100%', 'stop-color':'#e5a18c'}));
      defs.append(carpetGradient);
      svg.append(defs);
      svg.append(svgEl('rect', {x:0, y:0, width:730, height:1200, class:'floor'}));

      // Main table remains clear of the carpet.
      svg.append(svgEl('rect', {x:325, y:155, width:80, height:810, rx:36, class:'aisle'}));
      svg.append(svgEl('line', {x1:365, y1:190, x2:365, y2:930, class:'aisle-line'}));

      // Entrance sits below Table 20 with clear walking space.
      const door = svgEl('g');
      door.append(svgEl('path', {d:'M 730 1000 H 678 V 1080 H 730', class:'door'}));
      door.append(svgEl('path', {d:'M 678 1000 A 82 82 0 0 1 730 1076', class:'door-swing'}));
      const doorLabel = svgEl('text', {x:704, y:1040, class:'door-label', transform:'rotate(-90 704 1040)'});
      doorLabel.textContent = '入口';
      door.append(doorLabel);
      svg.append(door);

      // After entering from the right, the reception table is on the left.
      const checkin = svgEl('g');
      checkin.append(svgEl('rect', {x:430, y:1060, width:205, height:72, rx:15, class:'checkin'}));
      const checkinText = svgEl('text', {x:532, y:1097, class:'checkin-label'});
      checkinText.textContent = '簽到桌';
      checkin.append(checkinText);
      svg.append(checkin);

      const tables = layout.filter((row) => row.Type === 'Table' && String(row.Public_Table_ID).trim() !== '');
      tables.forEach((row) => {
        const publicId = String(row.Public_Table_ID).trim();
        const isMain = publicId === '0';
        let x = asNumber(row.X);
        let y = asNumber(row.Y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;

        // Bring the two outer table rows inward while keeping every table off the carpet.
        if (x === 55) x = 95;
        else if (x === 262) x = 245;
        else if (x === 468) x = 485;
        else if (x === 675) x = 635;
        if (isMain) { x = 365; y = 85; }

        const group = svgEl('g', {id:row.Object_ID});
        group.append(svgEl('circle', {cx:x, cy:y, r:isMain ? 57 : 50, class:(isMain ? 'main-circle' : 'table-circle') + (row.Object_ID === activeObjectId ? ' selected-table' : '')}));
        if (!isMain && row.Object_ID !== activeObjectId) {
          group.append(svgEl('circle', {cx:x, cy:y, r:39, class:'table-inner'}));
        }
        const label = svgEl('text', {x, y, class:isMain ? 'main-label' : 'table-label'});
        label.textContent = isMain ? '主桌' : publicId;
        group.append(label);

        if (row.Object_ID === activeObjectId) {
          group.append(svgEl('circle', {cx:x, cy:y, r:66, class:'highlight-ring'}));
          const marker = svgEl('g', {class:'seat-marker'});
          const markerLabel = svgEl('text', {x, y:y - 138, class:'marker-label'});
          markerLabel.textContent = '您的座位';
          marker.append(markerLabel);
          // Downward arrow ends at the top edge of the selected table.
          marker.append(svgEl('path', {d:`M ${x - 12} ${y - 128} H ${x + 12} V ${y - 84} H ${x + 28} L ${x} ${y - 50} L ${x - 28} ${y - 84} H ${x - 12} Z`, class:'arrow'}));
          group.append(marker);
        }
        svg.append(group);
      });
    }
    function initialiseMap() {
      drawMap(DEFAULT_LAYOUT);
    }
    async function hashName(value) {
      const bytes = new TextEncoder().encode(clean(value));
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest))
        .map((byte) => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const typedName = input.value.trim();
      const query = clean(typedName);
      result.hidden = true;
      if (!query) { setStatus('請先輸入受邀姓名。', 'error'); input.focus(); return; }

      setStatus('正在查詢座位…');
      try {
        const lookup = seatIndex[await hashName(typedName)];

        if (!lookup) {
          setStatus('查無座位資訊，請以填寫表單時使用的姓名查詢，或洽詢新人。', 'error');
          return;
        }

        resultName.textContent = `${typedName}，您的座位在`;
        resultTable.textContent = `第 ${lookup.t} 桌`;
        result.hidden = false;
        drawMap(DEFAULT_LAYOUT, lookup.o);
        setStatus('已為您標示桌位。', 'success');
        result.scrollIntoView({behavior:'smooth', block:'center'});
      } catch (error) {
        console.error(error);
        setStatus('目前無法查詢座位資料，請稍後再試。', 'error');
      }
    });
    initialiseMap();
  </script>
</body>
</html>
