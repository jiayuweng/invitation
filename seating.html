<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <title>婚禮座位查詢｜劉育名 & 翁佳瑜</title>
  <meta name="description" content="查詢婚禮宴席桌號與座位位置。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#63554a;--soft:#8d7767;--paper:#fffdf8;--ground:#f6efe5;--line:#dbcaba;--accent:#b9715c;--gold:#be9337}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#e9dfd2,#f6efe6 42%,#e8dfd5);color:var(--ink);font-family:'Noto Serif TC',serif}
    main{width:min(100%,560px);min-height:100svh;margin:auto;padding:24px 16px 42px;background:var(--paper);box-shadow:0 0 50px #6c51371d}
    .back{display:inline-block;color:#937967;font-size:13px;letter-spacing:.08em;text-decoration:none}.back:hover{text-decoration:underline}
    header{text-align:center;padding:18px 0 22px}.eyebrow{margin:0 0 7px;color:#b17b65;font:15px 'DM Serif Display',serif;letter-spacing:.2em}.title{margin:0;font-size:27px;letter-spacing:.13em}.intro{margin:9px 0 0;color:var(--soft);font-size:13px;letter-spacing:.05em}
    .lookup{padding:18px;border:1px solid var(--line);border-radius:15px;background:#fcf8f1;box-shadow:0 8px 25px #9b735214}
    .lookup form{display:flex;gap:8px}.lookup input{min-width:0;flex:1;border:1px solid #d9c6b4;border-radius:999px;background:#fffefa;padding:12px 15px;color:var(--ink);font:500 15px 'Noto Serif TC',serif;outline:none}.lookup input:focus{border-color:#ad8068;box-shadow:0 0 0 3px #e9d3c655}.lookup button{border:0;border-radius:999px;background:var(--accent);padding:0 18px;color:#fffdf8;font:600 14px 'Noto Serif TC',serif;letter-spacing:.06em;cursor:pointer}.lookup button:hover{background:#9f5d4d}
    .status{min-height:1.5em;margin:12px 2px 0;color:var(--soft);font-size:13px}.status.error{color:#a24f45}.status.success{color:#716f57}
    .result{margin-top:18px;padding:14px 16px;border:1px solid #dfcdbb;border-radius:10px;background:#fffdf8;text-align:center}.result[hidden]{display:none}.result-name{margin:0;color:var(--soft);font-size:13px}.result-table{margin:3px 0 0;color:#9a654f;font:28px 'DM Serif Display','Noto Serif TC',serif;letter-spacing:.08em}
    .map-card{margin:24px 0 0;padding:16px 10px 12px;border-radius:17px;background:var(--ground);border:1px solid #e3d7c9}.map-card h2{margin:0 0 10px;text-align:center;font-size:16px;letter-spacing:.12em}.map-note{margin:0 0 10px;text-align:center;color:#9b8877;font-size:11px}.map-wrap{position:relative;overflow:hidden;border-radius:11px;background:#fffdf8;border:1px solid #e1d5c6}
    #seatMap{display:block;width:100%;height:auto;min-height:600px}.aisle{fill:#f9d7c7}.table-circle{fill:#fffdf8;stroke:#e97b52;stroke-width:7}.table-label{fill:#685a4e;font:600 29px 'DM Serif Display','Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.main-circle{fill:#fffdf8;stroke:#eabf47;stroke-width:7}.main-label{fill:#655448;font:600 25px 'Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.checkin{fill:#aeecea}.checkin-label{fill:#45625e;font:600 24px 'Noto Serif TC',serif;text-anchor:middle;dominant-baseline:central}.highlight-ring{fill:none;stroke:#b85e48;stroke-width:8;opacity:.9;animation:pulse 1.3s ease-in-out infinite}.arrow{fill:#b85e48;filter:drop-shadow(0 3px 2px #63321a55);animation:bob 1s ease-in-out infinite}@keyframes pulse{50%{stroke-width:15;opacity:.3}}@keyframes bob{50%{transform:translateY(-12px)}}
    .legend{margin:11px 4px 0;color:#94806e;font-size:11px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}
    @media(max-width:370px){main{padding-inline:10px}.lookup{padding:14px}.lookup button{padding-inline:14px}.title{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <a class="back" href="./">← 回到婚禮邀請函</a>
    <header>
      <p class="eyebrow">WEDDING SEATING</p>
      <h1 class="title">查詢您的座位</h1>
      <p class="intro">請輸入受邀姓名，查看宴席桌號與位置。</p>
    </header>

    <section class="lookup" aria-label="座位查詢">
      <form id="lookupForm" novalidate>
        <label class="sr-only" for="guestName">受邀姓名</label>
        <input id="guestName" name="guestName" type="search" autocomplete="name" placeholder="請輸入姓名" maxlength="40" required />
        <button type="submit">查詢</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden aria-live="polite">
      <p id="resultName" class="result-name"></p>
      <p id="resultTable" class="result-table"></p>
    </section>

    <section class="map-card" aria-labelledby="mapTitle">
      <h2 id="mapTitle">會場座位圖</h2>
      <p class="map-note">查詢後，箭頭會標示您的桌位。</p>
      <div class="map-wrap">
        <svg id="seatMap" viewBox="0 0 730 1200" role="img" aria-label="主桌與二十張宴席桌的會場座位圖"></svg>
      </div>
      <p class="legend">桌號與位置將依最終場地配置更新。</p>
    </section>
  </main>

  <script>
    const SHEET_ID = '17S-YGI8hcYBZZfNovM09SyP-h9Yv5JJi3XuZLW_je-0';
    const sheetUrl = (sheetName) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    const svg = document.getElementById('seatMap');
    const form = document.getElementById('lookupForm');
    const input = document.getElementById('guestName');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const resultName = document.getElementById('resultName');
    const resultTable = document.getElementById('resultTable');
    let dataPromise;
    const DEFAULT_LAYOUT = [
      ['Table_1',355,25,0],['Table_2',55,195,1],['Table_3',262,230,2],['Table_4',468,230,3],['Table_5',675,195,4],
      ['Table_6',55,375,5],['Table_7',262,410,6],['Table_8',468,410,7],['Table_9',675,375,8],
      ['Table_10',55,555,9],['Table_11',262,590,10],['Table_12',468,590,11],['Table_13',675,555,12],
      ['Table_14',55,735,13],['Table_15',262,770,14],['Table_16',468,770,15],['Table_17',675,735,16],
      ['Table_18',55,915,17],['Table_19',262,950,18],['Table_20',468,950,19],['Table_21',675,915,20]
    ].map(([Object_ID, X, Y, Public_Table_ID]) => ({Object_ID, Type:'Table', X, Y, Public_Table_ID}));

    const clean = (value) => String(value ?? '').replace(/[\s　]+/g, '').toLocaleLowerCase('zh-Hant');
    const asNumber = (value) => Number(value);
    const svgEl = (tag, attrs = {}) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    };
    const parseGviz = (text) => {
      const json = JSON.parse(text.replace(/^\/\*O_o\*\/\n/, '').replace(/^google\.visualization\.Query\.setResponse\(/, '').replace(/\);\s*$/, ''));
      const table = json.table;
      const headers = table.cols.map((column) => column.label || column.id);
      return table.rows.map((row) => Object.fromEntries(headers.map((header, index) => [header, row.c[index]?.v ?? ''])));
    };
    async function getData() {
      if (!dataPromise) dataPromise = Promise.all([fetch(sheetUrl('GuestData')), fetch(sheetUrl('Layout'))])
        .then(async ([guests, layout]) => {
          if (!guests.ok || !layout.ok) throw new Error('座位資料無法讀取');
          return Promise.all([guests.text(), layout.text()]);
        })
        .then(([guests, layout]) => ({guests: parseGviz(guests), layout: parseGviz(layout)}));
      return dataPromise;
    }
    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = `status ${kind}`.trim();
    }
    function drawMap(layout, activeObjectId = '') {
      svg.replaceChildren();
      svg.append(svgEl('rect', {x:285, y:130, width:160, height:820, rx:31, class:'aisle'}));
      const checkin = svgEl('g');
      checkin.append(svgEl('rect', {x:405, y:1035, width:235, height:85, rx:15, class:'checkin'}));
      const checkinText = svgEl('text', {x:522, y:1078, class:'checkin-label'}); checkinText.textContent = '簽到桌'; checkin.append(checkinText); svg.append(checkin);
      const tables = layout.filter((row) => row.Type === 'Table' && String(row.Public_Table_ID).trim() !== '');
      tables.forEach((row) => {
        const x = asNumber(row.X), y = asNumber(row.Y), publicId = String(row.Public_Table_ID).trim();
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const isMain = publicId === '0';
        const group = svgEl('g', {id:row.Object_ID});
        group.append(svgEl('circle', {cx:x, cy:y, r:isMain ? 57 : 50, class:isMain ? 'main-circle' : 'table-circle'}));
        const label = svgEl('text', {x, y, class:isMain ? 'main-label' : 'table-label'});
        label.textContent = isMain ? '主桌' : publicId;
        group.append(label);
        if (row.Object_ID === activeObjectId) {
          group.append(svgEl('circle', {cx:x, cy:y, r:66, class:'highlight-ring'}));
          group.append(svgEl('path', {d:`M ${x} ${y - 112} l -20 38 h 13 v 29 h 14 v -29 h 13 Z`, class:'arrow'}));
        }
        svg.append(group);
      });
    }
    async function initialiseMap() {
      try {
        const {layout} = await getData();
        drawMap(layout);
      } catch (error) {
        drawMap(DEFAULT_LAYOUT);
        setStatus('座位圖已顯示；查詢資料將在連接照片牆資料後啟用。', 'error');
      }
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = clean(input.value);
      result.hidden = true;
      if (!query) { setStatus('請先輸入受邀姓名。', 'error'); input.focus(); return; }
      setStatus('正在查詢座位…');
      try {
        const {guests, layout} = await getData();
        const matches = guests.filter((guest) => [guest.Name, guest.FormName, guest.NameOverride].some((name) => clean(name) === query));
        if (!matches.length) { setStatus('找不到此姓名，請確認是否與邀請函相同。', 'error'); return; }
        const guest = matches[0];
        const objectId = `Table_${String(guest.Table_ID).trim()}`;
        const table = layout.find((row) => row.Object_ID === objectId);
        const publicId = String(table?.Public_Table_ID ?? '').trim();
        if (!table || !publicId || publicId === '0') { setStatus('您的座位資料尚未安排完成，請稍後再查詢。', 'error'); return; }
        resultName.textContent = `${guest.Name}，您的座位在`;
        resultTable.textContent = `第 ${publicId} 桌`;
        result.hidden = false;
        drawMap(layout, objectId);
        setStatus('已為您標示桌位。', 'success');
        result.scrollIntoView({behavior:'smooth', block:'center'});
      } catch (error) {
        console.error(error);
        setStatus('目前無法讀取座位資料，請稍後再試。', 'error');
      }
    });
    initialiseMap();
  </script>
</body>
</html>
