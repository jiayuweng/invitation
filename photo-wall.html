<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e8" />
  <title>婚禮照片牆｜劉育名 & 翁佳瑜</title>
  <meta name="description" content="婚禮現場照片與祝福即時展示 Demo。" />
  <style>
    :root{--ink:#5f4b3d;--muted:#9a8471;--paper:#fbf7f0;--blush:#f4d8ca;--line:#ddc5b2;--shadow:0 18px 50px rgba(95,75,61,.14)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#eae1d5;color:var(--ink);font-family:"Noto Serif TC","PingFang TC",serif}
    body{display:flex;justify-content:center;padding:24px 14px 42px}
    .wall{width:min(1120px,100%);background:var(--paper);border:1px solid rgba(165,130,104,.22);box-shadow:var(--shadow);overflow:hidden}
    header{padding:34px clamp(22px,5vw,66px) 24px;text-align:center;background:linear-gradient(180deg,#fffdf8,#fbf7f0);border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 10px;font:500 12px/1.4 "Noto Serif TC",serif;letter-spacing:.28em;color:var(--muted)}
    h1{margin:0;font-size:clamp(28px,5vw,48px);font-weight:500;letter-spacing:.16em}
    .subtitle{margin:12px 0 0;font-size:clamp(14px,2vw,18px);color:var(--muted);letter-spacing:.1em}
    .live-pill{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:#fffaf4}
    .live-pill i{width:8px;height:8px;border-radius:50%;background:#b98d72;box-shadow:0 0 0 5px rgba(185,141,114,.13);animation:pulse 2s ease-in-out infinite}
    .stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.85fr);gap:28px;padding:28px clamp(18px,4vw,54px) 34px}
    .hero{position:relative;min-height:500px;border-radius:16px;overflow:hidden;background:#eee3d7;border:1px solid rgba(165,130,104,.25)}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 54%,rgba(39,25,18,.72));pointer-events:none}
    .hero-image{width:100%;height:100%;min-height:500px;display:block;object-fit:cover;animation:kenburns 5s ease both}
    .hero-copy{position:absolute;z-index:1;left:26px;right:26px;bottom:24px;color:#fffdf8;text-shadow:0 2px 14px rgba(45,27,17,.32)}
    .hero-copy blockquote{margin:0 0 12px;font-size:clamp(22px,3.1vw,34px);line-height:1.45;letter-spacing:.08em;font-weight:500}
    .hero-copy p{margin:0;font-size:14px;letter-spacing:.12em;opacity:.92}
    .hero-label{position:absolute;z-index:2;top:16px;left:16px;padding:6px 12px;border-radius:999px;background:rgba(255,252,246,.88);font-size:12px;color:var(--ink);letter-spacing:.1em}
    .queue{display:flex;flex-direction:column;justify-content:center;gap:12px}
    .queue-title{margin:0 0 4px;font-size:15px;letter-spacing:.12em;color:var(--muted)}
    .queue-card{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
    .queue-card:hover,.queue-card.is-active{transform:translateY(-2px);border-color:#b98d72;box-shadow:0 8px 20px rgba(95,75,61,.11)}
    .queue-card img{width:86px;height:74px;display:block;object-fit:cover;border-radius:8px}
    .queue-card strong{display:block;font-size:15px;font-weight:500;line-height:1.5}
    .queue-card span{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
    .gallery{padding:28px clamp(18px,4vw,54px) 44px;background:linear-gradient(180deg,#f6ede4,#fbf7f0)}
    .gallery-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}.gallery h2{margin:0;font-size:20px;font-weight:500;letter-spacing:.14em}.gallery small{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .tile{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fffdf8}.tile img{width:100%;height:170px;display:block;object-fit:cover}.tile figcaption{padding:10px 12px 12px}.tile blockquote{margin:0;font-size:14px;line-height:1.6}.tile p{margin:7px 0 0;color:var(--muted);font-size:12px}
    footer{text-align:center;padding:24px 18px;color:var(--muted);font-size:12px;letter-spacing:.12em}
    @keyframes kenburns{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}} @keyframes pulse{50%{opacity:.4;transform:scale(.75)}}
    @media (max-width:820px){body{padding:0;background:var(--paper)}.wall{border:0;box-shadow:none}.stage{grid-template-columns:1fr;gap:18px;padding:20px 16px 26px}.hero,.hero-image{min-height:390px}.queue{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.queue-title{grid-column:1/-1}.queue-card{grid-template-columns:58px 1fr;gap:9px;padding:7px}.queue-card img{width:58px;height:54px}.queue-card strong{font-size:13px}.queue-card span{font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile img{height:145px}}
    @media (max-width:430px){header{padding:28px 18px 22px}.hero,.hero-image{min-height:350px}.hero-copy{left:18px;right:18px;bottom:18px}.hero-copy blockquote{font-size:22px}.gallery{padding-left:14px;padding-right:14px}.tile img{height:126px}}
  </style>
</head>
<body>
  <main class="wall">
    <header><p class="eyebrow">YU MING & JIA YU · WEDDING DAY</p><h1>婚禮照片牆</h1><p class="subtitle">把此刻的祝福，留在我們的故事裡</p><div class="live-pill"><i></i>現場同步展示 · Demo</div></header>
    <section class="stage" aria-label="照片輪播">
      <article class="hero" id="hero"><span class="hero-label" id="heroIndex">01 / 06</span><img class="hero-image" id="heroImage" src="assets/wedding-invitation.png" alt="婚禮照片" /><div class="hero-copy"><blockquote id="heroMessage">願你們的每一天，都像今天一樣閃閃發光。</blockquote><p id="heroAuthor">— 小明</p></div></article>
      <aside class="queue" aria-label="最新祝福"><h2 class="queue-title">最新祝福</h2><button class="queue-card is-active" data-index="0"><img src="assets/wedding-invitation.png" alt="" /><span><strong>小明</strong><span>新婚快樂，幸福久久</span></span></button><button class="queue-card" data-index="1"><img src="assets/guide-parking.png" alt="" /><span><strong>婷婷</strong><span>願你們攜手走過每個春夏</span></span></button><button class="queue-card" data-index="2"><img src="assets/guide-walking.png" alt="" /><span><strong>阿凱</strong><span>一直甜甜蜜蜜到永遠</span></span></button><button class="queue-card" data-index="3"><img src="assets/wedding-invitation.png" alt="" /><span><strong>欣怡</strong><span>見證你們最美的時刻</span></span></button></aside>
    </section>
    <section class="gallery" aria-label="所有照片與祝福"><div class="gallery-head"><h2>祝福集錦</h2><small id="syncTime">剛剛更新</small></div><div class="grid"><figure class="tile"><img src="assets/wedding-invitation.png" alt="婚禮照片" /><figcaption><blockquote>願幸福常在</blockquote><p>— 小宇</p></figcaption></figure><figure class="tile"><img src="assets/guide-parking.png" alt="婚禮現場照片" /><figcaption><blockquote>新婚快樂！</blockquote><p>— 婷婷</p></figcaption></figure><figure class="tile"><img src="assets/guide-walking.png" alt="婚禮現場照片" /><figcaption><blockquote>相愛一生，白首不離</blockquote><p>— 阿凱</p></figcaption></figure><figure class="tile"><img src="assets/wedding-invitation.png" alt="婚禮照片" /><figcaption><blockquote>期待下一次相聚</blockquote><p>— 欣怡</p></figcaption></figure></div></section>
    <footer>本頁為照片牆 Demo · 未來可接 Google Drive / Google Sheet 即時資料</footer>
  </main>
  <script>
    const slides=[
      {image:'assets/wedding-invitation.png',message:'願你們的每一天，都像今天一樣閃閃發光。',author:'— 小明'},
      {image:'assets/guide-parking.png',message:'願你們攜手走過每個春夏。',author:'— 婷婷'},
      {image:'assets/guide-walking.png',message:'一直甜甜蜜蜜到永遠。',author:'— 阿凱'},
      {image:'assets/wedding-invitation.png',message:'見證你們最美的時刻，祝福不缺席。',author:'— 欣怡'},
      {image:'assets/guide-parking.png',message:'新婚快樂，幸福久久！',author:'— 小宇'},
      {image:'assets/guide-walking.png',message:'相愛一生，白首不離。',author:'— 佩珊'}
    ];
    const image=document.getElementById('heroImage'),message=document.getElementById('heroMessage'),author=document.getElementById('heroAuthor'),indexLabel=document.getElementById('heroIndex'),cards=[...document.querySelectorAll('.queue-card')];
    let current=0;
    function showSlide(next){current=(next+slides.length)%slides.length;const item=slides[current];image.style.animation='none';void image.offsetWidth;image.src=item.image;image.alt=`婚禮照片 ${String(current+1).padStart(2,'0')}`;image.style.animation='kenburns 5s ease both';message.textContent=item.message;author.textContent=item.author;indexLabel.textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;cards.forEach((card,i)=>card.classList.toggle('is-active',i===current%cards.length));document.getElementById('syncTime').textContent=`${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 更新`;}
    cards.forEach(card=>card.addEventListener('click',()=>showSlide(Number(card.dataset.index))));
    showSlide(0);setInterval(()=>showSlide(current+1),5000);
  </script>
</body>
</html>
