<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--cream:#fbf6ee;--ink:#5d493c;--muted:#a58973}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#241c1c;color:var(--cream);font-family:"Noto Serif TC","PingFang TC",serif}
body{display:grid;place-items:center;min-height:100svh;padding:0;overflow:hidden}
.wall{position:relative;width:100vw;height:100svh;overflow:hidden;background:#241c1c}
.stage{position:absolute;inset:0;z-index:0;display:grid;place-items:center;background:#241c1c url("assets/hero-forest-illustration.png") center/cover no-repeat}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,#160d0dcc 0%,transparent 35%,transparent 65%,#160d0d99 100%),linear-gradient(0deg,#160d0dcc 0%,transparent 42%)}
.stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 40%,#08070655 100%),linear-gradient(180deg,#0002,transparent 22%,transparent 78%,#0005)}
.brand{position:absolute;z-index:20;left:50%;top:5.5%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 3px 18px #0009;pointer-events:none}
.brand b{display:block;font-family:"Ma Shan Zheng",cursive;font-size:clamp(30px,4.2vw,70px);line-height:1;font-weight:400;letter-spacing:.03em}
.brand span{display:block;margin-top:9px;font-family:"Noto Serif TC",serif;font-size:clamp(9px,1.1vw,18px);font-weight:500;letter-spacing:.34em;opacity:.9}
.live{position:absolute;z-index:20;right:3%;top:4%;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #fff6;border-radius:999px;background:#211d1bcc;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:clamp(10px,1vw,14px);letter-spacing:.12em;backdrop-filter:blur(7px)}
.live i{display:block;width:8px;height:8px;border-radius:50%;background:#e38e7a;box-shadow:0 0 0 5px #e38e7a2e;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}

.qr-card{position:absolute;z-index:30;left:16px;top:16px;width:76px;padding:6px;border-radius:14px;background:#fffaf0ee;box-shadow:0 8px 24px #0006;backdrop-filter:blur(8px);pointer-events:auto;text-decoration:none;transition:transform .2s ease,opacity .2s ease}
.qr-card img{display:block;width:64px;height:64px;margin:0 auto;background:#fff}
.qr-card:hover{transform:translateY(-2px) scale(1.03)}

.hero-photo{position:absolute;left:50%;top:50%;z-index:5;width:min(42vw,560px);height:min(65vh,600px);transform:translate(-50%,-48%);display:grid;place-items:center;pointer-events:none;transition:opacity .8s ease,transform .8s ease}
.hero-photo img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;border-radius:15px;filter:drop-shadow(0 18px 40px #000b)}

.feed-layer{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none}
.feed-item{position:absolute;width:clamp(115px,12vw,205px);padding:7px 9px;border:1px solid #fff8;border-radius:13px;background:#21191de8;color:#fff;box-shadow:0 12px 30px #0008;backdrop-filter:blur(8px);opacity:0;animation:feedIn .9s cubic-bezier(.18,.8,.25,1) both;will-change:transform,opacity}
.feed-item.photo-only{padding:5px;background:#fff3}
.feed-item img{display:block;width:100%;height:auto;max-height:135px;object-fit:contain;border-radius:9px;background:#130f0f}
.feed-row{display:flex;align-items:flex-start;gap:7px}
.avatar{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f0b49b,#9d6679);border:1px solid #fff;font-size:12px;font-weight:700}
.feed-content{min-width:0}
.feed-name{font-size:11px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-text{margin-top:3px;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:clamp(12px,1.05vw,17px);line-height:1.4;font-weight:400;word-break:break-word}
.feed-photo{margin-top:5px}
.feed-item.leaving{animation:feedOut .8s ease both}
@keyframes feedIn{0%{opacity:0;transform:translate3d(var(--from-x),var(--from-y),0) scale(.45) rotate(var(--from-r));filter:blur(5px)}55%{opacity:1}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(var(--r));filter:blur(0)}}
@keyframes feedOut{0%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(var(--r))}100%{opacity:0;transform:translate3d(var(--to-x),var(--to-y),0) scale(.7) rotate(var(--to-r))}}

.latest-message{position:absolute;left:50%;bottom:6.5%;z-index:25;width:min(420px,42vw);padding:12px 16px;transform:translateX(-50%);border:1px solid #fff9;border-radius:16px;background:#3c2930e8;color:#fff;box-shadow:0 14px 35px #0009;backdrop-filter:blur(9px);animation:latestIn .7s cubic-bezier(.2,.8,.25,1) both;pointer-events:none}
.latest-message.out{animation:latestOut .8s ease both}
.latest-row{display:flex;align-items:flex-start;gap:9px}
.latest-avatar{width:31px;height:31px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f0b49b,#9d6679);border:1px solid #fff;font-weight:700}
.latest-name{font-size:11px;opacity:.8}
.latest-text{margin-top:2px;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:clamp(14px,1.4vw,21px);line-height:1.45;font-weight:400}
@keyframes latestIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes latestOut{to{opacity:0;transform:translate(-50%,-18px) scale(.96)}}

.connection-status{position:absolute;right:3%;bottom:3%;z-index:30;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:11px;opacity:.55;pointer-events:none;transition:opacity .3s ease}
.connection-status.error{opacity:.9}

@media(max-width:700px){
  .brand{top:5%}
  .brand b{font-size:28px}
  .brand span{font-size:9px;letter-spacing:.25em}
  .live{right:3%;top:3%;padding:6px 9px;font-size:9px}
  .live i{width:6px;height:6px}
  .qr-card{left:8px;top:8px;width:58px;padding:4px}
  .qr-card img{width:50px;height:50px}
  .hero-photo{width:78vw;height:54vh;top:49%}
  .feed-item{width:42vw;padding:7px 8px;border-radius:11px}
  .feed-item img{max-height:105px}
  .avatar{width:25px;height:25px;font-size:11px}
  .feed-name{font-size:9px}
  .feed-text{font-size:12px}
  .latest-message{width:78vw;bottom:5.5%;padding:9px 11px}
  .latest-avatar{width:28px;height:28px}
  .latest-text{font-size:14px}
  .connection-status{right:3%;bottom:1.5%;font-size:9px}
}
</style>
</head>

<body>
<main class="wall" aria-label="婚禮現場照片牆">

  <div class="stage">
    <div class="hero-photo" id="heroPhoto">
      <img src="assets/hero-forest.jpg" alt="婚禮照片牆">
    </div>
  </div>

  <div class="veil"></div>

  <div class="brand">
    <b>Yu-Ming &amp; Jia-Yu</b>
    <span>OUR WEDDING DAY</span>
  </div>

  <div class="live">
    <i></i>
    <span>現場照片牆</span>
  </div>

  <a class="qr-card" id="qrCard" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener" aria-label="掃碼上傳照片與祝福">
    <img id="qrImage" src="" alt="掃碼上傳照片">
  </a>

  <div class="feed-layer" id="feedLayer"></div>

  <div id="latestMessage" class="latest-message" style="display:none"></div>

  <div id="connectionStatus" class="connection-status">即時同步中</div>
</main>

<script>
const DATA_ENDPOINT="https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec";
const UPLOAD_URL="https://jiayuweng.github.io/invitation/upload.html";

const wall=document.querySelector(".wall");
const feedLayer=document.getElementById("feedLayer");
const latestMessage=document.getElementById("latestMessage");
const connectionStatus=document.getElementById("connectionStatus");
const heroPhoto=document.getElementById("heroPhoto");
const qrImage=document.getElementById("qrImage");

qrImage.src="https://quickchart.io/qr?size=180&text="+encodeURIComponent(UPLOAD_URL);

let playlist=[];
const knownIds=new Set();
const shownBlessings=new Set();
const activeFeed=new Map();

const positions=[
  ["3%","20%"],["20%","31%"],["42%","18%"],["68%","20%"],
  ["82%","38%"],["8%","64%"],["29%","72%"],["67%","70%"]
];

function cleanText(value){return String(value==null?"":value).trim()}
function getName(item){return cleanText(item.name||item.Name||item.姓名||item.nickname||"親友")}
function getText(item){return cleanText(item.text||item.message||item.blessing||item.留言||item.祝福)}
function getUrl(item){return cleanText(item.url||item.photoUrl||item.image||item.imageUrl||item.photo||item.照片)}
function getKind(item){return cleanText(item.kind||item.type||item.類型||"upload").toLowerCase()}
function hasPhoto(item){return Boolean(getUrl(item))}
function hasText(item){return Boolean(getText(item))}

function normalizeImageUrl(url){
  url=cleanText(url);
  if(!url)return "";

  if(url.includes("drive.google.com/thumbnail")){
    if(!url.includes("sz=")&&!url.includes("sz=w")){
      return url+(url.includes("?")?"&":"?")+"sz=w1600";
    }
    return url;
  }

  if(url.includes("drive.google.com/uc?export=view&id=")){
    const id=url.split("id=")[1]?.split("&")[0];
    if(id)return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1600";
  }

  const fileMatch=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(fileMatch){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(fileMatch[1])+"&sz=w1600";
  }

  const openMatch=url.match(/drive\.google\.com\/open\?id=([^&]+)/);
  if(openMatch){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(openMatch[1])+"&sz=w1600";
  }

  return url;
}

function getSourceId(item,index){
  const raw=item.sourceId||item.id||item.ID||item.timestamp||item.time||item.createdAt||item.created||item.row||item.rowNumber;
  if(raw!=null&&cleanText(raw))return cleanText(raw);
  return [getName(item),getText(item),getUrl(item),index].join("|");
}

function normalizeItem(item,index){
  const sourceId=getSourceId(item,index);
  return {
    ...item,
    sourceId,
    id:sourceId,
    kind:getKind(item),
    name:getName(item),
    text:getText(item),
    url:normalizeImageUrl(getUrl(item))
  };
}

function extractItems(payload){
  if(Array.isArray(payload))return payload;
  if(!payload||typeof payload!=="object")return [];
  if(Array.isArray(payload.items))return payload.items;
  if(Array.isArray(payload.photos))return payload.photos;
  if(Array.isArray(payload.data))return payload.data;

  const result=[];
  if(Array.isArray(payload.preset))result.push(...payload.preset);
  if(Array.isArray(payload.live))result.push(...payload.live);
  if(Array.isArray(payload.uploads))result.push(...payload.uploads);
  if(Array.isArray(payload.blessings))result.push(...payload.blessings);
  return result;
}

function appendIncoming(rawItems){
  if(!Array.isArray(rawItems))return [];

  const newItems=[];

  rawItems.forEach((rawItem,index)=>{
    if(!rawItem)return;

    const item=normalizeItem(rawItem,index);
    const id=item.sourceId;

    if(!id||knownIds.has(id))return;

    knownIds.add(id);
    playlist.push(item);
    newItems.push(item);
  });

  if(playlist.length>1000)playlist=playlist.slice(-1000);

  return newItems;
}

let syncing=false;

async function pollIncoming(){
  if(!DATA_ENDPOINT||syncing)return;

  syncing=true;

  try{
    const url=DATA_ENDPOINT+"?t="+Date.now();

    const response=await fetch(url,{
      method:"GET",
      cache:"no-store",
      credentials:"omit"
    });

    if(!response.ok)throw new Error("HTTP "+response.status);

    const payload=await response.json();
    const rawItems=extractItems(payload);
    const newItems=appendIncoming(rawItems);

    if(newItems.length)handleNewItems(newItems);

    connectionStatus.textContent="即時同步中";
    connectionStatus.classList.remove("error");

  }catch(error){
    console.warn("照片牆同步暫時無法連線",error);
    connectionStatus.textContent="同步連線中…";
    connectionStatus.classList.add("error");
  }finally{
    syncing=false;
  }
}

function handleNewItems(items){
  items.forEach((item,index)=>{
    if(hasText(item))showBlessing(item,index*350);
    addFeedItem(item);
  });

  preloadNewPhotos(items);

  if(items.length)heroPhoto.style.opacity="0";
}

function createFeedElement(item,positionIndex){
  const el=document.createElement("article");
  const photo=hasPhoto(item);
  const text=hasText(item);

  el.className="feed-item"+(photo&&!text?" photo-only":"");

  const pos=positions[positionIndex%positions.length];
  el.style.left=pos[0];
  el.style.top=pos[1];

  const fromX=Math.random()>.5?"":"-";
  const toX=Math.random()>.5?"":"-";
  const fromR=(Math.random()*20-10).toFixed(1);
  const r=(Math.random()*6-3).toFixed(1);
  const toR=(Math.random()*18-9).toFixed(1);

  el.style.setProperty("--from-x",fromX+(18+Math.round(Math.random()*24))+"vw");
  el.style.setProperty("--from-y",(15+Math.round(Math.random()*25))+"vh");
  el.style.setProperty("--from-r",fromR+"deg");
  el.style.setProperty("--r",r+"deg");
  el.style.setProperty("--to-x",toX+(16+Math.round(Math.random()*20))+"vw");
  el.style.setProperty("--to-y","-24vh");
  el.style.setProperty("--to-r",toR+"deg");
  el.dataset.feedKey=item.sourceId;

  let html="";

  if(text){
    const avatar=(getName(item).slice(0,1)||"♡");
    html+='<div class="feed-row"><div class="avatar">'+escapeHtml(avatar)+'</div><div class="feed-content"><div class="feed-name">'+escapeHtml(getName(item))+'</div><div class="feed-text">'+escapeHtml(getText(item))+'</div></div></div>';
  }

  if(photo){
    html+='<img class="feed-photo" src="'+escapeAttribute(item.url)+'" alt="婚禮照片">';
  }

  el.innerHTML=html;
  return el;
}

function escapeHtml(value){
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function escapeAttribute(value){return escapeHtml(value)}

function addFeedItem(item){
  if(activeFeed.has(item.sourceId))return;

  if(activeFeed.size>=8){
    const first=activeFeed.keys().next().value;
    const old=activeFeed.get(first);
    if(old)removeFeedElement(first,old);
  }

  const el=createFeedElement(item,activeFeed.size);
  feedLayer.appendChild(el);
  activeFeed.set(item.sourceId,el);
}

function removeFeedElement(key,el){
  if(!el){
    activeFeed.delete(key);
    return;
  }

  if(el.classList.contains("leaving"))return;

  el.classList.add("leaving");

  el.addEventListener("animationend",()=>{
    el.remove();
    activeFeed.delete(key);
  },{once:true});
}

let latestTimer=null;

function showBlessing(item,delay=0){
  const key=item.sourceId;
  if(shownBlessings.has(key))return;

  shownBlessings.add(key);

  setTimeout(()=>displayLatestMessage(item),delay);
}

function displayLatestMessage(item){
  latestMessage.classList.remove("out");
  latestMessage.style.display="block";

  const avatar=(getName(item).slice(0,1)||"♡");

  latestMessage.innerHTML=
    '<div class="latest-row">'+
      '<div class="latest-avatar">'+escapeHtml(avatar)+'</div>'+
      '<div>'+
        '<div class="latest-name">'+escapeHtml(getName(item))+'</div>'+
        '<div class="latest-text">'+escapeHtml(getText(item))+'</div>'+
      '</div>'+
    '</div>';

  void latestMessage.offsetWidth;
  latestMessage.classList.remove("out");

  if(latestTimer)clearTimeout(latestTimer);

  latestTimer=setTimeout(()=>{
    latestMessage.classList.add("out");

    setTimeout(()=>{
      if(latestMessage.classList.contains("out")){
        latestMessage.style.display="none";
      }
    },850);
  },5500);
}

let photoIndex=0;
let currentPhotoKey="";

function getPhotos(){
  return playlist.filter(item=>hasPhoto(item));
}

function showNextPhoto(){
  const photos=getPhotos();
  if(!photos.length)return;

  if(!currentPhotoKey){
    photoIndex=0;
  }else{
    photoIndex=(photoIndex+1)%photos.length;
  }

  const item=photos[photoIndex];
  currentPhotoKey=item.sourceId;

  const img=heroPhoto.querySelector("img");
  if(!img)return;

  heroPhoto.style.opacity="0";

  setTimeout(()=>{
    img.src=item.url;
    heroPhoto.style.opacity="1";
  },350);
}

function preloadNewPhotos(items){
  items.filter(item=>hasPhoto(item)).forEach(item=>{
    const image=new Image();
    image.src=item.url;
  });
}

async function startup(){
  await pollIncoming();

  const photos=getPhotos();

  if(photos.length){
    photoIndex=0;
    const first=photos[0];
    currentPhotoKey=first.sourceId;

    const img=heroPhoto.querySelector("img");
    if(img)img.src=first.url;

    heroPhoto.style.opacity="1";
  }

  const blessings=playlist.filter(item=>hasText(item)).slice(-3);

  blessings.forEach(item=>shownBlessings.add(item.sourceId));

  if(blessings.length){
    displayLatestMessage(blessings[blessings.length-1]);
  }
}

/* 唯一的 Google Sheet polling：每 2 秒 */
setInterval(()=>{
  pollIncoming();
},2000);

/* 照片輪播 */
setInterval(()=>{
  showNextPhoto();
},8000);

startup();
</script>
</body>
</html>
