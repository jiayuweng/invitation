<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<style>
:root{--cream:#fff8ee;--ink:#fff;--glass:#2b2024d9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140e0e;color:var(--ink);font-family:"Noto Serif TC","PingFang TC",serif}.wall{position:relative;width:100vw;height:100vh;overflow:hidden;background:#241c1c url("assets/hero-forest-illustration.png") center/cover no-repeat}.wall:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 32%,#08050666 100%),linear-gradient(#0002,#0006)}.brand{position:absolute;z-index:3;top:5%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 3px 18px #0009}.brand b{display:block;font:clamp(30px,4.2vw,72px)/1 "Brush Script MT",cursive}.brand span{display:block;margin-top:8px;font-size:clamp(10px,1.2vw,18px);letter-spacing:.35em}.qr{position:absolute;z-index:20;right:22px;top:22px;width:108px;padding:8px 7px 6px;border-radius:14px;background:#fff;color:#49352d;text-align:center;text-decoration:none;box-shadow:0 8px 24px #0008}.qr img{display:block;width:82px;height:82px;margin:auto}.qr span{display:block;margin-top:4px;font-size:12px;font-weight:700;line-height:1.25}.photo-stage{position:absolute;inset:0;z-index:4;pointer-events:none}.hero-photo{position:absolute;left:50%;top:51%;width:min(27vw,310px);height:min(48vh,430px);transform:translate(-50%,-50%);object-fit:contain;border:1px solid #fff9;border-radius:16px;background:#1a1212aa;box-shadow:0 18px 45px #0009;animation:heroFade .9s ease both}.side-photo{position:absolute;width:clamp(128px,15vw,190px);height:clamp(150px,24vh,235px);padding:5px;object-fit:contain;border:1px solid #fff9;border-radius:14px;background:#fff2;box-shadow:0 12px 28px #0008;animation:cardIn .8s cubic-bezier(.2,.8,.25,1) both}.side-photo.out{animation:cardOut .7s ease both}.notice-stack{position:absolute;z-index:15;left:50%;bottom:5%;width:min(430px,42vw);transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;pointer-events:none}.notice{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #fff8;border-radius:17px;background:var(--glass);box-shadow:0 10px 28px #0008;animation:noticeIn .55s ease both}.notice.out{animation:noticeOut .7s ease both}.avatar{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:50%;background:linear-gradient(135deg,#efb29a,#956477);border:1px solid #fff;font-weight:700}.notice-copy{min-width:0;flex:1}.notice-name{font-size:12px;opacity:.8}.notice-line{font-size:clamp(12px,1.1vw,16px);line-height:1.35}.notice img{width:48px;height:48px;object-fit:cover;border-radius:8px}.floating-layer{position:absolute;z-index:12;inset:0;pointer-events:none}.float-msg{position:absolute;max-width:190px;padding:7px 9px;border:1px solid #fff9;border-radius:13px;background:#34232bd9;box-shadow:0 8px 20px #0008;animation:floatUp 6.5s ease both}.float-msg .who{font-size:10px;opacity:.75}.float-msg .words{font-size:clamp(11px,1vw,15px);font-weight:700;line-height:1.35}.emoji{position:absolute;z-index:13;font-size:clamp(24px,3vw,44px);animation:emojiUp 4.5s ease both}.reminder{position:absolute;z-index:14;left:50%;bottom:7%;transform:translateX(-50%);padding:10px 16px;border:1px solid #fff8;border-radius:14px;background:#34232be8;font-size:clamp(13px,1.2vw,18px);animation:remind 5s ease both;pointer-events:none}@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.7) rotate(-8deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}@keyframes cardOut{to{opacity:0;transform:translateY(-20vh) scale(.7) rotate(8deg)}}@keyframes heroFade{from{opacity:0}to{opacity:1}}@keyframes noticeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}@keyframes noticeOut{to{opacity:0;transform:translateY(-28px)}}@keyframes floatUp{from{opacity:0;transform:translateY(20px) scale(.8)}15%{opacity:1}to{opacity:0;transform:translate3d(var(--dx),-24vh,0) scale(.9)}}@keyframes emojiUp{from{opacity:0;transform:translateY(12px) scale(.7)}15%{opacity:1}to{opacity:0;transform:translateY(-25vh) scale(1.1)}}@keyframes remind{from{opacity:0;transform:translate(-50%,15px)}20%,78%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}@media(max-width:700px){.qr{right:9px;top:9px;width:72px;padding:5px}.qr img{width:58px;height:58px}.qr span{font-size:9px}.brand{top:6%}.hero-photo{width:42vw;height:40vh}.side-photo{width:24vw;height:25vh}.notice-stack{width:84vw;bottom:5%}.notice{padding:8px 10px}.notice img{width:40px;height:40px}.float-msg{max-width:42vw}.reminder{max-width:82vw;text-align:center}}
</style></head>
<body><main class="wall"><div class="brand"><b>Yu-Ming &amp; Jia-Yu</b><span>OUR WEDDING DAY</span></div><a class="qr" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener"><img src="https://quickchart.io/qr?size=180&amp;text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2Fupload.html" alt="QR Code"><span>填寫祝福!</span></a><section class="photo-stage" id="photoStage"><img class="hero-photo" id="heroPhoto" alt="婚紗照"></section><section class="floating-layer" id="floating-photos"></section><section class="notice-stack" id="noticeStack"></section><section class="floating-layer" id="floatingLayer"></section></main>
<script>
const CONFIG={endpoint:'https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec',maxPhotos:6,maxNotices:4,maxFloats:8};
const wall=document.querySelector('.wall'),stage=document.getElementById('photoStage'),hero=document.getElementById('heroPhoto'),stack=document.getElementById('noticeStack'),floatLayer=document.getElementById('floatingLayer');
const state={items:[],known:new Set(),photoIds:new Set(),messageIds:new Set(),initial:true,heroIndex:0,busy:false};
const text=x=>String(x.text||x.message||'').trim();
const photoUrl=x=>String(x.url||x.imageUrl||'').replace('/uc?export=view&id=','/thumbnail?id=');
const key=x=>String(x.sourceId||x.id||x.timestamp||'');
function normalize(x,i){const url=photoUrl(x);const kind=x.kind||x.type||(url?'upload':'blessing');return Object.assign({},x,{id:key(x)||'event-'+i,sourceId:key(x)||'event-'+i,kind,name:String(x.name||'親友'),text:text(x),url:url?(url.includes('sz=')?url:url+'&sz=w1200'):''})}
function positions(){const p=[['7%','24%'],['25%','17%'],['70%','22%'],['8%','64%'],['70%','64%'],['39%','72%']];return p.sort(()=>Math.random()-.5)}
function renderPhotos(){const photos=state.items.filter(x=>x.url),side=photos.filter(x=>x.kind!=='preset').slice(-CONFIG.maxPhotos);const pos=positions();const existing=new Map([...stage.querySelectorAll('.side-photo')].map(e=>[e.dataset.id,e]));const keep=new Set(side.map(key));existing.forEach((el,id)=>{if(!keep.has(id)){el.classList.add('out');el.addEventListener('animationend',()=>el.remove(),{once:true})}});side.forEach((item,i)=>{if(existing.has(key(item)))return;const el=document.createElement('img');el.className='side-photo';el.dataset.id=key(item);el.src=item.url;el.alt=item.name+'的照片';el.style.left=pos[i][0];el.style.top=pos[i][1];el.style.setProperty('--r',(Math.random()*8-4).toFixed(1)+'deg');stage.appendChild(el)});const presets=photos.filter(x=>x.kind==='preset');if(!hero.src&&!presets.length&&side.length)hero.src=side[0].url;if(presets.length){const p=presets[state.heroIndex%presets.length];if(hero.dataset.id!==key(p)){hero.dataset.id=key(p);hero.src=p.url}}}
function addNotice(item){if(!text(item)&&!item.url)return;if(text(item)&&/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(text(item))){const e=document.createElement('div');e.className='emoji';e.textContent=text(item);e.style.left=(18+Math.random()*64)+'%';e.style.bottom=(18+Math.random()*22)+'%';wall.appendChild(e);e.addEventListener('animationend',()=>e.remove(),{once:true});return}const el=document.createElement('article');el.className='notice';const hasPhoto=!!item.url;el.innerHTML='<div class="avatar">'+item.name.slice(0,1)+'</div><div class="notice-copy"><div class="notice-name">'+item.name+'</div><div class="notice-line">'+(hasPhoto?'傳送了一張照片':('留下了一則祝福：'+text(item)))+'</div></div>'+(hasPhoto?'<img src="'+item.url+'" alt="">':'');stack.appendChild(el);while(stack.children.length>CONFIG.maxNotices){const old=stack.firstElementChild;old.classList.add('out');old.addEventListener('animationend',()=>old.remove(),{once:true})}setTimeout(()=>{if(el.isConnected){el.classList.add('out');el.addEventListener('animationend',()=>el.remove(),{once:true})}},8500)}
function addFloat(item){if(!text(item)||text(item).length<2)return;const el=document.createElement('article');el.className='float-msg';el.style.left=(8+Math.random()*78)+'%';el.style.top=(20+Math.random()*52)+'%';el.style.setProperty('--dx',(Math.random()*12-6)+'vw');el.innerHTML='<div class="who">'+item.name+'</div><div class="words">'+text(item)+'</div>';floatLayer.appendChild(el);while(floatLayer.children.length>CONFIG.maxFloats)floatLayer.firstElementChild.remove();el.addEventListener('animationend',()=>el.remove(),{once:true})}
function process(items){const fresh=[];items.map(normalize).forEach(item=>{if(state.known.has(key(item)))return;state.known.add(key(item));state.items.push(item);fresh.push(item)});PhotoRenderer.setPhotos(fresh.filter(item=>item.kind==='preset'));renderPhotos();if(!state.initial)fresh.forEach(item=>{if(item.kind!=='preset'){addNotice(item);if(item.url)MessageRenderer.addFloatingPhoto(item.url);if(item.text)MessageRenderer.addFloatingMessage(item.text)}});state.initial=false}
async function sync(){if(state.busy)return;state.busy=true;let timer;try{const ctrl=new AbortController();timer=setTimeout(()=>ctrl.abort(),20000);const res=await fetch(CONFIG.endpoint+'?t='+Date.now(),{cache:'no-store',signal:ctrl.signal});if(res.ok){const data=await res.json();const list=Array.isArray(data)?data:(data.items||data.data||data.photos||data.uploads||[]);process(list)}}catch(e){if(e.name!=='AbortError')console.warn('照片同步暫時無法連線',e)}finally{clearTimeout(timer);state.busy=false;setTimeout(sync,2000)}}
setInterval(()=>{const presets=state.items.filter(x=>x.kind==='preset'&&x.url);if(presets.length>1){state.heroIndex++;renderPhotos()}},12000);setInterval(()=>{if(!document.querySelector('.reminder')&&!state.items.some(x=>x.kind!=='preset'&&text(x))){const e=document.createElement('div');e.className='reminder';e.textContent='歡迎留下今天的回憶 ♡';wall.appendChild(e);e.addEventListener('animationend',()=>e.remove(),{once:true})}},18000);sync();
</script><style>.wall{background-image:url("hero-forest.jpg")!important}.side-photo{display:none!important}</style></body></html>
