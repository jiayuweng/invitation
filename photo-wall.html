<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ee;--ink:#5d493c;--muted:#a58973}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2a2522;color:var(--cream);font-family:"Noto Serif TC","PingFang TC",serif}body{display:grid;place-items:center;min-height:100svh;padding:14px}.wall{position:relative;width:min(100vw - 28px,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#191715;border-radius:10px;box-shadow:0 24px 80px #0009}.stage{position:absolute;inset:0;display:grid;place-items:center;background:#eee5d8 url('assets/wedding-invitation.png') center/cover no-repeat}.stage-photo{width:100%;height:100%;display:block;object-fit:contain;animation:photoIn 1.2s ease both}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#16120f99 0%,transparent 42%,transparent 70%,#16120f33 100%),linear-gradient(0deg,#16120f99 0%,transparent 42%);pointer-events:none}.brand{position:absolute;top:4.5%;left:4.2%;z-index:2;text-shadow:0 2px 16px #0008}.brand b{display:block;font:clamp(18px,3vw,48px)/1 "DM Serif Display",serif;letter-spacing:.04em}.brand span{display:block;margin-top:8px;font-size:clamp(9px,1vw,15px);letter-spacing:.25em;opacity:.85}.live{position:absolute;z-index:3;right:4%;top:5%;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #fff6;border-radius:999px;background:#211d1bcc;font-size:clamp(9px,1vw,14px);letter-spacing:.12em}.live i{width:8px;height:8px;border-radius:50%;background:#e38e7a;box-shadow:0 0 0 5px #e38e7a2e;animation:pulse 2s infinite}.message{position:absolute;z-index:3;left:4.2%;bottom:7%;max-width:54%;padding:clamp(12px,1.8vw,26px) clamp(16px,2.2vw,34px);border:1px solid #fff8;border-radius:14px;background:#fffaf0e8;color:var(--ink);box-shadow:0 10px 35px #1c120d55;backdrop-filter:blur(10px);animation:messageIn .8s ease both}.message small{display:block;margin-bottom:7px;color:#a67569;font-size:clamp(10px,1.1vw,16px);letter-spacing:.15em}.message strong{display:block;font-size:clamp(18px,2vw,32px);font-weight:500;line-height:1.55;letter-spacing:.08em}.message em{display:block;margin-top:8px;color:var(--muted);font-size:clamp(10px,1vw,14px);font-style:normal;letter-spacing:.14em}.counter{position:absolute;z-index:3;right:4%;bottom:7%;font:clamp(13px,1.2vw,20px) "DM Serif Display",serif;letter-spacing:.15em;text-shadow:0 2px 12px #0008}.queue{position:absolute;z-index:3;right:4%;bottom:15%;display:flex;gap:8px}.thumb{width:clamp(48px,6vw,94px);height:clamp(34px,4vw,60px);padding:0;overflow:hidden;border:1px solid #fff8;border-radius:6px;background:#ffffff22;opacity:.72;cursor:pointer;transition:.2s}.thumb:hover,.thumb.active{opacity:1;border-color:#fff;transform:translateY(-3px)}.thumb img{width:100%;height:100%;object-fit:cover}.hint{position:absolute;z-index:3;left:4.2%;top:17%;color:#fff9;font-size:clamp(9px,1vw,14px);letter-spacing:.12em}@keyframes photoIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}@keyframes messageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}@media(max-width:700px){body{padding:0}.wall{width:100vw;border-radius:0}.brand{top:5%;left:5%}.message{left:5%;bottom:8%;max-width:68%;padding:10px 13px;border-radius:10px}.message strong{font-size:16px}.message small,.message em{font-size:9px}.queue{right:5%;bottom:8%;gap:4px}.thumb{width:42px;height:29px}.counter{right:5%;bottom:4%;font-size:12px}.hint{left:5%;top:17%;font-size:9px}}
</style>
</head>
<body><main class="wall" aria-label="婚禮現場照片牆"><div class="stage"><div id="stageGrid" class="stage-grid"></div><img id="stagePhoto" class="stage-photo" alt="婚禮現場照片"></div><div class="veil"></div><div class="brand"><b>Yu-Ming &amp; Jia-Yu</b><span>OUR WEDDING DAY</span></div><div class="live"><i></i>現場照片牆</div><div class="hint">新照片會自動加入播放佇列</div><div class="message" id="message"><small id="messageName">親愛的新人</small><strong id="messageText">願你們一直幸福下去 ♡</strong><em id="messageTime">現場祝福</em></div><div class="queue" id="queue" aria-label="播放佇列"></div><div class="counter" id="counter">01 / 06</div></main>
<script>
const queue=document.getElementById('queue'),photo=document.getElementById('stagePhoto'),nameEl=document.getElementById('messageName'),textEl=document.getElementById('messageText'),timeEl=document.getElementById('messageTime'),counter=document.getElementById('counter');let playlist=[],index=0;function renderQueue(){queue.innerHTML='';playlist.slice(Math.max(0,index-2),index+4).forEach((item,offset)=>{const real=Math.max(0,index-2)+offset,b=document.createElement('button');b.className='thumb'+(real===index?' active':'');b.title=item.name;b.innerHTML=`<img src="${item.url}" alt="${item.name}的照片">`;b.onclick=()=>show(real);queue.appendChild(b)})}function show(next){if(!playlist.length)return;index=(next+playlist.length)%playlist.length;const item=playlist[index];photo.style.animation='none';void photo.offsetWidth;photo.src=item.url;photo.style.animation='photoIn 1.2s ease both';nameEl.textContent=item.name;textEl.textContent=item.text;timeEl.textContent=item.kind==='upload'?'剛剛上傳':(item.kind==='preset'?'預先婚紗照':'現場祝福');counter.textContent=`${String(index+1).padStart(2,'0')} / ${String(playlist.length).padStart(2,'0')}`;renderQueue()}function appendIncoming(items){const known=new Set(playlist.map(p=>p.sourceId||p.id));items.filter(p=>p.id&&p.text&&p.text.trim()&&!known.has(p.id)).forEach(p=>playlist.push({...p,sourceId:p.id,url:((p.url||'').replace('/uc?export=view&id=','/thumbnail?id=')+'&sz=w1200'),id:`${p.kind||'upload'}-${p.id}`}));renderQueue()}const DATA_ENDPOINT='https://script.google.com/macros/s/AKfycbyY_W_qWkIVH-hj3Yde2ki3PJEi9qqLVGlnTsO2thnJA6yAE7bnCat_QnQ_3fx7CY7M_w/exec';async function pollIncoming(){if(!DATA_ENDPOINT)return;try{const response=await fetch(DATA_ENDPOINT,{cache:'no-store'});if(response.ok)appendIncoming(await response.json())}catch(error){console.warn('照片同步暫時無法連線',error)}}const posterPreload=new Image();posterPreload.src='assets/wedding-invitation.png';const stageGrid=document.getElementById('stageGrid');const gridStyle=document.createElement('style');gridStyle.textContent='.stage-grid{position:absolute;inset:0;display:grid;gap:10px;padding:10px;z-index:1}.stage-grid.tile-1{grid-template-columns:1fr}.stage-grid.tile-2{grid-template-columns:repeat(2,1fr)}.stage-grid.tile-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid.tile-6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid .tile{position:relative;overflow:hidden;border-radius:8px;background:#211d1b;box-shadow:0 8px 24px #0005}.stage-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}.stage-grid .tile span{position:absolute;left:8px;right:8px;bottom:7px;padding:5px 7px;border-radius:5px;background:#211d1bcc;color:#fff;font-size:clamp(10px,1.1vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-grid .tile b{font-weight:500;margin-right:6px}.stage-photo{display:none!important}@media(max-width:700px){.stage-grid{gap:4px;padding:4px}.stage-grid .tile span{font-size:9px;left:4px;right:4px;bottom:4px;padding:3px}}';document.head.appendChild(gridStyle);function renderGrid(){if(!playlist.length){stageGrid.innerHTML="";return;}const count=playlist.length<=1?1:playlist.length<=3?2:playlist.length<=8?4:6;stageGrid.className='stage-grid tile-'+count;stageGrid.innerHTML='';for(let n=0;n<count;n++){const item=playlist[(index+n)%playlist.length],tile=document.createElement('div');tile.className='tile';tile.innerHTML='<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'"><span><b>'+(item.name||'親友')+'</b>'+(item.text||'')+'</span>';stageGrid.appendChild(tile)}}show(0);renderGrid();setInterval(()=>{show(index+1);renderGrid()},8000);setInterval(renderGrid,1000);setInterval(pollIncoming,5000);pollIncoming();
</script></body></html>
