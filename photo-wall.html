:root{--cream:#fbf6ee;--ink:#5d493c;--muted:#a58973}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2a2522;color:var(--cream);font-family:"Noto Serif TC","PingFang TC",serif}body{display:grid;place-items:center;min-height:100svh;padding:14px}.wall{position:relative;width:min(100vw - 28px,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#191715;border-radius:10px;box-shadow:0 24px 80px #0009}.stage{position:absolute;inset:0;display:grid;place-items:center;background:#eee5d8 url('assets/hero-forest.jpg') center/cover no-repeat}.stage-photo{width:100%;height:100%;display:block;object-fit:contain;animation:photoIn 1.2s ease both}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#16120f99 0%,transparent 42%,transparent 70%,#16120f33 100%),linear-gradient(0deg,#16120f99 0%,transparent 42%);pointer-events:none}.brand{position:absolute;top:4.5%;left:4.2%;z-index:2;text-shadow:0 2px 16px #0008}.brand b{display:block;font:clamp(18px,3vw,48px)/1 "DM Serif Display",serif;letter-spacing:.04em}.brand span{display:block;margin-top:8px;font-size:clamp(9px,1vw,15px);letter-spacing:.25em;opacity:.85}.live{position:absolute;z-index:3;right:4%;top:5%;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #fff6;border-radius:999px;background:#211d1bcc;font-size:clamp(9px,1vw,14px);letter-spacing:.12em}.live i{width:8px;height:8px;border-radius:50%;background:#e38e7a;box-shadow:0 0 0 5px #e38e7a2e;animation:pulse 2s infinite}.message{position:absolute;z-index:3;left:4.2%;bottom:7%;max-width:54%;padding:clamp(12px,1.8vw,26px) clamp(16px,2.2vw,34px);border:1px solid #fff8;border-radius:14px;background:#fffaf0e8;color:var(--ink);box-shadow:0 10px 35px #1c120d55;backdrop-filter:blur(10px);animation:messageIn .8s ease both}.message small{display:block;margin-bottom:7px;color:#a67569;font-size:clamp(10px,1.1vw,16px);letter-spacing:.15em}.message strong{display:block;font-size:clamp(18px,2vw,32px);font-weight:500;line-height:1.55;le <body><main class="wall" aria-label="婚禮現場照片牆"><div class="stage"><div id="stageGrid" class="stage-grid"></div><img id="stagePhoto" class="stage-photo" alt="婚禮現場照片"></div><div class="veil"></div><div class="brand"><b>Yu-Ming &amp; Jia-Yu</b><span>OUR WEDDING DAY</span></div><div class="live"><i></i>現場照片牆</div><div class="hint">新照片會自動加入播放佇列</div><div class="message" id="message"><small id="messageName">親愛的新人</small><strong id="messageText">願你們一直幸福下去 ♡</strong><em id="messageTime">現場祝福</em></div><div class="queue" id="queue" aria-label="播放佇列"></div><div class="counter" id="counter">01 / 06</div><a class="qr-card" href="https://jiayuweng.github.io/invitation/" target="_blank" rel="noopener" aria-label="掃描上傳照片與祝福"><img src="https://quickchart.io/qr?size=180&text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2F" alt="掃碼上傳照片 QR Code"><span>掃碼上傳照片<br>寫下祝福</span></a></main>
<script>
const queue=document.getElementById('queue'),photo=document.getElementById('stagePhoto'),nameEl=document.getElementById('messageName'),textEl=document.getElementById('messageText'),timeEl=document.getElementById('messageTime'),counter=document.getElementById('counter');let playlist=[],index=0;function renderQueue(){queue.innerHTML='';playlist.slice(Math.max(0,index-2),index+4).forEach((item,offset)=>{const real=Math.max(0,index-2)+offset,b=document.createElement('button');b.className='thumb'+(real===index?' active':'');b.title=item.name;b.innerHTML=`<img src="${item.url}" alt="${item.name}的照片">`;b.onclick=()=>show(real);queue.appendChild(b)})}function show(next){if(!playlist.length){nameEl.textContent='';textEl.textContent='';timeEl.textContent='';return}index=(next+playlist.length)%playlist.length;const item=playlist[index];if(item.url){photo.style.display='block';photo.src=item.url}else{photo.style.display='none'}nameEl.textContent=item.text?(item.name||'親友'):'';textEl.textContent=item.text||'';timeEl.textContent=item.text?(item.kind==='upload'?'現場祝福':item.kind==='preset'?'預先婚紗照':'祝福留言'):'';document.getElementById('message').style.display=item.text?'block':'none';counter.textContent=`${String(index+1).padStart(2,'0')} / ${String(playlist.length).padStart(2,'0')}`;renderQueue()}function appendIncoming(items){const known=new Set(playlist.map(p=>p.sourceId||p.id));items.filter(p=>p.id&&!known.has(p.id)).forEach(p=>playlist.push({...p,sourceId:p.id,url:((p.url||'').replace('/uc?export=view&id=','/thumbnail?id=')+'&sz=w1200'),id:`${p.kind||'upload'}-${p.id}`}));renderQueue()}const DATA_ENDPOINT='https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec';async function pollIncoming(){if(!DATA_ENDPOINT)return;try{const response=await fetch(DATA_ENDPOINT,{cache:'no-store'});if(response.ok)appendIncoming(await response.json())}catch(error){console.warn('照片同步暫時無法連線',error)}}const posterPreload=new Image();posterPreload.src='assets/hero-forest.jpg';const stageGrid=document.getElementById('stageGrid');const gridStyle=document.createElement('style');gridStyle.textContent='.stage-grid{position:absolute;inset:0;display:grid;gap:10px;padding:10px;z-index:1}.stage-grid.tile-1{grid-template-columns:1fr}.stage-grid.tile-2{grid-template-columns:repeat(2,1fr)}.stage-grid.tile-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid.tile-6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid .tile{position:relative;overflow:hidden;border-radius:8px;background:#211d1b;box-shadow:0 8px 24px #0005}.stage-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}.stage-grid .tile span{position:absolute;left:8px;right:8px;bottom:7px;padding:5px 7px;border-radius:5px;background:#211d1bcc;color:#fff;font-size:clamp(10px,1.1vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-grid .tile b{font-weight:500;margin-right:6px}.stage-photo{display:none!important}@media(max-width:700px){.stage-grid{gap:4px;padding:4px}.stage-grid .tile span{font-size:9px;left:4px;right:4px;bottom:4px;padding:3px}}';document.head.appendChild(gridStyle);function renderGrid(){if(!playlist.length){stageGrid.innerHTML='';return}const count=playlist.length<=1?1:playlist.length<=3?2:playlist.length<=8?4:6;stageGrid.className='stage-grid tile-'+count;stageGrid.innerHTML='';for(let n=0;n<count;n++){const item=playlist[(index+n)%playlist.length],tile=document.createElement('div');tile.className='tile';if(item.url){tile.innerHTML='<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'">'}else{tile.innerHTML='<div class="text-tile">'+(item.text||'')+'</div>'}stageGrid.appendChild(tile)}}show(0);renderGrid();setInterval(()=>{show(index+1);renderGrid()},8000);setInterval(renderGrid,1000);setInterval(pollIncoming,5000);pollIncoming();
</script>
<script>
// Normalize Google Apps Script responses so preset and live photos both enter the carousel.
(async function syncPhotoCollections(){
  try{
    const response=await fetch('https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec',{cache:'no-store'});
    if(!response.ok)return;
    const payload=await response.json();
    const items=Array.isArray(payload)?payload:(payload.items||payload.photos||payload.data||[].concat(payload.preset||[],payload.live||[],payload.uploads||[]));
    if(Array.isArray(items)&&items.length)appendIncoming(items);
  }catch(error){console.warn('照片同步暫時無法連線',error)}
})();
</script>

<script>
  // Use five slots for larger playlists, leaving the title/QR area clear.
  renderGrid=function(){
    if(!playlist.length){stageGrid.innerHTML='';return}
    const count=playlist.length<=1?1:playlist.length<=3?2:5;
    stageGrid.className='stage-grid tile-'+count;
    stageGrid.innerHTML='';
    for(let n=0;n<count;n++){
      const item=playlist[(index+n)%playlist.length],tile=document.createElement('div');
      tile.className='tile';
      tile.innerHTML=item.url?'<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'">':'<div class="text-tile">'+(item.text||'')+'</div>';
      stageGrid.appendChild(tile);
    }
  };
  renderGrid();
</script>

<script>
// Live-feed mode: keep existing cards in place and animate only newly arrived cards.
(function enableLiveFeed(){
  const MAX_CARDS=5, grid=document.getElementById('stageGrid');
  const slots=[
    ['3%','22%','36%','70%','-4deg'],['23%','7%','36%','70%','2deg'],
    ['46%','19%','36%','70%','-2deg'],['66%','6%','36%','70%','4deg'],
    ['32%','27%','37%','67%','1deg']
  ];
  const keyOf=item=>String(item.sourceId||item.id||'');
  const buildTile=item=>{
    const tile=document.createElement('div'),key=keyOf(item),slot=slots[grid.children.length%slots.length];
    tile.className='tile fly-in'; tile.dataset.feedKey=key;
    tile.style.setProperty('--feed-x',slot[0]); tile.style.setProperty('--feed-y',slot[1]);
    tile.style.setProperty('--feed-w',slot[2]); tile.style.setProperty('--feed-h',slot[3]); tile.style.setProperty('--feed-r',slot[4]);
    tile.style.setProperty('--feed-from-x',(Math.random()>.5?'':'-')+(18+Math.round(Math.random()*24))+'vw');
    tile.style.setProperty('--feed-from-y',(18+Math.round(Math.random()*24))+'vh'); tile.style.setProperty('--feed-from-r',(Math.random()>.5?'':'-')+(10+Math.round(Math.random()*12))+'deg');
    tile.style.setProperty('--feed-to-x',(Math.random()>.5?'':'-')+(16+Math.round(Math.random()*20))+'vw'); tile.style.setProperty('--feed-to-y','-24vh'); tile.style.setProperty('--feed-to-r',(Math.random()>.5?'':'-')+'12deg');
    tile.innerHTML=item.url?'<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'">':'<div class="text-tile">'+(item.text||'')+'</div>';
    tile.addEventListener('animationend',()=>tile.classList.remove('fly-in'),{once:true});
    return tile;
  };
  renderGrid=function(){
    grid.classList.add('feed-mode');
    const wanted=playlist.slice(-MAX_CARDS),keys=new Set(wanted.map(keyOf));
    Array.from(grid.children).forEach(tile=>{if(!keys.has(tile.dataset.feedKey)){tile.classList.add('leaving');tile.addEventListener('animationend',()=>tile.remove(),{once:true})}});
    wanted.forEach(item=>{if(!grid.querySelector('[data-feed-key="'+CSS.escape(keyOf(item))+'"]'))grid.appendChild(buildTile(item))});
  };
  renderGrid();
  const previousAppend=appendIncoming;
  appendIncoming=function(items){previousAppend(items);renderGrid()};
  setInterval(renderGrid,1500);
})();
</script>
