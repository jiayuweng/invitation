<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<style>
:root{--ink:#fff;--glass:#2b2024d9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140e0e;color:var(--ink);font-family:"Noto Serif TC","PingFang TC",serif}
.wall{position:relative;width:100vw;height:100vh;overflow:hidden;background:#241c1c url("hero-forest.jpg") center/cover no-repeat}
.wall:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 32%,#08050666 100%),linear-gradient(#0002,#0006)}
.brand{position:absolute;z-index:3;top:5%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 3px 18px #0009}
.brand b{display:block;font:clamp(30px,4.2vw,72px)/1 "Brush Script MT",cursive}
.brand span{display:block;margin-top:8px;font-size:clamp(10px,1.2vw,18px);letter-spacing:.35em}
.qr{position:absolute;z-index:20;right:22px;top:22px;width:108px;padding:8px 7px 6px;border-radius:14px;background:#fff;color:#49352d;text-align:center;text-decoration:none;box-shadow:0 8px 24px #0008}
.qr img{display:block;width:82px;height:82px;margin:auto}
.qr span{display:block;margin-top:4px;font-size:12px;font-weight:700;line-height:1.25}
.photo-stage{position:absolute;inset:0;z-index:4;pointer-events:none}
.hero-photo{position:absolute;left:50%;top:51%;width:min(27vw,310px);height:min(48vh,430px);transform:translate(-50%,-50%);object-fit:contain;border:1px solid #fff9;border-radius:16px;background:#1a1212aa;box-shadow:0 18px 45px #0009;animation:heroFade .9s ease both}
.side-photo{display:none!important}
.notice-stack{position:absolute;z-index:15;left:50%;bottom:5%;width:min(430px,42vw);transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;pointer-events:none}
.notice{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #fff8;border-radius:17px;background:var(--glass);box-shadow:0 10px 28px #0008;animation:noticeIn .55s ease both}
.notice.out{animation:noticeOut .7s ease both}
.avatar{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:50%;background:linear-gradient(135deg,#efb29a,#956477);border:1px solid #fff;font-weight:700}
.notice-copy{min-width:0;flex:1}
.notice-name{font-size:12px;opacity:.8}
.notice-line{font-size:clamp(12px,1.1vw,16px);line-height:1.35;word-break:break-word}
.notice img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.floating-layer{position:absolute;z-index:12;inset:0;pointer-events:none}
.float-msg{position:absolute;max-width:190px;padding:7px 9px;border:1px solid #fff9;border-radius:13px;background:#34232bd9;box-shadow:0 8px 20px #0008;animation:floatUp 6.5s ease both}
.float-msg .who{font-size:10px;opacity:.75}
.float-msg .words{font-size:clamp(11px,1vw,15px);font-weight:700;line-height:1.35;word-break:break-word}
.emoji{position:absolute;z-index:13;font-size:clamp(24px,3vw,44px);animation:emojiUp 4.5s ease both}
.reminder{position:absolute;z-index:14;left:50%;bottom:7%;transform:translateX(-50%);padding:10px 16px;border:1px solid #fff8;border-radius:14px;background:#34232be8;font-size:clamp(13px,1.2vw,18px);animation:remind 5s ease both;pointer-events:none}
@keyframes heroFade{from{opacity:0}to{opacity:1}}
@keyframes noticeIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes noticeOut{to{opacity:0;transform:translateY(-28px)}}
@keyframes floatUp{from{opacity:0;transform:translateY(20px) scale(.8)}15%{opacity:1}to{opacity:0;transform:translate3d(var(--dx),-24vh,0) scale(.9)}}
@keyframes emojiUp{from{opacity:0;transform:translateY(12px) scale(.7)}15%{opacity:1}to{opacity:0;transform:translateY(-25vh) scale(1.1)}}
@keyframes remind{from{opacity:0;transform:translate(-50%,15px)}20%,78%{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
@media(max-width:700px){
.qr{right:9px;top:9px;width:72px;padding:5px}
.qr img{width:58px;height:58px}.qr span{font-size:9px}
.brand{top:6%}.hero-photo{width:42vw;height:40vh}
.notice-stack{width:84vw;bottom:5%}.notice{padding:8px 10px}.notice img{width:40px;height:40px}
.float-msg{max-width:42vw}.reminder{max-width:82vw;text-align:center}
}
</style>
</head>
<body>
<main class="wall">
<div class="brand"><b>Yu-Ming &amp; Jia-Yu</b><span>OUR WEDDING DAY</span></div>

<a class="qr" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener">
<img src="https://quickchart.io/qr?size=180&amp;text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2Fupload.html" alt="QR Code">
<span>填寫祝福!</span>
</a>

<section class="photo-stage" id="photoStage">
<img class="hero-photo" id="heroPhoto" alt="婚紗照">
</section>

<section class="floating-layer" id="floating-photos"></section>
<section class="notice-stack" id="noticeStack"></section>
<section class="floating-layer" id="floatingLayer"></section>
</main>

<script>
const CONFIG={
  endpoint:"https://script.google.com/macros/s/AKfycbydMwxvks8TSSGfMHkJvOTiUwdNXKzCHKHJ5JxbnYu-CHi9hGSilWeHbMjC3KUijzit/exec",
  pollInterval:1000,
  maxNotices:4,
  maxFloats:8
};

const wall=document.querySelector(".wall");
const hero=document.getElementById("heroPhoto");
const stack=document.getElementById("noticeStack");
const floatLayer=document.getElementById("floatingLayer");

const state={
  items:[],
  known:new Set(),
  lastServerTime:0,
  initial:true,
  heroIndex:0,
  syncing:false
};

function getText(item){
  return String(item.text||item.message||"").trim();
}

function getPhotoUrl(item){
  if(item.url)return String(item.url);
  if(item.photoId)return "https://drive.google.com/thumbnail?id="+encodeURIComponent(item.photoId)+"&sz=w1200";
  return "";
}

function getKey(item){
  return String(item.sourceId||item.id||item.photoId||
    ((item.time||"")+"-"+(item.name||"")+"-"+getText(item)));
}

function normalize(item,index){
  const url=getPhotoUrl(item);
  return Object.assign({},item,{
    id:getKey(item)||("event-"+index),
    sourceId:getKey(item)||("event-"+index),
    kind:item.kind||item.type||(url?"upload":"blessing"),
    name:String(item.name||"親友"),
    text:getText(item),
    url:url
  });
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderHero(){
  const presets=state.items.filter(x=>x.kind==="preset"&&x.url);
  if(!presets.length)return;

  const p=presets[state.heroIndex%presets.length];
  const id=getKey(p);

  if(hero.dataset.id!==id){
    hero.dataset.id=id;
    hero.dataset.fallback="0";
    hero.style.animation="none";
    void hero.offsetWidth;
    hero.style.animation="heroFade .9s ease both";
    hero.src=p.url;
  }
}

hero.addEventListener("error",()=>{
  /*
   * Drive thumbnail 若暫時失敗，
   * 第二次嘗試 uc?export=view。
   */
  const id=hero.dataset.id;
  if(!id||hero.dataset.fallback==="1")return;

  const item=state.items.find(x=>getKey(x)===id);
  if(!item||!item.photoId)return;

  hero.dataset.fallback="1";
  hero.src=
    "https://drive.google.com/uc?export=view&id="+
    encodeURIComponent(item.photoId);
});

function addNotice(item){
  const message=getText(item);
  if(!message&&!item.url)return;

  if(message && /^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(message)){
    const e=document.createElement("div");
    e.className="emoji";
    e.textContent=message;
    e.style.left=(18+Math.random()*64)+"%";
    e.style.bottom=(18+Math.random()*22)+"%";
    wall.appendChild(e);
    e.addEventListener("animationend",()=>e.remove(),{once:true});
    return;
  }

  const el=document.createElement("article");
  el.className="notice";
  const hasPhoto=!!item.url;

  el.innerHTML=
    '<div class="avatar">'+escapeHtml(item.name.slice(0,1))+'</div>'+
    '<div class="notice-copy">'+
      '<div class="notice-name">'+escapeHtml(item.name)+'</div>'+
      '<div class="notice-line">'+
        (hasPhoto?"傳送了一張照片":"留下了一則祝福："+escapeHtml(message))+
      '</div>'+
    '</div>'+
    (hasPhoto?'<img src="'+escapeHtml(item.url)+'" alt="">':"");

  stack.appendChild(el);

  while(stack.children.length>CONFIG.maxNotices){
    const old=stack.firstElementChild;
    old.classList.add("out");
    old.addEventListener("animationend",()=>old.remove(),{once:true});
  }

  setTimeout(()=>{
    if(el.isConnected){
      el.classList.add("out");
      el.addEventListener("animationend",()=>el.remove(),{once:true});
    }
  },8500);
}

function addFloat(item){
  const message=getText(item);
  if(!message||message.length<2)return;

  const el=document.createElement("article");
  el.className="float-msg";
  el.style.left=(8+Math.random()*78)+"%";
  el.style.top=(20+Math.random()*52)+"%";
  el.style.setProperty("--dx",(Math.random()*12-6)+"vw");

  el.innerHTML=
    '<div class="who">'+escapeHtml(item.name)+'</div>'+
    '<div class="words">'+escapeHtml(message)+'</div>';

  floatLayer.appendChild(el);

  while(floatLayer.children.length>CONFIG.maxFloats){
    floatLayer.firstElementChild.remove();
  }

  el.addEventListener("animationend",()=>el.remove(),{once:true});
}

function process(items){
  if(!Array.isArray(items))return;

  const fresh=[];

  items.map(normalize).forEach(item=>{
    const id=getKey(item);
    if(state.known.has(id))return;

    state.known.add(id);
    state.items.push(item);
    fresh.push(item);
  });

  renderHero();

  if(!state.initial){
    fresh.forEach(item=>{
      if(item.kind==="preset")return;
      addNotice(item);
      if(item.text)addFloat(item);
    });
  }

  if(state.items.length>100){
    state.items=state.items.slice(-100);
  }

  state.initial=false;
}

function jsonpRequest(url, callbackName){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("JSONP timeout"));
    },15000);

    function cleanup(){
      clearTimeout(timeout);
      script.remove();
      try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
    }

    window[callbackName]=(data)=>{
      cleanup();
      resolve(data);
    };

    script.src=url;
    script.async=true;
    script.onerror=()=>{
      cleanup();
      reject(new Error("JSONP load failed"));
    };

    document.head.appendChild(script);
  });
}

async function initialSync(){
  if(state.syncing)return;
  state.syncing=true;

  const callback="weddingInitial_"+Date.now()+"_"+Math.floor(Math.random()*10000);

  try{
    const url=
      CONFIG.endpoint+
      "?mode=initial"+
      "&callback="+encodeURIComponent(callback)+
      "&t="+Date.now();

    const data=await jsonpRequest(url,callback);

    if(data&&data.ok&&Array.isArray(data.items)){
      process(data.items);
    }

    if(data&&data.serverTime){
      state.lastServerTime=Number(data.serverTime)-3000;
    }
  }catch(error){
    console.warn("初始資料載入失敗",error);
  }finally{
    state.syncing=false;
  }
}

async function poll(){
  if(state.syncing)return;

  state.syncing=true;

  const callback=
    "weddingPoll_"+Date.now()+"_"+Math.floor(Math.random()*10000);

  try{
    /*
     * 每次直接取得最新 30 筆。
     * 不使用 since 時間比對，避免 Sheet 時間格式造成漏資料。
     */
    const url=
      CONFIG.endpoint+
      "?mode=poll"+
      "&callback="+encodeURIComponent(callback)+
      "&t="+Date.now();

    const data=await jsonpRequest(url,callback);

    if(
      data &&
      data.ok &&
      Array.isArray(data.items)
    ){
      process(data.items);
    }

    if(data&&data.serverTime){
      state.lastServerTime=
        Number(data.serverTime);
    }
  }catch(error){
    console.warn("同步暫時失敗",error);
  }finally{
    state.syncing=false;
  }
}

async function start(){
  await initialSync();
  setInterval(poll,CONFIG.pollInterval);
}

start();

setInterval(()=>{
  const presets=state.items.filter(x=>x.kind==="preset"&&x.url);
  if(presets.length>1){
    state.heroIndex++;
    renderHero();
  }
},12000);

setInterval(()=>{
  if(document.querySelector(".reminder"))return;

  const hasBlessing=state.items.some(
    x=>x.kind!=="preset"&&getText(x)
  );

  if(!hasBlessing){
    const e=document.createElement("div");
    e.className="reminder";
    e.textContent="歡迎留下今天的回憶 ♡";
    wall.appendChild(e);
    e.addEventListener("animationend",()=>e.remove(),{once:true});
  }
},18000);
</script>
</body>
</html>
