<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ee;--ink:#5d493c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#211d1a;color:var(--cream);font-family:"Noto Serif TC",serif}body{display:grid;place-items:center;min-height:100svh}.wall{position:relative;width:100vw;height:100svh;overflow:hidden;background:#211d1a}.stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#67584b,#211d1a 78%)}.stage-grid{position:absolute;inset:0;overflow:hidden}.tile{position:absolute;overflow:hidden;border:3px solid transparent;border-radius:18px;background:linear-gradient(#f8efe4,#f8efe4) padding-box,linear-gradient(135deg,#b88963,#f7dfbf,#c89a72) border-box;box-shadow:0 16px 36px #4c322844, inset 0 0 0 1px #fff9;animation:float 7s ease-in-out infinite}.tile:before{content:"♡";position:absolute;z-index:2;right:9px;top:5px;color:#b88963;font:20px "Ma Shan Zheng",serif;text-shadow:0 1px #fff}.tile:after{content:"";position:absolute;inset:7px;border:1px solid #fff8;border-radius:11px;pointer-events:none}.tile img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;background:transparent}.tile:nth-child(1){left:3%;top:18%;width:30%;height:36%;animation-delay:0s}.tile:nth-child(2){left:35%;top:9%;width:30%;height:36%;animation-delay:1s}.tile:nth-child(3){left:67%;top:18%;width:30%;height:36%;animation-delay:2s}.tile:nth-child(4){left:17%;top:57%;width:30%;height:36%;animation-delay:3s}.tile:nth-child(5){left:53%;top:57%;width:30%;height:36%;animation-delay:4s}.veil{position:absolute;inset:0;background:linear-gradient(0deg,#16120f99,transparent 42%,#16120f22);pointer-events:none}.qr-card{position:absolute;z-index:4;left:16px;top:16px;width:78px;padding:6px;border-radius:12px;background:#fffaf0ee;box-shadow:0 8px 24px #0007;animation:qr 16s ease-in-out infinite}.qr-card img{display:block;width:66px;height:66px}.brand,.hint,.counter,.queue{display:none}.message{position:absolute;z-index:3;left:4%;bottom:6%;max-width:52%;padding:16px 22px;border-radius:14px;background:#fffaf0e8;color:var(--ink);box-shadow:0 10px 35px #0006;backdrop-filter:blur(8px)}.message small{display:block;color:#a67569;font-family:"Ma Shan Zheng",serif;font-size:18px}.message strong{display:block;margin-top:4px;font-family:"Ma Shan Zheng",serif;font-size:clamp(22px,3vw,42px);font-weight:400}.message em{display:block;margin-top:4px;color:#a58973;font-style:normal;font-size:13px}@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.015)}}@keyframes qr{0%,68%{opacity:0;transform:translateY(-8px)}75%,90%{opacity:.95;transform:translateY(0)}100%{opacity:0}}@media(max-width:700px){.tile{border-radius:11px;border-width:2px}.tile:before{font-size:15px;right:6px;top:3px}.tile:nth-child(1){left:2%;top:17%;width:47%;height:36%}.tile:nth-child(2){left:51%;top:10%;width:47%;height:36%}.tile:nth-child(3){left:2%;top:57%;width:47%;height:36%}.tile:nth-child(4){left:51%;top:50%;width:47%;height:36%}.tile:nth-child(5){left:26%;top:34%;width:48%;height:36%}.qr-card{left:8px;top:8px;width:60px;padding:4px}.qr-card img{width:52px;height:52px}.message{left:3%;bottom:3%;max-width:72%;padding:9px 12px}.message small{font-size:13px}.message strong{font-size:20px}.message em{font-size:10px}}
</style>
</head>
<body><main class="wall" aria-label="婚禮現場照片牆"><div class="stage"><div id="stageGrid" class="stage-grid"></div></div><div class="veil"></div><div id="message" class="message" hidden><small id="messageName"></small><strong id="messageText"></strong><em id="messageTime"></em></div><a class="qr-card" href="https://jiayuweng.github.io/invitation/" target="_blank" rel="noopener" aria-label="掃描上傳照片"><img src="https://quickchart.io/qr?size=180&text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2F" alt="QR Code"></a></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec';const grid=document.getElementById('stageGrid'),msg=document.getElementById('message'),nameEl=document.getElementById('messageName'),textEl=document.getElementById('messageText'),timeEl=document.getElementById('messageTime');let items=[],index=0;
function normalize(list){return list.filter(x=>x&&(x.url||x.photo||x.text||x.message)).map(x=>({...x,text:x.text||x.message||'',url:(x.url||x.photo||'').replace('/uc?export=view&id=','/thumbnail?id=')})).filter(x=>x.url||x.text)}
function render(){grid.innerHTML='';if(!items.length)return;const count=Math.min(5,items.length);for(let n=0;n<count;n++){const x=items[(index+n)%items.length],el=document.createElement('div');el.className='tile '+(x.kind==='upload'?'guest':'preset');if(x.url)el.innerHTML='<img src="'+x.url+'&sz=w1400" alt="'+(x.name||'婚禮照片')+'">';grid.appendChild(el)}const x=items[index%items.length];if(x.text){msg.hidden=false;nameEl.textContent=x.name||'親友';textEl.textContent=x.text;timeEl.textContent=x.kind==='upload'?'現場祝福':'祝福留言'}else msg.hidden=true}
async function load(){try{const r=await fetch(ENDPOINT,{cache:'no-store'});if(!r.ok)return;const p=await r.json();const list=Array.isArray(p)?p:(p.items||p.photos||p.data||[]);const next=normalize(list);if(next.length){items=next;render()}}catch(e){console.warn('feed unavailable',e)}}
render();load();setInterval(load,5000);setInterval(()=>{if(items.length>1){index=(index+1)%items.length;render()}},8000);
</script></body></html>
