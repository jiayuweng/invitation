<!doctype html>
<html lang="zh-Hant">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>

<style>

:root{
  --cream:#fff8ee;
  --ink:#fff;
  --glass:#2b2024d9;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#140e0e;
  color:var(--ink);
  font-family:
    "Noto Serif TC",
    "PingFang TC",
    serif;
}

.wall{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    #241c1c
    url("hero-forest.jpg")
    center/cover
    no-repeat;
}

/* 整體暗角 */

.wall:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 45%,
      transparent 32%,
      #08050666 100%
    ),
    linear-gradient(
      #0002,
      #0006
    );
}


/* =========================================================
   標題
========================================================= */

.brand{
  position:absolute;
  z-index:3;

  top:5%;
  left:50%;

  transform:translateX(-50%);

  text-align:center;
  white-space:nowrap;

  text-shadow:
    0 3px 18px #0009;
}

.brand b{
  display:block;

  font:
    clamp(30px,4.2vw,72px)
    /1
    "Brush Script MT",
    cursive;
}

.brand span{
  display:block;

  margin-top:8px;

  font-size:
    clamp(10px,1.2vw,18px);

  letter-spacing:.35em;
}


/* =========================================================
   QR Code
========================================================= */

.qr{
  position:absolute;

  z-index:20;

  right:22px;
  top:22px;

  width:108px;

  padding:
    8px 7px 6px;

  border-radius:14px;

  background:#fff;
  color:#49352d;

  text-align:center;

  text-decoration:none;

  box-shadow:
    0 8px 24px #0008;
}

.qr img{
  display:block;

  width:82px;

  margin:auto;
}

.qr span{
  display:block;

}


/* =========================================================
   照片區
========================================================= */

.photo-stage{
  position:absolute;

  inset:0;

  z-index:4;

  pointer-events:none;
}


/* 中央婚紗照 */

.hero-photo{
  position:absolute;

  left:50%;
  top:51%;

  width:min(27vw,310px);
  height:min(48vh,430px);

  transform:
    translate(-50%,-50%);

  object-fit:contain;

  border:
    1px solid #fff9;

  border-radius:16px;

  background:#1a1212aa;

  box-shadow:
    0 18px 45px #0009;

  animation:
    heroFade .9s ease both;
}


/* 周圍照片 */

.side-photo{
  position:absolute;

  width:
    clamp(128px,15vw,190px);

  height:
    clamp(150px,24vh,235px);

  padding:5px;

  object-fit:contain;

  border:
    1px solid #fff9;

  border-radius:14px;

  background:#fff2;

  box-shadow:
    0 12px 28px #0008;

  animation:
    cardIn
    .8s
    cubic-bezier(.2,.8,.25,1)
    both;
}

.side-photo.out{
  animation:
    cardOut
    .7s
    ease
    both;
}


/* =========================================================
   左下通知
========================================================= */

.notice-stack{
  position:absolute;

  z-index:15;

  left:50%;
  bottom:5%;

  width:min(430px,42vw);

  transform:

  gap:7px;

  pointer-events:none;
}

.notice{
  display:flex;

  align-items:center;

  gap:9px;

  padding:
    10px 12px;

  border:

  background:
    var(--glass);

  box-shadow:
    0 10px 28px #0008;

  animation:
    noticeIn
    .55s
    ease
    both;
}

.notice.out{
  animation:
    noticeOut
    .7s
    ease
    both;
}

.avatar{

  height:31px;

  display:grid;
  place-items:center;

  flex:none;

  background:
    linear-gradient(

    );

    1px solid #fff;

  font-weight:700;
}

.notice-copy{

  flex:1;
}

.notice-name{
  font-size:12px;

.notice-line{

.notice img{

}


/* =========================================================

========================================================= */

.floating-layer{

.float-msg{

    1px solid #fff9;

    #34232bd9;

.float-msg .words{

    break-word;

/* =========================================================
   Emoji
========================================================= */

.emoji{
  position:absolute;

  z-index:13;

  font-size:
    clamp(24px,3vw,44px);

  animation:
    emojiUp
    4.5s
    ease
    both;
}


/* =========================================================
   提示
========================================================= */

.reminder{
  position:absolute;

  z-index:14;

  left:50%;
  bottom:7%;

  transform:
    translateX(-50%);

  padding:
    10px 16px;

  border:
    1px solid #fff8;

  border-radius:14px;

  background:
    #34232be8;

  font-size:
    clamp(13px,1.2vw,18px);

    remind

    ease

  pointer-events:none;
}


/* =========================================================
   動畫
========================================================= */

@keyframes cardIn{

  from{
    opacity:0;

    transform:
      translateY(30px)
      scale(.7)
      rotate(-8deg);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1)
      rotate(var(--r));
  }

}

@keyframes cardOut{

  to{
    opacity:0;

    transform:
      translateY(-20vh)
      scale(.7)
      rotate(8deg);
  }

}

@keyframes heroFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

@keyframes noticeIn{

  from{
    opacity:0;

    transform:
      translateY(30px);
  }

  to{
    opacity:1;

    transform:none;
  }

}

@keyframes noticeOut{

  to{
    opacity:0;

    transform:
      translateY(-28px);
  }

}

@keyframes floatUp{

  from{
    opacity:0;

    transform:
      translateY(20px)
      scale(.8);
  }

  15%{
    opacity:1;
  }

  to{
    opacity:0;

    transform:
      translate3d(
        var(--dx),

  }

}

@keyframes emojiUp{

  from{
    opacity:0;

    transform:

  }

  15%{
    opacity:1;
  }

  to{
    opacity:0;

@keyframes remind{

}


/* =========================================================
   手機
========================================================= */

@media(max-width:700px){

  .qr{

    right:9px;

  }

  .notice img{

  }

  .float-msg{

  }

  .reminder{

    max-width:82vw;

  }

}


/*
 * 保留目前照片牆的設定：
 * 周圍照片不顯示，只顯示中央婚紗照
 */

.side-photo{
  display:none !important;
}

</style>

</head>


<body>

<main class="wall">


  <!-- =====================================================
       標題
  ====================================================== -->

  <div class="brand">

    <b>
      Yu-Ming &amp; Jia-Yu
    </b>

    <span>
      OUR WEDDING DAY
    </span>

  </div>


  <!-- =====================================================
       QR Code
  ====================================================== -->

  <a
    class="qr"
    href="https://jiayuweng.github.io/invitation/upload.html"
    target="_blank"
    rel="noopener"
  >

    <img
      src="https://quickchart.io/qr?size=180&amp;text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2Fupload.html"
      alt="QR Code"
    >

    <span>
      填寫祝福!
    </span>

  </a>


  <!-- =====================================================
       中央照片
  ====================================================== -->

  <section
    class="photo-stage"
    id="photoStage"
  >

    <img
      class="hero-photo"
      id="heroPhoto"
      alt="婚紗照"
    >

  </section>


  <!-- =====================================================
       浮動照片
  ====================================================== -->

  <section
    class="floating-layer"
    id="floating-photos"
  ></section>


  <!-- =====================================================
       左下通知
  ====================================================== -->

  <section
    class="notice-stack"
    id="noticeStack"
  ></section>


  <!-- =====================================================
       浮動祝福
  ====================================================== -->

  <section
    class="floating-layer"
    id="floatingLayer"
  ></section>


</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

  /*
   * 你的新版 Google Apps Script Web App
   */

  endpoint:
    'https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec',


  /*
   * 畫面最多顯示的照片數量
   */

  maxPhotos:6,


  /*
   * 左下最多幾則通知
   */

  maxNotices:4,


  /*
   * 同時最多幾個浮動祝福
   */

  maxFloats:8,


  /*
   * 每 1 秒檢查一次
   */

  pollInterval:1000

};


/* =========================================================
   DOM
========================================================= */

const wall =
  document.querySelector(
    '.wall'
  );


const stage =
  document.getElementById(
    'photoStage'
  );


const hero =
  document.getElementById(
    'heroPhoto'
  );


const stack =
  document.getElementById(
    'noticeStack'
  );


const floatLayer =
  document.getElementById(
    'floatingLayer'
  );


/* =========================================================
   State
========================================================= */

const state = {

  /*
   * 已知資料
   */

  items:[],


  /*
   * 避免重複顯示
   */

  known:new Set(),


  /*
   * 上次伺服器時間
   */

  lastServerTime:0,


  /*
   * 第一次載入
   */

  initial:true,


  /*
   * 中央婚紗照輪播 index
   */

  heroIndex:0,


  /*
   * 避免同時請求
   */

  syncing:false

};


/* =========================================================
   文字
========================================================= */

function getText(item){

  return String(
    item.text ||
    item.message ||
    ''
  ).trim();

}


/* =========================================================
   圖片 URL
========================================================= */

function getPhotoUrl(item){

  if(
    item.url
  ){

    return String(
      item.url
    );

  }


  if(
    item.photoId
  ){

    return (
      'https://drive.google.com/thumbnail?id=' +
      item.photoId +
      '&sz=w1200'
    );

  }


  return '';

}


/* =========================================================
   唯一 ID
========================================================= */

function getKey(item){

  return String(

    item.sourceId ||

    item.id ||

    item.photoId ||

    (
      String(
        item.time || ''
      ) +
      '-' +
      String(
        item.name || ''
      ) +
      '-' +
      getText(item)
    )

  );

}


/* =========================================================
   Normalize
========================================================= */

function normalize(
  item,
  index
){

  const url =
    getPhotoUrl(item);


  const kind =
    item.kind ||
    item.type ||
    (
      url
        ? 'upload'
        : 'blessing'
    );


  return Object.assign(
    {},
    item,
    {

      id:
        getKey(item) ||
        'event-' + index,

      sourceId:
        getKey(item) ||
        'event-' + index,

      kind,

      name:
        String(
          item.name ||
          '親友'
        ),

      text:
        getText(item),

      url

    }
  );

}


/* =========================================================
   隨機照片位置
========================================================= */

function positions(){

  const p=[

    ['7%','24%'],

    ['25%','17%'],

    ['70%','22%'],

    ['8%','64%'],

    ['70%','64%'],

    ['39%','72%']

  ];


  return p.sort(
    () =>
      Math.random() - 0.5
  );

}


/* =========================================================
   Render Photos
========================================================= */

function renderPhotos(){

  const photos =
    state.items.filter(
      item =>
        item.url
    );


  /*
   * 賓客照片
   */

  const side =
    photos
      .filter(
        item =>
          item.kind !==
          'preset'
      )
      .slice(
        -CONFIG.maxPhotos
      );


  const pos =
    positions();


  /*
   * 找出畫面上的照片
   */

  const existing =
    new Map(

      [
        ...stage.querySelectorAll(
          '.side-photo'
        )
      ]

      .map(
        el =>
          [
            el.dataset.id,
            el
          ]
      )

    );


  const keep =
    new Set(
      side.map(
        getKey
      )
    );


  /*
   * 移除已經不需要的照片
   */

  existing.forEach(
    (
      el,
      id
    ) => {

      if(
        !keep.has(id)
      ){

        el.classList.add(
          'out'
        );


        el.addEventListener(
          'animationend',
          () =>
            el.remove(),
          {
            once:true
          }
        );

      }

    }
  );


  /*
   * 加入新的照片
   */

  side.forEach(
    (
      item,
      i
    ) => {

      const id =
        getKey(item);


      if(
        existing.has(id)
      ){

        return;

      }


      const el =
        document.createElement(
          'img'
        );


      el.className =
        'side-photo';


      el.dataset.id =
        id;


      el.src =
        item.url;


      el.alt =
        item.name +
        '的照片';


      el.style.left =
        pos[i][0];


      el.style.top =
        pos[i][1];


      el.style.setProperty(
        '--r',
        (
          Math.random() *
          8 -
          4
        ).toFixed(1) +
        'deg'
      );


      stage.appendChild(
        el
      );

    }
  );


  /*
   * 中央婚紗照
   */

  const presets =
    photos.filter(
      item =>
        item.kind ===
        'preset'
    );


  if(
    presets.length
  ){

    const p =
      presets[
        state.heroIndex %
        presets.length
      ];


    if(
      hero.dataset.id !==
      getKey(p)
    ){

      hero.dataset.id =
        getKey(p);


      hero.src =
        p.url;

    }

  }

}


/* =========================================================
   新通知
========================================================= */

function addNotice(
  item
){

  if(
    !getText(item) &&
    !item.url
  ){

    return;

  }


  /*
   * Emoji-only
   */

  if(

    getText(item) &&

    /^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u
      .test(
        getText(item)
      )

  ){

    const e =
      document.createElement(
        'div'
      );


    e.className =
      'emoji';


    e.textContent =
      getText(item);


    e.style.left =
      (
        18 +
        Math.random() * 64
      ) +
      '%';


    e.style.bottom =
      (
        18 +
        Math.random() * 22
      ) +
      '%';


    wall.appendChild(
      e
    );


    e.addEventListener(
      'animationend',
      () =>
        e.remove(),
      {
        once:true
      }
    );


    return;

  }


  const el =
    document.createElement(
      'article'
    );


  el.className =
    'notice';


  const hasPhoto =
    !!item.url;


  el.innerHTML =

    '<div class="avatar">' +

      escapeHtml(
        item.name.slice(0,1)
      ) +

    '</div>' +

    '<div class="notice-copy">' +

      '<div class="notice-name">' +

        escapeHtml(
          item.name
        ) +

      '</div>' +

      '<div class="notice-line">' +

        (
          hasPhoto

            ? '傳送了一張照片'

            :

              '留下了一則祝福：' +
              escapeHtml(
                getText(item)
              )

        ) +

      '</div>' +

    '</div>' +

    (

      hasPhoto

        ?

          '<img src="' +
          item.url +
          '" alt="">'

        :

          ''

    );


  stack.appendChild(
    el
  );


  /*
   * 不要超過最大數量
   */

  while(
    stack.children.length >
    CONFIG.maxNotices
  ){

    const old =
      stack.firstElementChild;


    old.classList.add(
      'out'
    );


    old.addEventListener(
      'animationend',
      () =>
        old.remove(),
      {
        once:true
      }
    );

  }


  /*
   * 8.5 秒後消失
   */

  setTimeout(
    () => {

      if(
        el.isConnected
      ){

        el.classList.add(
          'out'
        );


        el.addEventListener(
          'animationend',
          () =>
            el.remove(),
          {
            once:true
          }
        );

      }

    },
    8500
  );

}


/* =========================================================
   浮動祝福
========================================================= */

function addFloat(
  item
){

  const message =
    getText(item);


  if(
    !message ||
    message.length < 2
  ){

    return;

  }


  const el =
    document.createElement(
      'article'
    );


  el.className =
    'float-msg';


  el.style.left =
    (
      8 +
      Math.random() * 78
    ) +
    '%';


  el.style.top =
    (
      20 +
      Math.random() * 52
    ) +
    '%';


  el.style.setProperty(
    '--dx',
    (
      Math.random() * 12 -
      6
    ) +
    'vw'
  );


  el.innerHTML =

    '<div class="who">' +

      escapeHtml(
        item.name
      ) +

    '</div>' +

    '<div class="words">' +

      escapeHtml(
        message
      ) +

    '</div>';


  floatLayer.appendChild(
    el
  );


  while(
    floatLayer.children.length >
    CONFIG.maxFloats
  ){

    floatLayer
      .firstElementChild
      .remove();

  }


  el.addEventListener(
    'animationend',
    () =>
      el.remove(),
    {
      once:true
    }
  );

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(
  value
){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================================================
   處理收到的資料
========================================================= */

function process(
  items
){

  if(
    !Array.isArray(items)
  ){

    return;

  }


  const fresh=[];


  items
    .map(normalize)
    .forEach(
      item => {

        const id =
          getKey(item);


        /*
         * 已經看過
         */

        if(
          state.known.has(id)
        ){

          return;

        }


        /*
         * 記錄
         */

        state.known.add(
          id
        );


        state.items.push(
          item
        );


        fresh.push(
          item
        );

      }
    );


  /*
   * 更新中央婚紗照
   */

  renderPhotos();


  /*
   * 第一次載入：
   *
   * 不要把舊資料全部跳通知
   */

  if(
    !state.initial
  ){

    fresh.forEach(
      item => {

        /*
         * 預設婚紗照不用通知
         */

        if(
          item.kind ===
          'preset'
        ){

          return;

        }


        /*
         * 左下通知
         */

        addNotice(
          item
        );


        /*
         * 如果是祝福文字
         */

        if(
          item.text
        ){

          addFloat(
            item
          );

        }

      }
    );

  }


  /*
   * 防止記憶體無限增加
   */

  if(
    state.items.length >
    100
  ){

    state.items =
      state.items.slice(
        -100
      );

  }


  state.initial =
    false;

}


/* =========================================================
   第一次同步
========================================================= */

async function initialSync(){

  if(
    state.syncing
  ){

    return;

  }


  state.syncing =
    true;


  try{

    const url =
      CONFIG.endpoint +
      '?mode=initial&t=' +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            'no-store'
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      data.ok &&
      Array.isArray(
        data.items
      )
    ){

      process(
        data.items
      );

    }


    /*
     * 記住伺服器時間
     */

    if(
      data.serverTime
    ){

      state.lastServerTime =
        Number(
          data.serverTime
        );

    }


  }
  catch(error){

    console.warn(
      '初始資料載入失敗',
      error
    );

  }
  finally{

    state.syncing =
      false;

  }

}


/* =========================================================
   Poll
   每秒只抓新增資料
========================================================= */

async function poll(){

  if(
    state.syncing
  ){

    return;

  }


  /*
   * 第一次還沒完成
   */

  if(
    !state.lastServerTime
  ){

    return;

  }


  state.syncing =
    true;


  try{

    const url =

      CONFIG.endpoint +

      '?mode=poll' +

      '&since=' +

      encodeURIComponent(
        state.lastServerTime
      ) +

      '&t=' +

      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:
            'no-store'
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const data =
      await response.json();


    /*
     * 有新資料
     */

    if(
      data.ok &&
      Array.isArray(
        data.items
      )
    ){

      if(
        data.items.length
      ){

        process(
          data.items
        );

      }

    }


    /*
     * 更新時間
     */

    if(
      data.serverTime
    ){

      state.lastServerTime =
        Math.max(
          state.lastServerTime,
          Number(
            data.serverTime
          )
        );

    }


  }
  catch(error){

    console.warn(
      '同步暫時失敗',
      error
    );

  }
  finally{

    state.syncing =
      false;

  }

}


/* =========================================================
   啟動
========================================================= */

async function start(){

  /*
   * 先載入初始資料
   */

  await initialSync();


  /*
   * 之後每秒檢查
   */

  setInterval(
    poll,
    CONFIG.pollInterval
  );

}


start();

   中央婚紗照輪播

      );

    ){

setInterval(

      )
