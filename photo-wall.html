<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<style>
:root{
  --cream:#fff3df;
  --cream2:#f8dfbf;
  --glass:rgba(42,31,27,.62);
  --glass2:rgba(255,248,236,.18);
  --line:rgba(255,245,225,.5);
  --shadow:0 18px 42px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#17110d;color:#fff;
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
}
.wall{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:#211710 url("assets/hero-forest.jpg") center/cover no-repeat;
}
.wall:before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    linear-gradient(90deg,rgba(11,7,4,.28),rgba(11,7,4,.06) 50%,rgba(11,7,4,.25)),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.34));
}
.wall:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,transparent 28%,rgba(0,0,0,.22) 100%);
}

/* ---------- QR ---------- */
.qr{
  position:absolute;z-index:30;right:2.2vw;top:3.2vh;
  width:112px;padding:9px 8px 10px;border-radius:15px;
  background:rgba(255,255,255,.96);color:#4a382e;
  text-align:center;text-decoration:none;
  box-shadow:0 12px 30px rgba(0,0,0,.32);
}
.qr img{display:block;width:92px;height:92px;margin:auto}
.qr span{display:block;margin-top:5px;font-size:12px;font-weight:700;line-height:1.3}

/* ---------- center live feed ---------- */
.live-feed{
  position:absolute;z-index:14;left:50%;top:57%;
  transform:translateX(-50%);
  width:min(570px,42vw);
  max-height:45vh;
  display:flex;flex-direction:column;gap:7px;
  overflow:hidden;pointer-events:none;
  mask-image:linear-gradient(to bottom,transparent 0,black 8%,black 88%,transparent 100%);
}
.live-card{
  display:flex;align-items:center;gap:13px;
  min-height:76px;padding:10px 16px 10px 14px;
  border:1px solid rgba(255,244,223,.45);
  border-radius:25px;
  background:linear-gradient(90deg,rgba(245,237,223,.66),rgba(82,66,59,.58));
  box-shadow:0 10px 26px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.15);
  backdrop-filter:blur(12px);
  color:#fffaf0;
  animation:cardIn .7s cubic-bezier(.2,.75,.25,1) both;
}
.live-card.fade{
  opacity:.4;
}
.live-card.leaving{
  animation:cardOutUp .95s ease forwards;
  pointer-events:none;
}
.avatar{
  width:48px;height:48px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#e9c5a9,#956a63);
  border:2px solid rgba(255,255,255,.78);
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.22);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar span{font-size:21px;font-weight:700}
.live-copy{min-width:0;flex:1;text-align:left}
.live-name{font-size:clamp(13px,1.05vw,18px);font-weight:700;opacity:.92}
.live-text{
  margin-top:3px;font-size:clamp(14px,1.25vw,20px);
  line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.live-time{
  align-self:flex-start;padding-top:5px;white-space:nowrap;
  font-size:13px;color:rgba(255,250,240,.72)
}
.live-thumb{
  width:62px;height:62px;object-fit:cover;border-radius:11px;flex:none;
  border:1px solid rgba(255,255,255,.55);
}

/* ---------- floating layer ---------- */
.floating-layer{
  position:absolute;z-index:10;inset:0;pointer-events:none;
}
.polaroid{
  position:absolute;width:150px;padding:10px 10px 27px;
  background:#f8f1e4;
  border-radius:3px;
  box-shadow:0 18px 34px rgba(0,0,0,.38);
  transform:rotate(var(--rot));
  animation:polaroidIn .8s ease both;
}
.polaroid.preset-slide{
  animation:polaroidIn .8s ease both;
}
.polaroid.preset-slide.leaving{
  animation:polaroidOutUp .9s ease forwards;
  pointer-events:none;
}
.polaroid.guest-photo{
  animation:guestPhotoIn .7s cubic-bezier(.2,.75,.25,1) both;
}
.polaroid.guest-photo.leaving{
  animation:polaroidOutUp .9s ease forwards;
  pointer-events:none;
}
.polaroid img{
  display:block;width:100%;aspect-ratio:1/1.08;object-fit:cover;
  background:#ddd;
}
.polaroid .heart{
  position:absolute;right:7px;bottom:5px;
  color:#f39aa0;font-size:22px;text-shadow:0 2px 4px rgba(0,0,0,.15)
}

/* ---------- floating blessing bubbles ---------- */
.float-msg{
  position:absolute;max-width:205px;min-width:120px;
  padding:11px 16px;border-radius:25px;
  background:rgba(48,39,36,.68);
  border:1px solid rgba(255,246,231,.28);
  box-shadow:0 12px 26px rgba(0,0,0,.26);
  backdrop-filter:blur(8px);
  animation:bubbleIn .65s ease both;
}
.float-msg .who{
  font-size:12px;opacity:.72;margin-bottom:3px;
}
.float-msg .words{
  font-size:clamp(14px,1.05vw,18px);
  line-height:1.4;font-weight:600;word-break:break-word;
}
.float-msg.leaving{
  animation:bubbleOutUp .95s ease forwards;
  pointer-events:none;
}

/* ---------- decorative emojis / petals ---------- */
.emoji{
  position:absolute;z-index:13;
  font-size:clamp(25px,3vw,50px);
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.25));
  animation:emojiFloat 5s ease both;
}
.petal{
  position:absolute;width:22px;height:11px;
  border-radius:100% 0 100% 0;
  background:rgba(255,207,194,.75);
  transform:rotate(var(--rot));
  animation:petalFall var(--dur) linear infinite;
}

/* ---------- animations ---------- */
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes cardOutUp{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(-55px) scale(.98)}
}
@keyframes polaroidIn{
  from{opacity:0;transform:translateY(25px) scale(.9) rotate(var(--rot))}
  to{opacity:1;transform:rotate(var(--rot))}
}
@keyframes polaroidOutUp{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(var(--rot))}
  100%{opacity:0;transform:translate3d(var(--float-x,0px),-28vh,0) scale(.92) rotate(var(--rot))}
}
@keyframes guestPhotoIn{
  from{opacity:0;transform:translate3d(0,35px,0) scale(.82) rotate(var(--rot))}
  to{opacity:1;transform:translate3d(0,0,0) scale(var(--scale,1)) rotate(var(--rot))}
}
@keyframes bubbleIn{
  from{opacity:0;transform:translateY(35px) scale(.88)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes bubbleOutUp{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  100%{opacity:0;transform:translate3d(var(--float-x,0px),-30vh,0) scale(.94)}
}
@keyframes emojiFloat{
  0%{opacity:0;transform:translate3d(0,18px,0) scale(.75)}
  15%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--float-x,0px),-30vh,0) scale(1.08)}
}
@keyframes petalFall{
  0%{transform:translate3d(0,-8vh,0) rotate(var(--rot));opacity:0}
  12%{opacity:.8}
  100%{transform:translate3d(var(--dx),110vh,0) rotate(calc(var(--rot) + 240deg));opacity:0}
}
@keyframes remind{
  from{opacity:0;transform:translate(-50%,15px)}
  20%,78%{opacity:1;transform:translate(-50%,0)}
  to{opacity:0;transform:translate(-50%,-10px)}
}

@media(max-width:900px){
  .live-feed{top:50%;width:88vw;max-height:40vh}
  .live-card{min-height:62px;padding:7px 10px;border-radius:19px}
  .avatar{width:39px;height:39px}
  .live-thumb{width:49px;height:49px}
  .live-text{font-size:14px}
  .live-time{display:none}
  .polaroid{width:100px;padding:7px 7px 20px}
  .float-msg{max-width:145px;padding:8px 11px}
  .float-msg .words{font-size:12px}
  .bottom-copy,  .qr{width:77px;right:9px;top:9px;padding:5px}
  .qr img{width:64px;height:64px}
  .qr span{font-size:9px}
}
@media(max-width:520px){
  .live-feed{top:42%;max-height:48vh}
  .live-card{min-height:57px}
  .live-name{font-size:11px}
  .live-text{font-size:13px}
  .live-thumb{width:43px;height:43px}
  .polaroid:nth-child(n+3){display:none}
  }

/* ---------- live stability ---------- */
.live-card.queued{
  opacity:0;
  transform:translateY(20px) scale(.97);
}
.connection-dot{
  position:absolute;z-index:40;left:14px;top:14px;
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.25);
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
  opacity:.45;transition:opacity .3s,background .3s;
}
.connection-dot.online{background:#cde8c8;opacity:.55}
.connection-dot.offline{background:#e7b2a8;opacity:.8}
</style>
</head>
<body>
<main class="wall">
  <i class="connection-dot" id="connectionDot" aria-hidden="true"></i>
</div>

  <a class="qr" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener">
    <img src="https://quickchart.io/qr?size=220&amp;text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2Fupload.html" alt="QR Code">
    <span>掃碼上傳照片<br>留下祝福</span>
  </a>
<div class="cn small">讓這一天更美好 ♡</div>
  </div>

  <section class="live-feed" id="liveFeed"></section>
  <section class="floating-layer" id="polaroidLayer"></section>
  <section class="floating-layer" id="floatingLayer"></section>
</main>

<script>
const CONFIG={
  endpoint:"https://script.google.com/macros/s/AKfycbydMwxvks8TSSGfMHkJvOTiUwdNXKzCHKHJ5JxbnYu-CHi9hGSilWeHbMjC3KUijzit/exec",
  pollInterval:1000,
  maxCards:5,
  maxPolaroids:6,
  maxBubbles:7,

  // 多人同時上傳時，一筆一筆播放，避免全部疊在一起
  queueInterval:2200,

  // 長時間播放時，只保留最近的事件記錄
  maxKnown:500,

  // JSONP 失敗時逐步放慢，恢復後立即回到 1 秒
  minPollInterval:1000,
  maxPollInterval:15000,

  // 婚紗照輪播
  presetSlideInterval:5000,
  presetFadeDuration:900,

  // 新訊息 / 新照片顯示時間
  messageDisplayTime:6000,
  guestPhotoDisplayTime:12000
};

const wall=document.querySelector(".wall");
const feed=document.getElementById("liveFeed");
const polaroidLayer=document.getElementById("polaroidLayer");
const floatLayer=document.getElementById("floatingLayer");

const state={
  items:[],
  known:new Set(),
  initial:true,
  syncing:false,

  // 新資料佇列
  displayQueue:[],

  // 避免長時間運作時 Set 無限增長
  knownOrder:[],

  // 網路 / polling 狀態
  online:navigator.onLine!==false,
  pollTimer:null,
  pollDelay:CONFIG.minPollInterval
};

function textOf(item){
  return String(item.text||item.message||"").trim();
}
function photoUrl(item){
  if(item.url)return String(item.url);
  if(item.photoId)
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(item.photoId)+"&sz=w1200";
  return "";
}
function keyOf(item){
  return String(item.sourceId||item.id||item.photoId||
    ((item.time||"")+"-"+(item.name||"")+"-"+textOf(item)));
}
function normalize(item,i){
  return Object.assign({},item,{
    id:keyOf(item)||("event-"+i),
    sourceId:keyOf(item)||("event-"+i),
    kind:item.kind||item.type||(photoUrl(item)?"upload":"blessing"),
    name:String(item.name||"親友"),
    text:textOf(item),
    url:photoUrl(item),
    time:Number(item.time||Date.now())
  });
}
function esc(v){
  return String(v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function timeText(t){
  const sec=Math.max(0,Math.floor((Date.now()-Number(t))/1000));
  if(sec<10)return "現在";
  if(sec<60)return sec+" 秒前";
  const min=Math.floor(sec/60);
  if(min<60)return min+" 分鐘前";
  return Math.floor(min/60)+" 小時前";
}

function addCard(item){
  const message=textOf(item);
  if(!message && !item.url)return;

  const el=document.createElement("article");
  el.className="live-card queued";
  el.dataset.itemId=keyOf(item);

  const avatar=item.avatar||item.avatarUrl||"";

  el.innerHTML=
    '<div class="avatar">'+
    (avatar
      ? '<img src="'+esc(avatar)+'" alt="">'
      : '<span>'+esc(item.name.slice(0,1))+'</span>')+
    '</div>'+
    '<div class="live-copy">'+
      '<div class="live-name">'+esc(item.name)+'</div>'+
      '<div class="live-text">'+
        (item.url
          ? (message?esc(message):"傳送了一張照片")
          : esc(message))+
      '</div>'+
    '</div>'+
    '<div class="live-time">'+timeText(item.time)+'</div>'+
    (item.url
      ? '<img class="live-thumb" src="'+esc(item.url)+'" alt="">'
      : "");

  feed.appendChild(el);

  // 圖片載入失敗時，嘗試另一個 Drive URL
  if(item.url && item.photoId){
    const thumb=el.querySelector(".live-thumb");
    if(thumb){
      thumb.addEventListener("error",()=>{
        if(thumb.dataset.fallback==="1")return;
        thumb.dataset.fallback="1";
        thumb.src=
          "https://drive.google.com/uc?export=view&id="+
          encodeURIComponent(item.photoId);
      });
    }
  }

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.classList.remove("queued");
    });
  });

  while(feed.children.length>CONFIG.maxCards){
    feed.firstElementChild.remove();
  }

  // 6 秒後「往上淡出」，動畫結束後真正移除 DOM
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.messageDisplayTime);
}

function addPolaroid(item){
  if(!item.url)return;

  const el=document.createElement("div");
  el.className="polaroid guest-photo";

  /*
   * 每次隨機選擇左右區域，再在區域內隨機位置。
   * 中央主視覺保留給新人與祝福，不讓賓客照片蓋住中心。
   */
  const side=Math.random()<0.5 ? "left" : "right";

  let left, top;

  if(side==="left"){
    left=(3+Math.random()*22);
    top=(10+Math.random()*68);
  }else{
    left=(75+Math.random()*21);
    top=(10+Math.random()*68);
  }

  const rot=(-10+Math.random()*20);
  const scale=(0.88+Math.random()*0.22);

  el.style.left=left+"%";
  el.style.top=top+"%";
  el.style.setProperty("--rot",rot+"deg");
  el.style.setProperty("--float-x",((-35+Math.random()*70))+"px");
  el.style.setProperty("--scale",scale);

  /*
   * 避免太靠近 QR Code。
   */
  if(top<20 && side==="right"){
    el.style.top=(22+Math.random()*52)+"%";
  }

  el.innerHTML=
    '<img src="'+esc(item.url)+'" alt="">'+
    '<span class="heart">♡</span>';

  polaroidLayer.appendChild(el);

  /*
   * 上傳照片最多保留 6 張。
   * 新照片會取代最舊的一張。
   */
  const guests=polaroidLayer.querySelectorAll(".guest-photo");

  if(guests.length>CONFIG.maxPolaroids){
    const old=guests[0];
    if(old)old.remove();
  }

  /*
   * 12 秒後：往上飄 + 淡出。
   */
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.guestPhotoDisplayTime);
}
function addBubble(item){
  const message=textOf(item);
  if(!message||message.length<2)return;

  /*
   * 純 Emoji 維持原本像氣泡一樣從下往上飄。
   */
  if(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(message)){
    const e=document.createElement("div");
    e.className="emoji";

    e.style.left=(10+Math.random()*78)+"%";
    e.style.bottom=(-5+Math.random()*18)+"%";

    e.style.setProperty(
      "--float-x",
      (-60+Math.random()*120)+"px"
    );

    wall.appendChild(e);
    e.textContent=message;

    e.addEventListener(
      "animationend",
      ()=>e.remove(),
      {once:true}
    );

    return;
  }

  const el=document.createElement("article");
  el.className="float-msg";

  /*
   * 文字從畫面下方不同位置出現。
   * 刻意避開最中央標題區，讓視覺比較舒服。
   */
  const side=Math.random();

  let left;
  if(side<0.5){
    left=5+Math.random()*27;
  }else{
    left=68+Math.random()*25;
  }

  const bottom=3+Math.random()*25;

  el.style.left=left+"%";
  el.style.bottom=bottom+"%";

  el.style.setProperty(
    "--float-x",
    (-50+Math.random()*100)+"px"
  );

  el.innerHTML=
    '<div class="who">'+esc(item.name)+'</div>'+
    '<div class="words">'+esc(message)+'</div>';

  floatLayer.appendChild(el);

  while(floatLayer.querySelectorAll(".float-msg").length>CONFIG.maxBubbles){
    const old=floatLayer.querySelector(".float-msg");
    if(old)old.remove();
    else break;
  }

  /*
   * 6 秒後從目前位置一路往上飄並淡出。
   */
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.messageDisplayTime);
}
/* =========================================================
   婚紗照輪播
   - 多張婚紗照固定在四周
   - 每 5 秒淡出
   - 往上飄出
   - 換下一張後淡入
========================================================= */

const presetPositions=[
  {left:"3%",top:"31%",rot:"-8deg"},
  {left:"19%",top:"6%",rot:"8deg"},
  {right:"19%",top:"18%",rot:"-7deg"},
  {right:"3%",top:"38%",rot:"8deg"},
  {right:"16%",bottom:"8%",rot:"-6deg"},
  {left:"8%",bottom:"7%",rot:"6deg"}
];

const presetShowcase={
  items:[],
  slots:[],
  timer:null
};

function setupPresetSlideshow(presets){
  presetShowcase.items=Array.isArray(presets)
    ? presets.filter(x=>x.url)
    : [];

  if(!presetShowcase.items.length)return;

  presetShowcase.slots=[];

  const count=Math.min(
    CONFIG.maxPolaroids,
    presetShowcase.items.length
  );

  for(let i=0;i<count;i++){
    const slot={
      index:i,
      itemIndex:i%presetShowcase.items.length,
      el:null
    };

    const el=document.createElement("div");
    el.className="polaroid preset-slide";

    const pos=presetPositions[
      i%presetPositions.length
    ];

    Object.entries(pos).forEach(([k,v])=>{
      el.style.setProperty(k,v);
    });
    el.style.setProperty("--rot",pos.rot);

    polaroidLayer.appendChild(el);

    slot.el=el;
    presetShowcase.slots.push(slot);

    renderPresetSlot(slot,false);
  }

  if(presetShowcase.timer){
    clearInterval(presetShowcase.timer);
  }

  presetShowcase.timer=setInterval(
    rotateOnePreset,
    CONFIG.presetSlideInterval
  );
}

function renderPresetSlot(slot,animate){
  const item=
    presetShowcase.items[
      slot.itemIndex%presetShowcase.items.length
    ];

  const el=slot.el;
  if(!el||!item)return;

  const pos=presetPositions[
    slot.index%presetPositions.length
  ];

  el.style.setProperty("--rot",pos.rot);

  el.innerHTML=
    '<img src="'+esc(item.url)+'" alt="">'+
    '<span class="heart">♡</span>';

  el.dataset.itemId=keyOf(item);
  el.classList.remove("leaving");

  if(!animate)return;

  el.style.animation="none";
  void el.offsetWidth;
  el.style.animation="polaroidIn .8s ease both";
}

function rotateOnePreset(){
  if(!presetShowcase.items.length)return;

  // 每次只換一張，畫面會一直有照片，不會全部同時消失
  const slot=
    presetShowcase.slots[
      rotateOnePreset.counter%
      presetShowcase.slots.length
    ];

  rotateOnePreset.counter++;

  if(!slot||!slot.el)return;

  const el=slot.el;

  el.classList.remove("leaving");
  el.style.animation="none";
  void el.offsetWidth;
  el.classList.add("leaving");

  setTimeout(()=>{
    slot.itemIndex=
      (slot.itemIndex+1)%
      presetShowcase.items.length;

    renderPresetSlot(slot,true);
  },CONFIG.presetFadeDuration);
}

rotateOnePreset.counter=0;

function rememberKey(id){
  if(state.known.has(id))return false;

  state.known.add(id);
  state.knownOrder.push(id);

  // 長時間播放：限制 known Set 大小
  while(state.knownOrder.length>CONFIG.maxKnown){
    const old=state.knownOrder.shift();
    state.known.delete(old);
  }

  return true;
}

function queueNewItem(item){
  state.displayQueue.push(item);
}

function showNextQueued(){
  if(!state.displayQueue.length)return;

  const item=state.displayQueue.shift();

  addCard(item);

  if(item.url){
    addPolaroid(item);
  }

  if(item.text){
    addBubble(item);
  }
}

function process(items){
  if(!Array.isArray(items))return;

  const fresh=[];

  items.map(normalize).forEach(item=>{
    const id=keyOf(item);

    if(!rememberKey(id))return;

    state.items.push(item);
    fresh.push(item);
  });

  /*
   * 初次載入：
   * - 婚紗照交給「輪播器」
   * - 歷史祝福不當成新訊息播放
   */
  if(state.initial){
    setupPresetSlideshow(
      fresh.filter(x=>x.kind==="preset")
    );
  }else{
    // 後續新資料進佇列，一筆一筆播
    fresh
      .filter(x=>x.kind!=="preset")
      .forEach(queueNewItem);
  }

  // 限制前端資料量，避免婚禮長時間播放後記憶體持續增加
  if(state.items.length>180){
    state.items=state.items.slice(-180);
  }

  state.initial=false;
}

function jsonpRequest(url,callbackName){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    let finished=false;

    const timeout=setTimeout(()=>{
      finish(new Error("JSONP timeout"));
    },CONFIG.maxPollInterval);

    function cleanup(){
      clearTimeout(timeout);
      script.onload=null;
      script.onerror=null;
      if(script.parentNode)script.parentNode.removeChild(script);

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName]=undefined;
      }
    }

    function finish(error,data){
      if(finished)return;
      finished=true;
      cleanup();

      if(error)reject(error);
      else resolve(data);
    }

    window[callbackName]=(data)=>{
      finish(null,data);
    };

    script.src=url;
    script.async=true;

    script.onerror=()=>{
      finish(new Error("JSONP load failed"));
    };

    document.head.appendChild(script);
  });
}

async function initialSync(){
  if(state.syncing)return;
  if(!navigator.onLine){
    state.online=false;
    updateConnectionDot();
    return;
  }

  state.syncing=true;

  const cb=
    "weddingInitial_"+
    Date.now()+"_"+
    Math.floor(Math.random()*10000);

  try{
    const url=
      CONFIG.endpoint+
      "?mode=initial"+
      "&callback="+encodeURIComponent(cb)+
      "&t="+Date.now();

    const data=await jsonpRequest(url,cb);

    if(data&&data.ok&&Array.isArray(data.items)){
      process(data.items);
      state.online=true;
      state.pollDelay=CONFIG.minPollInterval;
    }else{
      throw new Error(
        data&&data.error
          ? data.error
          : "Invalid initial response"
      );
    }
  }catch(err){
    state.online=navigator.onLine!==false;
    console.warn("初始資料載入失敗",err);
  }finally{
    state.syncing=false;
    updateConnectionDot();
  }
}

async function poll(){
  if(state.syncing)return;

  if(!navigator.onLine){
    state.online=false;
    updateConnectionDot();
    schedulePoll();
    return;
  }

  state.syncing=true;

  const cb=
    "weddingPoll_"+
    Date.now()+"_"+
    Math.floor(Math.random()*10000);

  try{
    const url=
      CONFIG.endpoint+
      "?mode=poll"+
      "&callback="+encodeURIComponent(cb)+
      "&t="+Date.now();

    const data=await jsonpRequest(url,cb);

    if(data&&data.ok&&Array.isArray(data.items)){
      process(data.items);

      // 成功後恢復 1 秒更新
      state.online=true;
      state.pollDelay=CONFIG.minPollInterval;
    }else{
      throw new Error(
        data&&data.error
          ? data.error
          : "Invalid poll response"
      );
    }
  }catch(err){
    state.online=navigator.onLine!==false;
    state.pollDelay=Math.min(
      Math.max(
        state.pollDelay*2,
        CONFIG.minPollInterval
      ),
      CONFIG.maxPollInterval
    );

    console.warn(
      "同步暫時失敗，將於 "+
      Math.round(state.pollDelay/1000)+
      " 秒後重試",
      err
    );
  }finally{
    state.syncing=false;
    updateConnectionDot();
    schedulePoll();
  }
}

function schedulePoll(){
  if(state.pollTimer){
    clearTimeout(state.pollTimer);
  }

  state.pollTimer=setTimeout(
    poll,
    state.pollDelay
  );
}

function updateConnectionDot(){
  const dot=document.getElementById("connectionDot");
  if(!dot)return;

  dot.classList.toggle(
    "online",
    state.online && navigator.onLine!==false
  );

  dot.classList.toggle(
    "offline",
    !state.online || navigator.onLine===false
  );
}

/*
 * 網路恢復時不要等下一個 polling，
 * 直接重新同步。
 */
window.addEventListener("online",()=>{
  state.online=true;
  state.pollDelay=CONFIG.minPollInterval;
  updateConnectionDot();

  if(state.pollTimer){
    clearTimeout(state.pollTimer);
    state.pollTimer=null;
  }

  poll();
});

window.addEventListener("offline",()=>{
  state.online=false;
  updateConnectionDot();

  if(state.pollTimer){
    clearTimeout(state.pollTimer);
    state.pollTimer=null;
  }
});

/*
 * Chrome 分頁被切到背景再回來時立即補抓一次。
 * 婚禮現場長時間播放比較不容易漏資料。
 */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    state.pollDelay=CONFIG.minPollInterval;

    if(!state.syncing){
      if(state.pollTimer){
        clearTimeout(state.pollTimer);
        state.pollTimer=null;
      }
      poll();
    }
  }
});

function createPetals(){
  for(let i=0;i<12;i++){
    const p=document.createElement("i");
    p.className="petal";
    p.style.left=(Math.random()*100)+"%";
    p.style.setProperty("--dx",(Math.random()*26-13)+"vw");
    p.style.setProperty("--rot",(Math.random()*180)+"deg");
    p.style.setProperty("--dur",(7+Math.random()*8)+"s");
    p.style.animationDelay=(-Math.random()*12)+"s";
    wall.appendChild(p);
  }
}

createPetals();

updateConnectionDot();
initialSync();

/*
 * 每 2.2 秒播放一筆新資料。
 * 如果沒有人上傳，佇列就是空的，不會產生任何額外畫面。
 */
setInterval(showNextQueued,CONFIG.queueInterval);

/*
 * Poll 使用 setTimeout + adaptive backoff。
 * 正常狀態每秒一次；斷線 / Apps Script 暫時失敗會自動放慢，
 * 恢復後重新回到每秒。
 */
schedulePoll();

/*
 * 時間文字直接從卡片自己的 data-item-id 找資料，
 * 不依賴 children index，避免卡片淘汰後對錯資料。
 */
setInterval(()=>{
  document.querySelectorAll(".live-time").forEach(el=>{
    const card=el.closest(".live-card");
    if(!card)return;

    const id=card.dataset.itemId;
    const item=state.items.find(
      x=>keyOf(x)===id
    );

    if(item){
      el.textContent=timeText(item.time);
    }
  });
},10000);
</script>
