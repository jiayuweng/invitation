<meta charset="utf-8">

<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<style>
:root{
  --cream:#fff3df;
  --cream2:#f8dfbf;
  --paper:#f8edd5;
  --paper2:#efe0bd;
  --ink:#5b4532;
  --olive:#7b8758;
  --rose:#d9978b;
  --gold:#b8945b;
  --shadow:0 14px 30px rgba(56,37,21,.24);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#17110d;color:#fff;
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
}
.wall{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:#211710 url("assets/hero-forest.jpg") center/cover no-repeat;
}
.wall:before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    linear-gradient(90deg,rgba(11,7,4,.20),rgba(11,7,4,.035) 50%,rgba(11,7,4,.18)),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.27));
}
.wall:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,transparent 31%,rgba(0,0,0,.18) 100%);
}

/* ---------- QR：日系手繪紙卡 ---------- */
.qr{
  position:absolute;
  z-index:30;
  right:2.2vw;
  top:3.2vh;
  width:118px;
  padding:13px 10px 12px;
  color:#5b4532;
  text-align:center;
  text-decoration:none;
  background:
    radial-gradient(circle at 15% 12%,rgba(255,255,255,.65),transparent 22%),
    linear-gradient(180deg,rgba(255,249,231,.98),rgba(242,221,184,.97));
  border:1px solid rgba(126,92,52,.48);
  border-radius:3px 7px 5px 4px;
  clip-path:polygon(1% 3%,97% 0,100% 18%,98% 38%,100% 58%,97% 80%,99% 98%,78% 96%,58% 99%,38% 97%,18% 100%,2% 96%,3% 76%,0 56%,3% 37%,1% 18%);
  box-shadow:0 12px 24px rgba(55,35,17,.22),inset 0 0 0 1px rgba(255,255,255,.5);
  transform:rotate(1.2deg);
}
.qr::before{
  content:"";
  position:absolute;
  inset:-7px -6px -8px -7px;
  z-index:-1;
  border:1.5px solid rgba(247,226,187,.95);
  border-radius:7px 5px 8px 5px;
  transform:rotate(-1.5deg);
  box-shadow:0 0 0 1px rgba(105,73,39,.15);
  pointer-events:none;
}
.qr::after{
  content:"✿";
  position:absolute;
  right:-13px;
  bottom:-12px;
  width:31px;height:31px;
  display:grid;place-items:center;
  color:#fff3d3;font-size:17px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#df9c91 0 15%,transparent 17%),
    radial-gradient(circle at 50% 18%,#fff3d3 0 25%,transparent 27%),
    radial-gradient(circle at 82% 50%,#fff3d3 0 25%,transparent 27%),
    radial-gradient(circle at 50% 82%,#fff3d3 0 25%,transparent 27%),
    radial-gradient(circle at 18% 50%,#fff3d3 0 25%,transparent 27%);
  box-shadow:0 2px 5px rgba(54,31,14,.2);
  pointer-events:none;
}
.qr img{
  display:block;
  width:92px;height:92px;
  margin:auto;
  padding:4px;
  background:#fffdf7;
  border:1px solid rgba(126,88,48,.28);
  border-radius:2px;
}
.qr span{
  display:block;
  margin-top:7px;
  font-size:12px;
  font-weight:700;
  line-height:1.3;
  letter-spacing:.02em;
}
/* ---------- 中央訊息：手繪婚禮紙卡 ---------- */
.live-feed{
  position:absolute;
  z-index:14;
  left:50%;
  top:68%;
  transform:translateX(-50%);
  width:min(520px,38vw);
  max-height:24vh;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
  pointer-events:none;
  mask-image:linear-gradient(to bottom,transparent 0,black 10%,black 90%,transparent 100%);
}
.live-card{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:48px;
  padding:7px 14px 7px 9px;
  color:#fffaf2;
  background:rgba(55,40,31,.34);
  border:1px solid rgba(255,248,232,.24);
  border-radius:18px;
  box-shadow:0 6px 18px rgba(20,12,8,.16);
  backdrop-filter:blur(5px) saturate(110%);
  -webkit-backdrop-filter:blur(5px) saturate(110%);
  animation:cardIn .7s cubic-bezier(.2,.75,.25,1) both;
}
.live-card::before{
  content:"";
  position:absolute;
  left:-5px;
  top:17px;
  width:9px;
  height:9px;
  background:rgba(55,40,31,.34);
  border-left:1px solid rgba(255,248,232,.20);
  border-bottom:1px solid rgba(255,248,232,.20);
  transform:rotate(45deg);
  border-radius:2px 0 0 0;
}
.live-card::after{
  content:"♡";
  position:absolute;
  right:9px;
  bottom:5px;
  font-size:13px;
  color:rgba(255,235,220,.62);
  font-weight:400;
}
.live-card .live-thumb{
  width:36px;
  height:36px;
  flex:0 0 36px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid rgba(255,248,232,.36);
  box-shadow:0 3px 10px rgba(20,10,5,.16);
}
.live-card .avatar{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(232,176,145,.72);
  border:1px solid rgba(255,248,236,.62);
  color:#fffaf4;
  font-size:16px;
  box-shadow:0 3px 10px rgba(30,15,8,.14);
}
.live-card .live-name{
  color:rgba(255,248,236,.92);
  font-size:13px;
  font-weight:600;
  letter-spacing:.2px;
}
.live-card .live-text{
  color:rgba(255,250,242,.96);
  font-size:15px;
  line-height:1.45;
  text-shadow:0 1px 3px rgba(0,0,0,.24);
}
.live-card .live-time{
  color:rgba(255,244,229,.62);
  font-size:10px;
  margin-left:auto;
  white-space:nowrap;
}
.live-card::before{
  content:"";
  position:absolute;
  left:-4px;
  bottom:13px;
  width:18px;height:18px;
  background:#f1debc;
  border-left:1px solid rgba(130,94,51,.42);
  border-bottom:1px solid rgba(130,94,51,.42);
  transform:rotate(45deg);
  z-index:-1;
}
.live-card::after{
  content:"♡";
  position:absolute;
  right:15px;
  bottom:8px;
  color:#d78982;
  font-size:20px;
  line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.live-card .live-thumb{
  width:48px;height:48px;
  object-fit:cover;
  border-radius:4px;
  flex:none;
  border:2px solid rgba(255,252,238,.9);
  box-shadow:0 3px 8px rgba(66,42,21,.16);
}
.avatar{
  width:45px;height:45px;
  border-radius:50%;
  flex:none;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#e9b7a8,#c98f7d);
  border:2px solid #fff6df;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(70,40,20,.15);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar span{font-size:20px;font-weight:700;color:#fffdf2}
.live-copy{min-width:0;flex:1;text-align:left}
.live-name{
  color:#7a5b3b;
  font-size:clamp(12px,1vw,16px);
  font-weight:700;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
.live-text{
  margin-top:2px;
  color:#5a4330;
  font-size:clamp(13px,1.1vw,18px);
  line-height:1.32;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:700;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.live-time{
  align-self:flex-start;
  padding-top:3px;
  white-space:nowrap;
  font-size:11px;
  color:#8a6b48;
  text-shadow:0 1px 0 rgba(255,255,255,.65);
}
.live-thumb{
  width:58px;height:58px;
  object-fit:cover;
  border-radius:4px;
  flex:none;
  border:2px solid #fff8e5;
  box-shadow:0 2px 6px rgba(57,34,16,.15);
}

/* ---------- floating layer ---------- */
.floating-layer{
  position:absolute;z-index:10;inset:0;pointer-events:none;
}
  .polaroid{
  position:absolute;
  width:150px;
  padding:10px 10px 14px;
  background:
    linear-gradient(180deg,rgba(255,251,235,.97),rgba(244,226,193,.95));
  border:1px solid rgba(126,88,47,.46);
  border-radius:4px 7px 5px 6px;
  clip-path:polygon(1% 2%,97% 0,100% 16%,98% 34%,100% 54%,98% 76%,100% 98%,80% 96%,60% 99%,40% 97%,19% 100%,2% 96%,3% 77%,0 57%,2% 37%,1% 18%);
  box-shadow:0 12px 24px rgba(46,27,13,.22),inset 0 0 0 1px rgba(255,255,255,.5);
  transform:rotate(var(--rot));
  animation:polaroidIn .8s ease both;
  isolation:isolate;
}
.polaroid::before{
  content:"";
  position:absolute;
  inset:-8px;
  z-index:2;
  pointer-events:none;
  border:1.5px solid rgba(248,224,179,.94);
  border-radius:7px 4px 8px 5px;
  box-shadow:0 0 0 1px rgba(105,73,39,.16);
  transform:rotate(-.8deg);
}
.polaroid::after{
  content:"✿";
  position:absolute;
  right:-15px;
  bottom:-14px;
  z-index:5;
  width:34px;height:34px;
  display:grid;place-items:center;
  color:#fff3d1;font-size:18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#e3a39a 0 15%,transparent 17%),
    radial-gradient(circle at 50% 17%,#fff4d4 0 25%,transparent 27%),
    radial-gradient(circle at 83% 50%,#fff4d4 0 25%,transparent 27%),
    radial-gradient(circle at 50% 83%,#fff4d4 0 25%,transparent 27%),
    radial-gradient(circle at 17% 50%,#fff4d4 0 25%,transparent 27%);
  box-shadow:0 2px 5px rgba(50,28,12,.2);
  transform:rotate(-8deg);
}
.polaroid img{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  aspect-ratio:1/1.08;
  object-fit:cover;
  background:#ead8b8;
  border:1px solid rgba(132,96,58,.25);
}
.polaroid .heart{
  position:absolute;
  left:-10px;
  top:-15px;
  z-index:5;
  color:#f7ddb0;
  font-size:22px;
  line-height:1;
  text-shadow:0 1px 0 #765538,0 2px 4px rgba(45,25,10,.25);
  transform:rotate(-12deg);
}
.polaroid.landscape{width:210px}
.polaroid.landscape img{aspect-ratio:3/2}
.polaroid.square{width:165px}

/* ---------- floating blessing bubbles ---------- */
  .float-msg{
  position:absolute;
  max-width:235px;
  min-width:130px;
  padding:11px 18px 12px;
  color:#60442c;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.7),transparent 25%),
    linear-gradient(180deg,rgba(255,248,226,.97),rgba(246,225,185,.95));
  border:1px solid rgba(126,87,46,.43);
  border-radius:5px 10px 6px 8px;
  box-shadow:0 9px 18px rgba(47,28,14,.18),inset 0 0 0 1px rgba(255,255,255,.42);
  clip-path:polygon(
    1% 8%,12% 3%,25% 5%,38% 2%,52% 5%,66% 2%,81% 5%,98% 8%,
    96% 23%,99% 40%,96% 57%,99% 75%,96% 94%,
    82% 92%,67% 97%,53% 94%,39% 98%,24% 94%,8% 97%,2% 90%,
    4% 72%,2% 55%,5% 38%,2% 20%
  );
  animation:bubbleIn .65s ease both;
  isolation:isolate;
}
.float-msg::before{
  content:"";
  position:absolute;
  inset:-4px;
  z-index:-1;
  border:1px solid rgba(255,235,196,.75);
  clip-path:polygon(1% 8%,14% 3%,28% 6%,42% 2%,57% 5%,72% 2%,98% 8%,96% 25%,99% 43%,96% 61%,98% 91%,82% 95%,65% 92%,50% 97%,35% 94%,19% 97%,3% 91%,5% 72%,2% 54%,5% 34%,2% 18%);
  transform:rotate(-.7deg);
}
.float-msg::after{
  content:"❧";
  position:absolute;
  right:8px;bottom:-8px;
  color:#7d8c52;font-size:22px;line-height:1;
  transform:rotate(-8deg);
  text-shadow:0 1px 2px rgba(50,30,14,.20);
}
.float-msg .who{
  color:#795a3c;font-size:11px;font-weight:700;opacity:.92;margin-bottom:2px;
}
.float-msg .words{
  color:#60432c;font-size:clamp(13px,1vw,17px);
  line-height:1.36;font-weight:700;word-break:break-word;
}
.float-msg.leaving{animation:bubbleOutUp .95s ease forwards;pointer-events:none;}

/* ---------- decorative emojis / petals ---------- */
.emoji{
  position:absolute;z-index:13;
  font-size:clamp(25px,3vw,50px);
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.25));
  animation:emojiFloat 5s ease both;
}
.petal{
  position:absolute;width:22px;height:11px;
  border-radius:100% 0 100% 0;
  background:rgba(255,207,194,.75);
  transform:rotate(var(--rot));
  animation:petalFall var(--dur) linear infinite;
}

/* ---------- animations ---------- */
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes cardOutUp{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(-55px) scale(.98)}
}
@keyframes polaroidIn{
  from{
    opacity:0;
    transform:translate3d(0,25px,0) scale(.82) rotate(var(--rot))
  }
  to{
    opacity:1;
    transform:translate3d(0,0,0) scale(var(--scale,1)) rotate(var(--rot))
  }
}
@keyframes polaroidOutUp{
  0%{
    opacity:1;
    transform:translate3d(0,0,0) scale(var(--scale,1)) rotate(var(--rot))
  }
  100%{
    opacity:0;
    transform:translate3d(var(--float-x,0px),-28vh,0) scale(.90) rotate(var(--rot))
  }
}
@keyframes guestPhotoIn{
  from{opacity:0;transform:translate3d(0,35px,0) scale(.82) rotate(var(--rot))}
  to{opacity:1;transform:translate3d(0,0,0) scale(var(--scale,1)) rotate(var(--rot))}
}
@keyframes bubbleIn{
  from{opacity:0;transform:translateY(35px) scale(.88)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes bubbleOutUp{
  0%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  100%{opacity:0;transform:translate3d(var(--float-x,0px),-30vh,0) scale(.94)}
}
@keyframes emojiFloat{
  0%{opacity:0;transform:translate3d(0,18px,0) scale(.75)}
  15%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--float-x,0px),-30vh,0) scale(1.08)}
}
@keyframes petalFall{
  0%{transform:translate3d(0,-8vh,0) rotate(var(--rot));opacity:0}
  12%{opacity:.8}
  100%{transform:translate3d(var(--dx),110vh,0) rotate(calc(var(--rot) + 240deg));opacity:0}
}
@keyframes remind{
  from{opacity:0;transform:translate(-50%,15px)}
  20%,78%{opacity:1;transform:translate(-50%,0)}
  to{opacity:0;transform:translate(-50%,-10px)}
}

@media(max-width:900px){

  .avatar{width:39px;height:39px}
  .live-thumb{width:49px;height:49px}
  .live-text{font-size:14px}
  .live-time{display:none}
  .polaroid{width:100px;padding:7px 7px 20px}
  .polaroid.landscape{width:135px}
  .polaroid.square{width:112px}
  .float-msg{max-width:150px;padding:8px 11px}
  .float-msg .words{font-size:12px}
  .bottom-copy,  .qr{width:77px;right:9px;top:9px;padding:6px 5px 7px}

}
@media(max-width:520px){
  .live-feed{top:42%;max-height:48vh}

  .live-text{font-size:13px}
  .live-thumb{width:43px;height:43px}
  .polaroid:nth-child(n+3){display:none}
  }

/* ---------- live stability ---------- */
.live-card.queued{
  opacity:0;
  transform:translateY(20px) scale(.97);
}
.connection-dot{
  position:absolute;z-index:40;left:14px;top:14px;
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.25);
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
  opacity:.45;transition:opacity .3s,background .3s;

.connection-dot.online{background:#cde8c8;opacity:.55}

<body>
<main class="wall">
  <i class="connection-dot" id="connectionDot" aria-hidden="true"></i>
</div>

  <a class="qr" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener">
    <img src="https://quickchart.io/qr?size=220&amp;text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2Fupload.html" alt="QR Code">
    <span>留下祝福</span>
  </a>
  </div>

  <section class="live-feed" id="liveFeed"></section>
  <section class="floating-layer" id="polaroidLayer"></section>
  <section class="floating-layer" id="floatingLayer"></section>
</main>

<script>
const CONFIG={
  endpoint:"https://script.google.com/macros/s/AKfycbyJ5XKfxOjKgQ_8phL-8pIxrMmrYe6rwmBtrcVUbD6DCTOCd8is5x5CZI0vyxJX5y4/exec",
  pollInterval:3000,
  maxCards:12,
  maxPolaroids:6,
  guestPhotoNormalMax:6,
  guestPhotoBurstMax:10,
  photoBurstThreshold:3,
  photoBurstHoldTime:5000,
  minPresetPhotos:3,
  maxBubbles:20,

  // 純文字仍保留佇列，但快速顯示，讓大量祝福可以同時存在
  queueInterval:700,

  // 長時間播放時，只保留最近的事件記錄
  maxKnown:500,

  // JSONP 失敗時逐步放慢，恢復後立即回到 1 秒
  minPollInterval:3000,
  maxPollInterval:30000,
  maxConsecutiveFailures:2,
  failurePause:60000,
  // Apps Script 初次啟動 / 冷啟動可能需要較久，JSONP 不要沿用 15 秒 polling 間隔
  jsonpTimeout:45000,

  // 婚紗照輪播
  presetSlideInterval:5000,
  presetFadeDuration:900,

  // 新訊息 / 新照片顯示時間
  messageDisplayTime:6000,
  guestPhotoDisplayTime:12000
};

const wall=document.querySelector(".wall");
const feed=document.getElementById("liveFeed");
const polaroidLayer=document.getElementById("polaroidLayer");
const floatLayer=document.getElementById("floatingLayer");

const state={
  items:[],
  known:new Set(),
  pollInitialized:false,
  syncing:false,

  // 新資料佇列
  displayQueue:[],

  // 避免長時間運作時 Set 無限增長
  knownOrder:[],

  // 第一次 poll 只建立時間水位，不播放舊資料。
  // 後續只接受比這個時間更新的資料。
  watermarkTime:0,

  // 網路 / polling 狀態
  online:navigator.onLine!==false,
  pollTimer:null,
  pollDelay:CONFIG.minPollInterval,
  consecutiveFailures:0,
  pausedUntil:0,

  // 照片大量進入時的暫時擴容狀態
  recentPhotoTimes:[],
  photoBurst:false,
  photoBurstTimer:null
};

function textOf(item){
  return String(item.text||item.message||"").trim();
}
function photoUrl(item){
  if(item.url)return String(item.url);
  if(item.photoId)
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(item.photoId)+"&sz=w1200";
  return "";
}
function keyOf(item){
  return String(item.sourceId||item.id||item.photoId||
    ((item.time||"")+"-"+(item.name||"")+"-"+textOf(item)));
}
function normalize(item,i){
  const name=String(item.name||"親友");
  const text=textOf(item);
  let url=photoUrl(item);

  // 純文字事件不補任何圖片；只有實際有 url/photoId 的資料才顯示照片。

  const normalized=Object.assign({},item,{
    id:keyOf(item)||("event-"+i),
    sourceId:keyOf(item)||("event-"+i),
    kind:item.kind||item.type||(url?"upload":"blessing"),
    name:name,
    text:text,
    url:url,
    time:Number(item.time||Date.now())
  });

  return normalized;
}
function esc(v){
  return String(v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function timeText(t){
  const sec=Math.max(0,Math.floor((Date.now()-Number(t))/1000));
  if(sec<10)return "現在";
  if(sec<60)return sec+" 秒前";
  const min=Math.floor(sec/60);
  if(min<60)return min+" 分鐘前";
  return Math.floor(min/60)+" 小時前";
}

const CENTRAL_MESSAGE_MAX=5;

function trimCentralMessages(){
  const feed=document.getElementById('live-feed');
  if(!feed) return;
  const cards=Array.from(feed.querySelectorAll('.live-card'));
  while(cards.length>CENTRAL_MESSAGE_MAX){
    const old=cards.shift();
    if(old) old.remove();
  }
}

function addCard(item){
  const message=textOf(item);
  if(!message && !item.url)return;

  const el=document.createElement("article");
  el.className="live-card queued";
  el.dataset.itemId=keyOf(item);

  const avatar=item.avatar||item.avatarUrl||"";

  el.innerHTML=
    '<div class="avatar">'+
    (avatar
      ? '<img src="'+esc(avatar)+'" alt="">'
      : '<span>'+esc(item.name.slice(0,1))+'</span>')+
    '</div>'+
    '<div class="live-copy">'+
      '<div class="live-name">'+esc(item.name)+'</div>'+
      '<div class="live-text">'+
        (item.url
          ? (message
              ? '傳了圖片：'+esc(message)
              : '傳了一張圖片')
          : esc(message))+
      '</div>'+
    '</div>'+
    '<div class="live-time">'+timeText(item.time)+'</div>'+
    (item.url
      ? '<img class="live-thumb" src="'+esc(item.url)+'" alt="">'
      : "");

  feed.appendChild(el);

  // 圖片載入失敗時，嘗試另一個 Drive URL
  if(item.url && item.photoId){
    const thumb=el.querySelector(".live-thumb");
    if(thumb){
      thumb.addEventListener("error",()=>{
        if(thumb.dataset.fallback==="1")return;
        thumb.dataset.fallback="1";
        thumb.src=
          "https://drive.google.com/uc?export=view&id="+
          encodeURIComponent(item.photoId);
      });
    }
  }

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.classList.remove("queued");
    });
  });

  while(feed.children.length>CONFIG.maxCards){
    feed.firstElementChild.remove();
  }

  // 6 秒後「往上淡出」，動畫結束後真正移除 DOM
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.messageDisplayTime);
  trimCentralMessages();
}

function applyPhotoOrientation(el,img){
  if(!el || !img)return;

  const apply=()=>{
    const w=img.naturalWidth || 0;
    const h=img.naturalHeight || 0;
    if(!w || !h)return;

    el.classList.remove("landscape","square");

    if(w / h > 1.15){
      el.classList.add("landscape");
    }else if(Math.abs(w / h - 1) < 0.15){
      el.classList.add("square");
    }
  };

  if(img.complete) apply();
  else img.addEventListener("load",apply,{once:true});
}

function addPolaroid(item){
  if(!item.url)return;

  const el=document.createElement("div");
  el.className="polaroid guest-photo";

  /*
   * 上傳照片也使用避讓演算法，避免跟婚紗照疊在一起。
   * 暫時先加入 DOM，計算位置後再顯示。
   */
  polaroidLayer.appendChild(el);

  const pos=randomPresetPosition();

  el.style.left=pos.left;
  el.style.top=pos.top;
  el.style.setProperty("--rot",pos.rot);
  el.style.setProperty("--float-x",((-35+Math.random()*70))+"px");
  el.style.setProperty("--scale",pos.scale);

  el.innerHTML=
    '<img src="'+esc(item.url)+'" alt="">'+
    '<span class="heart">♡</span>';

  applyPhotoOrientation(el,el.querySelector("img"));

  /*
   * 賓客照片平常最多 6 張。
   * 短時間真的湧入多張時，暫時放寬到 10 張，
   * 讓最新照片可以直接出現。
   */
  const guestMax=state.photoBurst
    ? CONFIG.guestPhotoBurstMax
    : CONFIG.guestPhotoNormalMax;

  const guests=Array.from(
    polaroidLayer.querySelectorAll(".guest-photo")
  );

  while(guests.length>=guestMax){
    const old=guests.shift();
    if(old)old.remove();
  }

  /*
   * 如果第一個圖片網址載入失敗，再嘗試 Drive 常見圖片網址。
   */
  const img=el.querySelector("img");
  if(img){
    let tried=0;
    const fallbacks=[];

    if(item.photoId){
      fallbacks.push(
        "https://drive.google.com/thumbnail?id="+
        encodeURIComponent(item.photoId)+"&sz=w1200"
      );
      fallbacks.push(
        "https://drive.google.com/uc?export=view&id="+
        encodeURIComponent(item.photoId)
      );
    }

    img.addEventListener("error",()=>{
      if(tried>=fallbacks.length)return;
      img.src=fallbacks[tried++];
    });
  }

  /*
   * 12 秒後：往上飄 + 淡出。
   */
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.guestPhotoDisplayTime);
}
function addBubble(item){
  const message=textOf(item);
  if(!message||message.length<2)return;

  /*
   * 純 Emoji 維持原本像氣泡一樣從下往上飄。
   */
  if(/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+$/u.test(message)){
    const e=document.createElement("div");
    e.className="emoji";

    e.style.left=(10+Math.random()*78)+"%";
    e.style.bottom=(-5+Math.random()*18)+"%";

    e.style.setProperty(
      "--float-x",
      (-60+Math.random()*120)+"px"
    );

    wall.appendChild(e);
    e.textContent=message;

    e.addEventListener(
      "animationend",
      ()=>e.remove(),
      {once:true}
    );

    return;
  }

  const el=document.createElement("article");
  el.className="float-msg";

  /*
   * 祝福文字可以出現在整個畫面的各個位置，
   * 不再限制只能左下 / 右下。
   * 避免太靠邊，讓手機、大螢幕都比較容易看見。
   */
  const left=4+Math.random()*88;
  const bottom=5+Math.random()*78;

  el.style.left=left+"%";
  el.style.bottom=bottom+"%";

  el.style.setProperty(
    "--float-x",
    (-50+Math.random()*100)+"px"
  );

  el.innerHTML=
    '<div class="who">'+esc(item.name)+'</div>'+
    '<div class="words">'+esc(message)+'</div>';

  floatLayer.appendChild(el);

  while(floatLayer.querySelectorAll(".float-msg").length>CONFIG.maxBubbles){
    const old=floatLayer.querySelector(".float-msg");
    if(old)old.remove();
    else break;
  }

  /*
   * 6 秒後從目前位置一路往上飄並淡出。
   */
  setTimeout(()=>{
    if(!el.isConnected)return;

    el.classList.add("leaving");

    setTimeout(()=>{
      if(el.isConnected)el.remove();
    },950);
  },CONFIG.messageDisplayTime);
}
/* =========================================================
   婚紗照輪播
   - 多張婚紗照固定在四周
   - 每 5 秒淡出
   - 往上飄出
   - 換下一張後淡入
========================================================= */

const presetShowcase={
  items:[],
  active:[],
  timer:null,
  nextIndex:0,
  shownHistory:[],
  historyLimit:0
};

/*
 * 婚紗照位置：
 * 每次出現都重新隨機，不固定六個格子。
 * 中央保留給新人主視覺，照片主要分布在四周。
 */
function randomPresetPosition(){
  /*
   * 不再只靠「隨機」：
   * 每次會產生多個候選位置，檢查是否與畫面上其他照片太接近。
   * 找到不重疊的位置才使用。
   *
   * 座標使用百分比，所以手機 / 平板 / 大螢幕都會跟著縮放。
   */
  const zones=[
    {left:3,  top:8,  width:19, height:22},
    {left:22, top:5,  width:17, height:23},
    {left:3,  top:34, width:19, height:24},
    {left:22, top:67, width:17, height:22},

    {left:77, top:7,  width:19, height:22},
    {left:72, top:33, width:19, height:24},
    {left:79, top:62, width:18, height:23},
    {left:60, top:68, width:17, height:21}
  ];

  /*
   * Polaroid 大約佔畫面 14~18% 寬、20~25% 高。
   * margin 讓照片之間不要貼太近。
   */
  const photoW=15;
  const photoH=22;
  const gap=2.5;

  const occupied=[];

  presetShowcase.active.forEach(entry=>{
    if(!entry.el || !entry.el.isConnected)return;

    const left=parseFloat(entry.el.style.left);
    const top=parseFloat(entry.el.style.top);

    if(!isNaN(left) && !isNaN(top)){
      occupied.push({
        left,
        top,
        right:left+photoW,
        bottom:top+photoH
      });
    }
  });

  /*
   * 賓客剛上傳的照片也算進避讓範圍，
   * 避免婚紗照跟賓客照片完全疊在一起。
   */
  polaroidLayer.querySelectorAll(".guest-photo").forEach(el=>{
    const left=parseFloat(el.style.left);
    const top=parseFloat(el.style.top);

    if(!isNaN(left) && !isNaN(top)){
      occupied.push({
        left,
        top,
        right:left+photoW,
        bottom:top+photoH
      });
    }
  });

  function overlaps(a,b){
    return !(
      a.right+gap < b.left ||
      a.left-gap > b.right ||
      a.bottom+gap < b.top ||
      a.top-gap > b.bottom
    );
  }

  /*
   * 最多嘗試 80 次。
   * 找不到完全不重疊的位置，就選「重疊面積最小」的候選。
   */
  let best=null;
  let bestScore=Infinity;

  for(let i=0;i<80;i++){
    const zone=
      zones[Math.floor(Math.random()*zones.length)];

    const left=
      zone.left+
      Math.random()*Math.max(0,zone.width-photoW);

    const top=
      zone.top+
      Math.random()*Math.max(0,zone.height-photoH);

    const candidate={
      left,
      top,
      right:left+photoW,
      bottom:top+photoH
    };

    let score=0;
    let collision=false;

    occupied.forEach(other=>{
      const xOverlap=
        Math.max(
          0,
          Math.min(candidate.right,other.right)-
          Math.max(candidate.left,other.left)
        );

      const yOverlap=
        Math.max(
          0,
          Math.min(candidate.bottom,other.bottom)-
          Math.max(candidate.top,other.top)
        );

      const area=xOverlap*yOverlap;

      if(area>0){
        collision=true;
        score+=area;
      }

      /*
       * 即使沒有真正重疊，也把太近的位置視為扣分。
       */
      const cx=(candidate.left+candidate.right)/2;
      const cy=(candidate.top+candidate.bottom)/2;
      const ox=(other.left+other.right)/2;
      const oy=(other.top+other.bottom)/2;

      const dx=Math.abs(cx-ox);
      const dy=Math.abs(cy-oy);

      if(dx<photoW+gap && dy<photoH+gap){
        score+=(photoW+gap-dx)*0.35;
        score+=(photoH+gap-dy)*0.35;
      }
    });

    if(!collision && score<bestScore){
      bestScore=score;
      best=candidate;
    }

    if(!collision && score<1){
      best=candidate;
      break;
    }
  }

  /*
   * 萬一畫面已經很多照片，仍然保證有位置可用。
   */
  if(!best){
    const zone=zones[
      Math.floor(Math.random()*zones.length)
    ];

    best={
      left:zone.left+
        Math.random()*Math.max(0,zone.width-photoW),
      top:zone.top+
        Math.random()*Math.max(0,zone.height-photoH)
    };
  }

  return {
    left:best.left+"%",
    top:best.top+"%",
    rot:(-10+Math.random()*20)+"deg",
    scale:(0.86+Math.random()*0.24).toFixed(2)
  };
}
function createPresetPhoto(item,animate=true){
  if(!item || !item.url)return null;

  const el=document.createElement("div");
  el.className="polaroid preset-slide";

  const pos=randomPresetPosition();

  el.style.left=pos.left;
  el.style.top=pos.top;
  el.style.setProperty("--rot",pos.rot);
  el.style.setProperty("--scale",pos.scale);
  el.style.setProperty(
    "--float-x",
    (-50+Math.random()*100)+"px"
  );

  el.innerHTML=
    '<img src="'+esc(item.url)+'" alt="">'+
    '<span class="heart">♡</span>';

  applyPhotoOrientation(el,el.querySelector("img"));

  polaroidLayer.appendChild(el);

  if(!animate){
    el.style.animation="none";
    el.style.opacity="1";
    el.style.transform=
      "scale("+pos.scale+") rotate("+pos.rot+")";
  }

  /*
   * 圖片如果要消失，統一「往上飄＋淡出」。
   */
  el.addEventListener("animationend",(ev)=>{
    if(ev.animationName==="polaroidOutUp"){
      if(el.isConnected)el.remove();
    }
  });

  return el;
}

function getNextPresetItem(){
  const items=presetShowcase.items.filter(x=>x && x.url);
  if(!items.length)return null;

  // 先排除目前正在畫面上的照片，避免同一張同時出現
  const activeItems=new Set(
    presetShowcase.active
      .filter(entry=>entry && entry.el && entry.el.isConnected)
      .map(entry=>entry.item)
  );

  let candidates=items.filter(item=>!activeItems.has(item));

  // 再排除最近已經顯示過的照片，盡量避免短時間重複
  const history=presetShowcase.shownHistory || [];
  const fresh=candidates.filter(item=>!history.includes(item));

  if(fresh.length){
    candidates=fresh;
  }else if(!candidates.length){
    // 所有照片都在畫面上時，允許從全部照片重新挑選
    candidates=items.filter(item=>!history.includes(item));

    if(!candidates.length){
      // 整輪都播完了，重新開始一輪，但仍避開目前畫面上的照片
      presetShowcase.shownHistory=[];
      candidates=items.filter(item=>!activeItems.has(item));
    }
  }

  if(!candidates.length)return null;

  const item=candidates[Math.floor(Math.random()*candidates.length)];

  presetShowcase.shownHistory.push(item);

  // 保留最近一段播放紀錄，避免照片很快再次出現
  const limit=Math.max(1,presetShowcase.historyLimit || items.length);
  if(presetShowcase.shownHistory.length>limit){
    presetShowcase.shownHistory.splice(
      0,
      presetShowcase.shownHistory.length-limit
    );
  }

  return item;
}

function setupPresetSlideshow(presets){
  presetShowcase.items=Array.isArray(presets)
    ? presets.filter(x=>x.url)
    : [];

  if(!presetShowcase.items.length)return;

  presetShowcase.active=[];

  /*
   * 初始不是固定六張：
   * 隨機 3～6 張。
   */
  const max=Math.min(
    CONFIG.maxPolaroids,
    presetShowcase.items.length
  );

  const min=Math.min(
    CONFIG.minPresetPhotos,
    max
  );

  const initialCount=
    min + Math.floor(Math.random()*(max-min+1));

  presetShowcase.shownHistory=[];
  presetShowcase.historyLimit=Math.max(
    presetShowcase.items.length,
    CONFIG.maxPolaroids*2
  );

  for(let i=0;i<initialCount;i++){
    const item=getNextPresetItem();
    if(!item)break;

    const el=createPresetPhoto(item,false);

    if(el){
      presetShowcase.active.push({
        item,
        el
      });
    }
  }

  /*
   * 每 5 秒做一次「隨機變化」。
   * 有新資料時，優先補進空位；
   * 沒有新資料時，隨機讓一張淡出，
   * 但永遠維持至少 3 張。
   */
  if(presetShowcase.timer){
    clearInterval(presetShowcase.timer);
  }

  presetShowcase.timer=setInterval(
    refreshPresetPhotos,
    CONFIG.presetSlideInterval
  );
}

function removePresetEntry(entry){
  if(!entry || !entry.el)return;

  const el=entry.el;

  el.classList.remove("leaving");
  el.style.animation="none";
  void el.offsetWidth;
  el.classList.add("leaving");

  setTimeout(()=>{
    if(el.isConnected)el.remove();

    const idx=presetShowcase.active.indexOf(entry);
    if(idx>=0){
      presetShowcase.active.splice(idx,1);
    }
  },CONFIG.presetFadeDuration);
}

function addPresetPhoto(item){
  const el=createPresetPhoto(item,true);

  if(el){
    presetShowcase.active.push({
      item,
      el
    });
  }
}

function refreshPresetPhotos(){
  const items=presetShowcase.items;

  if(!items.length)return;

  // 只計算目前真正還在畫面上的婚紗照
  const candidates=
    presetShowcase.active.filter(x=>x.el && x.el.isConnected);

  const activeCount=candidates.length;

  /*
   * 婚紗照數量採「一步一張」的隨機變化：
   *
   * 3 張：大多數情況增加，偶爾維持
   * 4~5 張：可能增加、維持或減少
   * 6 張：只會維持或減少
   *
   * 因此不會再出現「只要少於 6 張就立刻補滿」的問題。
   * 整體數量會自然在 3~6 張之間流動。
   */
  let action;

  if(activeCount<=CONFIG.minPresetPhotos){
    // 3 張時：70% 增加、30% 維持
    action=Math.random()<0.70 ? "add" : "keep";
  }else if(activeCount>=CONFIG.maxPolaroids){
    // 6 張時：45% 移除、55% 維持
    action=Math.random()<0.45 ? "remove" : "keep";
  }else{
    // 4~5 張：增加 / 維持 / 減少
    const r=Math.random();

    if(r<0.30){
      action="add";
    }else if(r<0.65){
      action="keep";
    }else{
      action="remove";
    }
  }

  // 維持目前數量
  if(action==="keep"){
    return;
  }

  // 增加一張新的婚紗照
  if(action==="add"){
    const item=getNextPresetItem();

    if(item){
      addPresetPhoto(item);
    }

    return;
  }

  // 移除一張，但永遠不低於 3 張
  if(action==="remove"){
    if(activeCount<=CONFIG.minPresetPhotos){
      return;
    }

    const old=
      candidates[Math.floor(Math.random()*candidates.length)];

    removePresetEntry(old);

    return;
  }
}

function rememberKey(id){
  if(state.known.has(id))return false;

  state.known.add(id);
  state.knownOrder.push(id);

  // 長時間播放：限制 known Set 大小
  while(state.knownOrder.length>CONFIG.maxKnown){
    const old=state.knownOrder.shift();
    state.known.delete(old);
  }

  return true;
}

function queueNewItem(item){
  // 純文字進中央訊息 queue。
  // 有照片的事件會在 process() 裡立即處理中央卡片 + 照片。
  if(item && !item.url){
    state.displayQueue.push(item);
  }
}

function showNextQueued(){
  if(!state.displayQueue.length) return;

  const item=state.displayQueue.shift();

  // 純文字：只顯示浮動祝福，不進中央訊息區
  if(!item.photoUrl){
    if(item.text) addBubble(item);
    return;
  }

  // 有照片：中央顯示「傳了圖片＋文字」，同時旁邊顯示實際照片
  addCard(item);
  addPolaroid(item);
  if(item.text) addBubble(item);
}

function process(items){
  if(!Array.isArray(items))return;

  const normalized=items.map(normalize);
  const fresh=[];

  // Poll-only：第一次 poll 只建立時間水位，不重播歷史資料。
  // 婚紗照完全由 presetConfig 管理。
  if(!state.pollInitialized){
    let maxTime=0;
    normalized.forEach(item=>{
      const t=Number(item.time)||0;
      if(t>maxTime)maxTime=t;
      rememberKey(keyOf(item));
      state.items.push(item);
    });
    state.watermarkTime=maxTime;
    state.pollInitialized=true;
    state.items=state.items.slice(-180);
    return;
  }

  normalized.forEach(item=>{
    const id=keyOf(item);
    const t=Number(item.time)||0;
    if(item.kind==="preset")return;
    if(t<=state.watermarkTime)return;
    if(!rememberKey(id))return;
    state.items.push(item);
    fresh.push(item);
    if(t>state.watermarkTime)state.watermarkTime=t;
  });

  if(!fresh.length){
    if(state.items.length>180)state.items=state.items.slice(-180);
    return;
  }

  const photoItems=fresh.filter(x=>x.url);
  const textItems=fresh.filter(x=>!x.url);
  const now=Date.now();
  state.recentPhotoTimes=state.recentPhotoTimes.filter(t=>now-t<CONFIG.photoBurstHoldTime);
  photoItems.forEach(()=>state.recentPhotoTimes.push(Date.now()));

  if(photoItems.length>=CONFIG.photoBurstThreshold || state.recentPhotoTimes.length>=CONFIG.photoBurstThreshold){
    state.photoBurst=true;
    clearTimeout(state.photoBurstTimer);
    state.photoBurstTimer=setTimeout(()=>{
      state.photoBurst=false;
      const guests=Array.from(polaroidLayer.querySelectorAll(".guest-photo"));
      while(guests.length>CONFIG.guestPhotoNormalMax){
        const old=guests.shift();
        if(old)old.remove();
      }
    },CONFIG.photoBurstHoldTime);
  }

  photoItems.forEach(item=>{
    addCard(item);
    addPolaroid(item);
    if(item.text)addBubble(item);
  });
  textItems.forEach(item=>{
    if(item.text)addBubble(item);
  });

  if(state.items.length>180)state.items=state.items.slice(-180);
}

function jsonpRequest(url,callbackName){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    let finished=false;
    let timedOut=false;

    // Apps Script 偶爾會在 timeout 後才把 JSONP 回傳回來。
    // timeout 後保留 callback 一小段時間，避免瀏覽器出現
    // "xxx is not defined"，也避免晚到的回應變成未捕獲錯誤。
    const lateCleanupMs=120000;

    const timeout=setTimeout(()=>{
      timedOut=true;
      finish(new Error("JSONP timeout"));

      setTimeout(()=>{
        try{
          delete window[callbackName];
        }catch(e){
          window[callbackName]=undefined;
        }
      },lateCleanupMs);
    },CONFIG.jsonpTimeout);

    function removeScript(){
      script.onload=null;
      script.onerror=null;
      if(script.parentNode)script.parentNode.removeChild(script);
    }

    function cleanup(){
      clearTimeout(timeout);
      removeScript();

      // 正常成功時立即移除 callback；timeout 時交給 late cleanup。
      if(!timedOut){
        try{
          delete window[callbackName];
        }catch(e){
          window[callbackName]=undefined;
        }
      }
    }

    function finish(error,data){
      if(finished)return;
      finished=true;
      cleanup();

      if(error)reject(error);
      else resolve(data);
    }

    window[callbackName]=(data)=>{
      // timeout 後才到達的 Apps Script 回應只需要安靜地忽略，
      // 不要再次 resolve/reject，也不要觸發 ReferenceError。
      if(timedOut)return;
      finish(null,data);
    };

    script.src=url;
    script.async=true;

    script.onerror=()=>{
      finish(new Error("JSONP load failed"));
    };

    document.head.appendChild(script);
  });
}

async function loadPresetConfig(){
  const cb="weddingPreset_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  try{
    const url=CONFIG.endpoint+"?mode=presetConfig&callback="+encodeURIComponent(cb)+"&t="+Date.now();
    const data=await jsonpRequest(url,cb);
    if(data&&data.ok&&Array.isArray(data.items)){
      setupPresetSlideshow(data.items);
      return;
    }
    throw new Error(data&&data.error?data.error:"Invalid presetConfig response");
  }catch(err){
    console.warn("婚紗照設定載入失敗，賓客即時同步仍會繼續。",err);
  }
}

async function poll(){
  if(state.syncing){
    schedulePoll();
    return;
  }

  // 若瀏覽器拒絕網路權限 / Apps Script 暫時無法存取，
  // 不要每秒持續重試造成瀏覽器反覆跳出權限提示。
  if(state.pausedUntil && Date.now()<state.pausedUntil){
    state.pollDelay=Math.max(CONFIG.minPollInterval,Math.min(10000,state.pausedUntil-Date.now()));
    schedulePoll();
    return;
  }
  if(state.pausedUntil && Date.now()>=state.pausedUntil){
    state.pausedUntil=0;
    state.consecutiveFailures=0;
  }

  if(!navigator.onLine){
    state.online=false;
    updateConnectionDot();
    schedulePoll();
    return;
  }

  state.syncing=true;

  const cb=
    "weddingPoll_"+
    Date.now()+"_"+
    Math.floor(Math.random()*10000);

  try{
    const url=
      CONFIG.endpoint+
      "?mode=poll"+
      "&callback="+encodeURIComponent(cb)+
      "&t="+Date.now();

    const data=await jsonpRequest(url,cb);

    if(data&&data.ok&&Array.isArray(data.items)){
      process(data.items);

      // 成功後恢復 1 秒更新
      state.online=true;
      state.pollDelay=CONFIG.minPollInterval;
      state.consecutiveFailures=0;
      state.pausedUntil=0;
    }else{
      throw new Error(
        data&&data.error
          ? data.error
          : "Invalid poll response"
      );
    }
  }catch(err){
    state.online=navigator.onLine!==false;
    state.consecutiveFailures++;
    state.pollDelay=Math.min(
      Math.max(
        state.pollDelay*2,
        CONFIG.minPollInterval
      ),
      CONFIG.maxPollInterval
    );

    if(state.consecutiveFailures>=CONFIG.maxConsecutiveFailures){
      state.pausedUntil=Date.now()+CONFIG.failurePause;
      console.warn(
        "同步連續失敗，暫停自動重試 60 秒。若是瀏覽器權限提示，允許後會自動恢復。",
        err
      );
    }else{
      console.warn(
        "同步暫時失敗，將於 "+
        Math.round(state.pollDelay/1000)+
        " 秒後重試",
        err
      );
    }
  }finally{
    state.syncing=false;
    updateConnectionDot();
    schedulePoll();
  }
}

function schedulePoll(){
  if(state.pollTimer){
    clearTimeout(state.pollTimer);
  }

  state.pollTimer=setTimeout(
    poll,
    state.pollDelay
  );
}

function updateConnectionDot(){
  const dot=document.getElementById("connectionDot");
  if(!dot)return;

  dot.classList.toggle(
    "online",
    state.online && navigator.onLine!==false
  );

  dot.classList.toggle(
    "offline",
    !state.online || navigator.onLine===false
  );
}

/*
 * 網路恢復時不要等下一個 polling，
 * 直接重新同步。
 */
window.addEventListener("online",()=>{
  state.online=true;
  state.pollDelay=CONFIG.minPollInterval;
  state.consecutiveFailures=0;
  state.pausedUntil=0;
  updateConnectionDot();

  if(state.pollTimer){
    clearTimeout(state.pollTimer);
    state.pollTimer=null;
  }

  poll();
});

window.addEventListener("offline",()=>{
  state.online=false;
  updateConnectionDot();

  if(state.pollTimer){
    clearTimeout(state.pollTimer);
    state.pollTimer=null;
  }
});

/*
 * Chrome 分頁被切到背景再回來時立即補抓一次。
 * 婚禮現場長時間播放比較不容易漏資料。
 */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    // 如果剛因權限 / 網路錯誤進入暫停期，不要因切換分頁又立刻重試。
    if(state.pausedUntil && Date.now()<state.pausedUntil){
      schedulePoll();
      return;
    }
    state.pollDelay=CONFIG.minPollInterval;

    if(!state.syncing){
      if(state.pollTimer){
        clearTimeout(state.pollTimer);
        state.pollTimer=null;
      }
      poll();
    }
  }
});

function createPetals(){
  for(let i=0;i<12;i++){
    const p=document.createElement("i");
    p.className="petal";
    p.style.left=(Math.random()*100)+"%";
    p.style.setProperty("--dx",(Math.random()*26-13)+"vw");
    p.style.setProperty("--rot",(Math.random()*180)+"deg");
    p.style.setProperty("--dur",(7+Math.random()*8)+"s");
    p.style.animationDelay=(-Math.random()*12)+"s";
    wall.appendChild(p);
  }
}

createPetals();

updateConnectionDot();

// Poll-only 啟動：presetConfig 只呼叫一次；poll 負責新的賓客資料。
// 兩者互不等待，婚紗照圖片會由瀏覽器逐張載入。
requestAnimationFrame(()=>{
  loadPresetConfig();
  poll();
});

setInterval(showNextQueued,CONFIG.queueInterval);

setInterval(()=>{
  document.querySelectorAll(".live-time").forEach(el=>{
    const card=el.closest(".live-card");
    if(!card)return;

    const id=card.dataset.itemId;
    const item=state.items.find(
      x=>keyOf(x)===id
    );

    if(item){
      el.textContent=timeText(item.time);
    }
  });
},10000);
