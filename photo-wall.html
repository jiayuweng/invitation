<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--cream:#fbf6ee;--ink:#5d493c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#241c1c;color:#fff;font-family:"Noto Serif TC","PingFang TC",serif}
body{overflow:hidden}
.wall{position:relative;width:100vw;height:100svh;overflow:hidden;background:#191715}
.stage{position:absolute;inset:0;background:#eee5d8 url("assets/hero-forest.jpg") center/cover no-repeat}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#160d0dcc 0%,transparent 35%,transparent 68%,#160d0d88 100%),linear-gradient(0deg,#160d0dcc 0%,transparent 45%);pointer-events:none}
.brand{position:absolute;z-index:20;left:50%;top:5.5%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 3px 18px #0009}
.brand b{display:block;font-family:"Ma Shan Zheng",cursive;font-size:clamp(30px,4.2vw,70px);line-height:1;font-weight:400}
.brand span{display:block;margin-top:9px;font-size:clamp(9px,1.1vw,18px);letter-spacing:.34em}
.live{position:absolute;z-index:20;right:3%;top:4%;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #fff6;border-radius:999px;background:#211d1bcc;font-family:"Ma Shan Zheng",serif;font-size:clamp(10px,1vw,14px);letter-spacing:.12em;backdrop-filter:blur(7px)}
.live i{width:8px;height:8px;border-radius:50%;background:#e38e7a;box-shadow:0 0 0 5px #e38e7a2e;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}

.qr-card{position:absolute;z-index:30;left:16px;top:16px;width:76px;padding:6px;border-radius:14px;background:#fffaf0ee;box-shadow:0 8px 24px #0006}
.qr-card img{display:block;width:64px;height:64px}

.feed-layer{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.feed-item{position:absolute;width:clamp(115px,12vw,205px);padding:7px 9px;border:1px solid #fff8;border-radius:13px;background:#21191de8;color:#fff;box-shadow:0 12px 30px #0008;backdrop-filter:blur(8px);opacity:0;animation:feedIn .9s cubic-bezier(.18,.8,.25,1) both}
.feed-item.photo-only{padding:5px;background:#fff3}
.feed-item img{display:block;width:100%;height:auto;max-height:135px;object-fit:contain;border-radius:9px;background:#130f0f}
.feed-row{display:flex;align-items:flex-start;gap:7px}
.avatar{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f0b49b,#9d6679);border:1px solid #fff;font-size:12px;font-weight:700}
.feed-content{min-width:0}
.feed-name{font-size:11px;opacity:.82}
.feed-text{margin-top:3px;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:clamp(12px,1.05vw,17px);line-height:1.4;word-break:break-word}
@keyframes feedIn{0%{opacity:0;transform:translate3d(var(--from-x),var(--from-y),0) scale(.45) rotate(var(--from-r));filter:blur(5px)}55%{opacity:1}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(var(--r));filter:blur(0)}}
@keyframes feedOut{to{opacity:0;transform:translate3d(var(--to-x),var(--to-y),0) scale(.7) rotate(var(--to-r));filter:blur(2px)}}
.feed-item.leaving{animation:feedOut .8s ease both}

.latest-message{position:absolute;left:50%;bottom:6.5%;z-index:25;width:min(420px,42vw);padding:12px 16px;transform:translateX(-50%);border:1px solid #fff9;border-radius:16px;background:#3c2930e8;color:#fff;box-shadow:0 14px 35px #0009;backdrop-filter:blur(9px);animation:latestIn .7s ease both;pointer-events:none}
.latest-row{display:flex;align-items:flex-start;gap:9px}
.latest-avatar{width:31px;height:31px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#f0b49b,#9d6679);border:1px solid #fff;font-weight:700}
.latest-name{font-size:11px;opacity:.8}
.latest-text{margin-top:2px;font-family:"Ma Shan Zheng","Noto Serif TC",serif;font-size:clamp(14px,1.4vw,21px);line-height:1.45}
@keyframes latestIn{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

.connection-status{position:absolute;right:3%;bottom:3%;z-index:30;font-family:"Ma Shan Zheng",serif;font-size:11px;opacity:.5}

@media(max-width:700px){
 .brand{top:5%}.brand b{font-size:28px}.brand span{font-size:9px}
 .live{right:3%;top:3%;padding:6px 9px;font-size:9px}
 .qr-card{left:8px;top:8px;width:58px;padding:4px}.qr-card img{width:50px;height:50px}
 .feed-item{width:42vw;padding:7px 8px}.feed-item img{max-height:105px}
 .latest-message{width:78vw;bottom:5.5%;padding:9px 11px}.latest-text{font-size:14px}
}
</style>
</head>

<body>
<main class="wall">
  <div class="stage"></div>

  <div class="brand">
    <b>Yu-Ming &amp; Jia-Yu</b>
    <span>OUR WEDDING DAY</span>
  </div>

  <div class="live"><i></i><span>現場照片牆</span></div>

  <a class="qr-card" href="https://jiayuweng.github.io/invitation/upload.html" target="_blank" rel="noopener">
    <img id="qr" alt="掃碼上傳照片">
  </a>

  <div id="feedLayer" class="feed-layer"></div>
  <div id="latestMessage" class="latest-message" style="display:none"></div>
  <div id="status" class="connection-status">即時同步中</div>
</main>

<script>
const DATA_ENDPOINT="https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec";
const UPLOAD_URL="https://jiayuweng.github.io/invitation/upload.html";

document.getElementById("qr").src=
  "https://quickchart.io/qr?size=180&text="+encodeURIComponent(UPLOAD_URL);

const feedLayer=document.getElementById("feedLayer");
const latest=document.getElementById("latestMessage");
const statusEl=document.getElementById("status");

const playlist=[];
const known=new Set();
const shownBlessings=new Set();
const active=new Map();

const slots=[
 ["3%","21%"],["22%","30%"],["43%","18%"],["68%","21%"],
 ["82%","39%"],["7%","64%"],["30%","72%"],["67%","69%"]
];

function s(v){return String(v==null?"":v).trim()}
function esc(v){return s(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

function getName(x){return s(x.name||x.Name||x.姓名||x.nickname||"親友")}
function getText(x){return s(x.text||x.message||x.blessing||x.留言||x.祝福)}
function getUrl(x){return s(x.url||x.photoUrl||x.imageUrl||x.image||x.photo||x.照片)}
function getKind(x){return s(x.kind||x.type||x.類型||"upload").toLowerCase()}

/* Google Drive 各種網址都轉成可嵌入圖片 */
function driveUrl(url){
  url=s(url);
  if(!url)return "";

  let m;

  m=url.match(/[?&]id=([^&]+)/);
  if(m && url.includes("drive.google.com")){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600";
  }

  m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600";
  }

  m=url.match(/drive\.usercontent\.google\.com\/download\?id=([^&]+)/);
  if(m){
    return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600";
  }

  if(url.includes("drive.google.com/thumbnail")){
    if(!url.includes("sz="))url+=(url.includes("?")?"&":"?")+"sz=w1600";
    return url;
  }

  return url;
}

function sourceId(x,i){
  const v=x.sourceId||x.id||x.ID||x.timestamp||x.time||x.createdAt||x.created||x.rowNumber||x.row;
  return s(v)||[getName(x),getText(x),getUrl(x),i].join("|");
}

function normalize(x,i){
  const id=sourceId(x,i);
  return {...x,
    sourceId:id,
    id:id,
    name:getName(x),
    text:getText(x),
    kind:getKind(x),
    url:driveUrl(getUrl(x))
  };
}

function extract(payload){
  if(Array.isArray(payload))return payload;
  if(!payload||typeof payload!=="object")return [];
  if(Array.isArray(payload.items))return payload.items;
  if(Array.isArray(payload.photos))return payload.photos;
  if(Array.isArray(payload.data))return payload.data;

  const a=[];
  if(Array.isArray(payload.preset))a.push(...payload.preset);
  if(Array.isArray(payload.live))a.push(...payload.live);
  if(Array.isArray(payload.uploads))a.push(...payload.uploads);
  if(Array.isArray(payload.blessings))a.push(...payload.blessings);
  return a;
}

function addNew(raw){
  const result=[];

  raw.forEach((x,i)=>{
    if(!x)return;
    const item=normalize(x,i);
    if(!item.sourceId||known.has(item.sourceId))return;

    known.add(item.sourceId);
    playlist.push(item);
    result.push(item);
  });

  return result;
}

let busy=false;

async function poll(){
  if(busy)return;
  busy=true;

  try{
    /* 每次使用不同 URL，避免 Google Apps Script / CDN 快取 */
    const response=await fetch(DATA_ENDPOINT+"?t="+Date.now(),{
      cache:"no-store",
      method:"GET"
    });

    if(!response.ok)throw new Error("HTTP "+response.status);

    const payload=await response.json();
    const incoming=addNew(extract(payload));

    incoming.forEach((item,i)=>{
      addCard(item);
      if(getText(item))showBlessing(item,i*250);
    });

    statusEl.textContent="即時同步中";

  }catch(e){
    console.warn("照片同步失敗",e);
    statusEl.textContent="同步連線中…";
  }finally{
    busy=false;
  }
}

function addCard(item){
  if(active.has(item.sourceId))return;

  if(active.size>=8){
    const oldKey=active.keys().next().value;
    removeCard(oldKey);
  }

  const el=document.createElement("article");
  const photo=!!item.url;
  const text=!!getText(item);

  el.className="feed-item"+(photo&&!text?" photo-only":"");

  const p=slots[active.size%slots.length];
  el.style.left=p[0];
  el.style.top=p[1];

  el.style.setProperty("--from-x",(Math.random()>.5?"":"-")+(18+Math.round(Math.random()*20))+"vw");
  el.style.setProperty("--from-y",(15+Math.round(Math.random()*20))+"vh");
  el.style.setProperty("--from-r",(Math.random()*18-9)+"deg");
  el.style.setProperty("--r",(Math.random()*6-3)+"deg");
  el.style.setProperty("--to-x",(Math.random()>.5?"":"-")+(16+Math.round(Math.random()*20))+"vw");
  el.style.setProperty("--to-y","-24vh");
  el.style.setProperty("--to-r",(Math.random()*18-9)+"deg");
  el.dataset.key=item.sourceId;

  let html="";

  if(text){
    html+='<div class="feed-row"><div class="avatar">'+esc(getName(item).slice(0,1)||"♡")+'</div><div class="feed-content"><div class="feed-name">'+esc(getName(item))+'</div><div class="feed-text">'+esc(getText(item))+'</div></div></div>';
  }

  if(photo){
    html+='<img src="'+esc(item.url)+'" alt="婚禮照片">';
  }

  el.innerHTML=html;
  feedLayer.appendChild(el);
  active.set(item.sourceId,el);

  /* 如果 Google Drive 圖片真的載不到，不讓破圖圖示一直留著 */
  const img=el.querySelector("img");
  if(img){
    img.addEventListener("error",()=>{
      console.warn("照片無法載入:",item.url);
      if(!getText(item))removeCard(item.sourceId);
    },{once:true});
  }
}

function removeCard(key){
  const el=active.get(key);
  if(!el){
    active.delete(key);
    return;
  }

  el.classList.add("leaving");
  el.addEventListener("animationend",()=>{
    el.remove();
    active.delete(key);
  },{once:true});
}

let latestTimer;

function showBlessing(item,delay){
  if(shownBlessings.has(item.sourceId))return;
  shownBlessings.add(item.sourceId);

  setTimeout(()=>{
    latest.style.display="block";
    latest.innerHTML=
      '<div class="latest-row">'+
        '<div class="latest-avatar">'+esc(getName(item).slice(0,1)||"♡")+'</div>'+
        '<div><div class="latest-name">'+esc(getName(item))+'</div>'+
        '<div class="latest-text">'+esc(getText(item))+'</div></div>'+
      '</div>';

    latest.classList.remove("out");
    void latest.offsetWidth;

    clearTimeout(latestTimer);
    latestTimer=setTimeout(()=>{
      latest.classList.add("out");
      setTimeout(()=>latest.style.display="none",850);
    },5200);
  },delay||0);
}

/* 啟動：第一次立即抓 */
poll();

/* 唯一輪詢：每 2 秒 */
setInterval(poll,2000);
</script>
</body>
</html>
