<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>婚禮現場照片牆｜劉育名 & 翁佳瑜</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ee;--ink:#5d493c;--muted:#a58973}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2a2522;color:var(--cream);font-family:"Noto Serif TC","PingFang TC",serif}body{display:grid;place-items:center;min-height:100svh;padding:14px}.wall{position:relative;width:min(100vw - 28px,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#191715;border-radius:10px;box-shadow:0 24px 80px #0009}.stage{position:absolute;inset:0;display:grid;place-items:center;background:#eee5d8 url('assets/hero-forest.jpg') center/cover no-repeat}.stage-photo{width:100%;height:100%;display:block;object-fit:contain;animation:photoIn 1.2s ease both}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#16120f99 0%,transparent 42%,transparent 70%,#16120f33 100%),linear-gradient(0deg,#16120f99 0%,transparent 42%);pointer-events:none}.brand{position:absolute;top:4.5%;left:4.2%;z-index:2;text-shadow:0 2px 16px #0008}.brand b{display:block;font:clamp(18px,3vw,48px)/1 "DM Serif Display",serif;letter-spacing:.04em}.brand span{display:block;margin-top:8px;font-size:clamp(9px,1vw,15px);letter-spacing:.25em;opacity:.85}.live{position:absolute;z-index:3;right:4%;top:5%;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #fff6;border-radius:999px;background:#211d1bcc;font-size:clamp(9px,1vw,14px);letter-spacing:.12em}.live i{width:8px;height:8px;border-radius:50%;background:#e38e7a;box-shadow:0 0 0 5px #e38e7a2e;animation:pulse 2s infinite}.message{position:absolute;z-index:3;left:4.2%;bottom:7%;max-width:54%;padding:clamp(12px,1.8vw,26px) clamp(16px,2.2vw,34px);border:1px solid #fff8;border-radius:14px;background:#fffaf0e8;color:var(--ink);box-shadow:0 10px 35px #1c120d55;backdrop-filter:blur(10px);animation:messageIn .8s ease both}.message small{display:block;margin-bottom:7px;color:#a67569;font-size:clamp(10px,1.1vw,16px);letter-spacing:.15em}.message strong{display:block;font-size:clamp(18px,2vw,32px);font-weight:500;line-height:1.55;letter-spacing:.08em}.message em{display:block;margin-top:8px;color:var(--muted);font-size:clamp(10px,1vw,14px);font-style:normal;letter-spacing:.14em}.counter{position:absolute;z-index:3;right:4%;bottom:7%;font:clamp(13px,1.2vw,20px) "DM Serif Display",serif;letter-spacing:.15em;text-shadow:0 2px 12px #0008}.queue{position:absolute;z-index:3;right:4%;bottom:15%;display:flex;gap:8px}.thumb{width:clamp(48px,6vw,94px);height:clamp(34px,4vw,60px);padding:0;overflow:hidden;border:1px solid #fff8;border-radius:6px;background:#ffffff22;opacity:.72;cursor:pointer;transition:.2s}.thumb:hover,.thumb.active{opacity:1;border-color:#fff;transform:translateY(-3px)}.thumb img{width:100%;height:100%;object-fit:cover}.hint{position:absolute;z-index:3;left:4.2%;top:17%;color:#fff9;font-size:clamp(9px,1vw,14px);letter-spacing:.12em}@keyframes photoIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}@keyframes messageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}@media(max-width:700px){body{padding:0}.wall{width:100vw;border-radius:0}.brand{top:5%;left:5%}.message{left:5%;bottom:8%;max-width:68%;padding:10px 13px;border-radius:10px}.message strong{font-size:16px}.message small,.message em{font-size:9px}.queue{right:5%;bottom:8%;gap:4px}.thumb{width:42px;height:29px}.counter{right:5%;bottom:4%;font-size:12px}.hint{left:5%;top:17%;font-size:9px}}
.qr-card{position:absolute;z-index:5;right:24px;bottom:24px;width:118px;padding:10px 10px 9px;border-radius:12px;background:#fffaf0ee;color:#5d493c;text-decoration:none;text-align:center;box-shadow:0 8px 24px #0006;backdrop-filter:blur(8px)}.qr-card img{width:82px;height:82px;display:block;margin:0 auto 6px;background:#fff}.qr-card span{font-size:11px;line-height:1.45;letter-spacing:.08em}.qr-card:hover{transform:translateY(-2px)}@media(max-width:700px){.qr-card{right:10px;bottom:10px;width:82px;padding:6px}.qr-card img{width:58px;height:58px;margin-bottom:3px}.qr-card span{font-size:8px}}</style>
<style>
  .message,.hint,.live,.qr-card{font-family:"Ma Shan Zheng","Noto Serif TC",serif}
  .message strong{font-weight:400;text-shadow:0 1px 0 #5d493c55}
  .message small,.message em,.hint,.live,.qr-card span{font-weight:600}
</style>
</head>
<body><main class="wall" aria-label="婚禮現場照片牆"><div class="stage"><div id="stageGrid" class="stage-grid"></div><img id="stagePhoto" class="stage-photo" alt="婚禮現場照片"></div><div class="veil"></div><div class="brand"><b>Yu-Ming &amp; Jia-Yu</b><span>OUR WEDDING DAY</span></div><div class="live"><i></i>現場照片牆</div><div class="hint">新照片會自動加入播放佇列</div><div class="message" id="message"><small id="messageName">親愛的新人</small><strong id="messageText">願你們一直幸福下去 ♡</strong><em id="messageTime">現場祝福</em></div><div class="queue" id="queue" aria-label="播放佇列"></div><div class="counter" id="counter">01 / 06</div><a class="qr-card" href="https://jiayuweng.github.io/invitation/" target="_blank" rel="noopener" aria-label="掃描上傳照片與祝福"><img src="https://quickchart.io/qr?size=180&text=https%3A%2F%2Fjiayuweng.github.io%2Finvitation%2F" alt="掃碼上傳照片 QR Code"><span>掃碼上傳照片<br>寫下祝福</span></a></main>
<script>
const queue=document.getElementById('queue'),photo=document.getElementById('stagePhoto'),nameEl=document.getElementById('messageName'),textEl=document.getElementById('messageText'),timeEl=document.getElementById('messageTime'),counter=document.getElementById('counter');let playlist=[],index=0;function renderQueue(){queue.innerHTML='';playlist.slice(Math.max(0,index-2),index+4).forEach((item,offset)=>{const real=Math.max(0,index-2)+offset,b=document.createElement('button');b.className='thumb'+(real===index?' active':'');b.title=item.name;b.innerHTML=`<img src="${item.url}" alt="${item.name}的照片">`;b.onclick=()=>show(real);queue.appendChild(b)})}function show(next){if(!playlist.length){nameEl.textContent='';textEl.textContent='';timeEl.textContent='';return}index=(next+playlist.length)%playlist.length;const item=playlist[index];if(item.url){photo.style.display='block';photo.src=item.url}else{photo.style.display='none'}nameEl.textContent=item.text?(item.name||'親友'):'';textEl.textContent=item.text||'';timeEl.textContent=item.text?(item.kind==='upload'?'現場祝福':item.kind==='preset'?'預先婚紗照':'祝福留言'):'';document.getElementById('message').style.display=item.text?'block':'none';counter.textContent=`${String(index+1).padStart(2,'0')} / ${String(playlist.length).padStart(2,'0')}`;renderQueue()}function appendIncoming(items){const known=new Set(playlist.map(p=>p.sourceId||p.id));items.filter(p=>p.id&&!known.has(p.id)).forEach(p=>playlist.push({...p,sourceId:p.id,url:((p.url||'').replace('/uc?export=view&id=','/thumbnail?id=')+'&sz=w1200'),id:`${p.kind||'upload'}-${p.id}`}));renderQueue()}const DATA_ENDPOINT='https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec';async function pollIncoming(){if(!DATA_ENDPOINT)return;try{const response=await fetch(DATA_ENDPOINT,{cache:'no-store'});if(response.ok)appendIncoming(await response.json())}catch(error){console.warn('照片同步暫時無法連線',error)}}const posterPreload=new Image();posterPreload.src='assets/hero-forest.jpg';const stageGrid=document.getElementById('stageGrid');const gridStyle=document.createElement('style');gridStyle.textContent='.stage-grid{position:absolute;inset:0;display:grid;gap:10px;padding:10px;z-index:1}.stage-grid.tile-1{grid-template-columns:1fr}.stage-grid.tile-2{grid-template-columns:repeat(2,1fr)}.stage-grid.tile-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid.tile-6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}.stage-grid .tile{position:relative;overflow:hidden;border-radius:8px;background:#211d1b;box-shadow:0 8px 24px #0005}.stage-grid .tile img{width:100%;height:100%;object-fit:cover;display:block}.stage-grid .tile span{position:absolute;left:8px;right:8px;bottom:7px;padding:5px 7px;border-radius:5px;background:#211d1bcc;color:#fff;font-size:clamp(10px,1.1vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-grid .tile b{font-weight:500;margin-right:6px}.stage-photo{display:none!important}@media(max-width:700px){.stage-grid{gap:4px;padding:4px}.stage-grid .tile span{font-size:9px;left:4px;right:4px;bottom:4px;padding:3px}}';document.head.appendChild(gridStyle);function renderGrid(){if(!playlist.length){stageGrid.innerHTML='';return}const count=playlist.length<=1?1:playlist.length<=3?2:playlist.length<=8?4:6;stageGrid.className='stage-grid tile-'+count;stageGrid.innerHTML='';for(let n=0;n<count;n++){const item=playlist[(index+n)%playlist.length],tile=document.createElement('div');tile.className='tile';if(item.url){tile.innerHTML='<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'">'}else{tile.innerHTML='<div class="text-tile">'+(item.text||'')+'</div>'}stageGrid.appendChild(tile)}}show(0);renderGrid();setInterval(()=>{show(index+1);renderGrid()},8000);setInterval(renderGrid,1000);setInterval(pollIncoming,5000);pollIncoming();
</script>
<script>
// Normalize Google Apps Script responses so preset and live photos both enter the carousel.
(async function syncPhotoCollections(){
  try{
    const response=await fetch('https://script.google.com/macros/s/AKfycbwiBfLfxWrImX3Z8Mi1qqxxHaReprYiiu8j7VMnaFKFQyRGmIJaQ5h2iifUXpReVQlB/exec',{cache:'no-store'});
    if(!response.ok)return;
    const payload=await response.json();
    const items=Array.isArray(payload)?payload:(payload.items||payload.photos||payload.data||[].concat(payload.preset||[],payload.live||[],payload.uploads||[]));
    if(Array.isArray(items)&&items.length)appendIncoming(items);
  }catch(error){console.warn('照片同步暫時無法連線',error)}
})();
</script>
<style>
  .brand{left:50%;top:4.5%;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .stage-grid .tile img{object-fit:contain;background:#211d1b}
  .stage-grid.tile-5{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
  .stage-grid.tile-5 .tile:first-child{grid-column:2}
  .qr-card{left:16px;top:20%;right:auto;bottom:auto;width:92px;padding:7px 7px 6px;opacity:.9}
  .qr-card img{width:64px;height:64px;margin-bottom:4px}
  .qr-card span{font-size:9px}
  .live{font-size:0;padding:8px}
  .live i{display:block}
  html,body{background:transparent}
  body{padding:0}
  .wall{width:100vw;max-width:none;border-radius:0;box-shadow:none;background:transparent}
  .stage-grid .tile{background:transparent;box-shadow:none}
  .brand{display:none}
  .qr-card{left:16px;top:16px;width:76px;padding:6px;right:auto;bottom:auto}
  .qr-card img{width:64px;height:64px;margin:0}
  .qr-card span{display:none}
  @media(max-width:700px){.qr-card{left:8px;top:8px;width:58px;padding:4px}.qr-card img{width:50px;height:50px}}
</style>
<script>
  // Use five slots for larger playlists, leaving the title/QR area clear.
  renderGrid=function(){
    if(!playlist.length){stageGrid.innerHTML='';return}
    const count=playlist.length<=1?1:playlist.length<=3?2:5;
    stageGrid.className='stage-grid tile-'+count;
    stageGrid.innerHTML='';
    for(let n=0;n<count;n++){
      const item=playlist[(index+n)%playlist.length],tile=document.createElement('div');
      tile.className='tile';
      tile.innerHTML=item.url?'<img src="'+item.url+'" alt="'+(item.name||'婚禮照片')+'">':'<div class="text-tile">'+(item.text||'')+'</div>';
      stageGrid.appendChild(tile);
    }
  };
  renderGrid();
</script>
</body></html>
